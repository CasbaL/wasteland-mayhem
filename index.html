'use strict';

/* ============================================================
   基础工具
   ============================================================ */
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const hyp = Math.hypot;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const wrapA = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
function lerpAng(a, b, t) { return a + wrapA(b - a) * clamp(t, 0, 1); }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return (h ^ h >>> 16) >>> 0; }
function fmtTime(s) { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function fmtNum(n) { return Math.round(n).toLocaleString('en-US'); }
function rr(g, x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function circ(g, x, y, r) { g.beginPath(); g.arc(x, y, Math.max(0, r), 0, TAU); }
function polyPath(g, pts, x = 0, y = 0) { g.beginPath(); g.moveTo(pts[0][0] + x, pts[0][1] + y); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0] + x, pts[i][1] + y); g.closePath(); }
function blobPts(rng, n, r, jit) { const p = []; for (let i = 0; i < n; i++) { const a = i / n * TAU, v = r * (1 + (rng() * 2 - 1) * jit); p.push([Math.cos(a) * v, Math.sin(a) * v]); } return p; }
function starPts(n, jit) { const p = []; for (let i = 0; i < n * 2; i++) { const a = i / (n * 2) * TAU, v = i % 2 ? 1 - jit * rand(0.5, 1.4) : 1; p.push([Math.cos(a) * v, Math.sin(a) * v]); } return p; }
function ptInRect(x, y, r) { return !!r && x >= r.x && y >= r.y && x <= r.x + r.w && y <= r.y + r.h; }
function poolKill(arr, free, i) { const o = arr[i]; arr[i] = arr[arr.length - 1]; arr.pop(); if (free) free.push(o); }

const PIXEL_BUDGET = 3.4e6;   // 内部渲染像素预算：高分屏上超过这个量，全屏填充类绘制就开始吃不掉 16.7ms 的帧预算
function resize() {

  W = Math.max(320, window.innerWidth); H = Math.max(240, window.innerHeight);

  DPR = Math.max(1, Math.min(devDpr, Math.sqrt(PIXEL_BUDGET / (W * H)))) * resScale;
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);

/* ============================================================
   音频（Web Audio 实时合成，无外部文件）
   ============================================================ */
const Snd = {
  ctx: null, master: null, sfx: null, music: null, noiseBuf: null, muted: false, gateT: {},
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        const ac = this.ctx = new AC();
        this.master = ac.createGain(); this.master.gain.value = this.muted ? 0 : 1; this.master.connect(ac.destination);
        this.sfx = ac.createGain(); this.sfx.gain.value = 0.5; this.sfx.connect(this.master);
        this.music = ac.createGain(); this.music.gain.value = 0; this.music.connect(this.master);
        const len = ac.sampleRate | 0, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        this.noiseBuf = buf;
      } catch (e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  },
  setMute(m) { this.muted = m; if (this.ctx) this.master.gain.setTargetAtTime(m ? 0 : 1, this.ctx.currentTime, 0.02); },
  gate(name, ms) { const now = performance.now(), last = this.gateT[name] || 0; if (now - last < ms) return false; this.gateT[name] = now; return true; },
  tone(o) {
    const ac = this.ctx; if (!ac) return;
    const t0 = ac.currentTime + Math.max(0, o.delay || 0);
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(Math.max(1, o.f0), t0);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t0 + o.dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(o.vol, t0 + (o.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
    let node = osc;
    if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q || 1; osc.connect(f); node = f; }
    node.connect(g); g.connect(o.dest || this.sfx);
    osc.start(t0); osc.stop(t0 + o.dur + 0.05);
  },
  noise(o) {
    const ac = this.ctx; if (!ac || !this.noiseBuf) return;
    const t0 = ac.currentTime + Math.max(0, o.delay || 0);
    const src = ac.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = ac.createBiquadFilter(); f.type = o.type || 'lowpass'; f.Q.value = o.q || 0.7;
    f.frequency.setValueAtTime(Math.max(20, o.f0), t0);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t0 + o.dur);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(o.vol, t0 + (o.attack || 0.003)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
    src.connect(f); f.connect(g); g.connect(o.dest || this.sfx);
    src.start(t0, Math.random() * 0.5); src.stop(t0 + o.dur + 0.05);
  }
};

const SFX = {
  ok() { return !!Snd.ctx; },
  shoot() { if (!this.ok() || !Snd.gate('shoot', 40)) return; const p = rand(0.88, 1.12); Snd.noise({ dur: 0.07, vol: 0.2, type: 'highpass', f0: 1100 * p }); Snd.tone({ type: 'square', f0: 380 * p, f1: 110, dur: 0.09, vol: 0.13 }); },
  hit() { if (!this.ok() || !Snd.gate('hit', 45)) return; Snd.tone({ type: 'triangle', f0: rand(700, 1000), f1: 300, dur: 0.045, vol: 0.1 }); },
  crit() { if (!this.ok() || !Snd.gate('crit', 80)) return; Snd.tone({ type: 'square', f0: 1500, f1: 900, dur: 0.07, vol: 0.09 }); Snd.tone({ type: 'sine', f0: 2300, f1: 1800, dur: 0.12, vol: 0.09, delay: 0.02 }); },
  kill() { if (!this.ok() || !Snd.gate('kill', 60)) return; Snd.noise({ dur: 0.14, vol: 0.2, type: 'lowpass', f0: 1400, f1: 200 }); Snd.tone({ type: 'sine', f0: 240, f1: 50, dur: 0.14, vol: 0.24 }); },
  boom() { if (!this.ok() || !Snd.gate('boom', 70)) return; Snd.noise({ dur: 0.6, vol: 0.5, type: 'lowpass', f0: 2600, f1: 90 }); Snd.tone({ type: 'sine', f0: 120, f1: 32, dur: 0.5, vol: 0.55 }); Snd.tone({ type: 'square', f0: 90, f1: 40, dur: 0.12, vol: 0.18 }); },
  hurt() { if (!this.ok()) return; Snd.tone({ type: 'sawtooth', f0: 320, f1: 80, dur: 0.28, vol: 0.26 }); Snd.noise({ dur: 0.2, vol: 0.2, type: 'bandpass', f0: 700, q: 1.5 }); },
  shieldBreak() { if (!this.ok()) return; Snd.tone({ type: 'triangle', f0: 1300, f1: 180, dur: 0.3, vol: 0.2 }); Snd.noise({ dur: 0.2, vol: 0.12, type: 'highpass', f0: 2500 }); },
  dash() { if (!this.ok()) return; Snd.noise({ dur: 0.2, vol: 0.22, type: 'bandpass', f0: 500, f1: 2600, q: 1.2 }); },
  pickup() { if (!this.ok() || !Snd.gate('pickup', 60)) return; Snd.tone({ type: 'sine', f0: 880, f1: 1500, dur: 0.07, vol: 0.08 }); },
  heal() { if (!this.ok()) return; Snd.tone({ type: 'triangle', f0: 500, f1: 900, dur: 0.25, vol: 0.18 }); },
  reload() { if (!this.ok()) return; Snd.tone({ type: 'square', f0: 220, dur: 0.03, vol: 0.12 }); Snd.tone({ type: 'square', f0: 160, dur: 0.04, vol: 0.12, delay: 0.08 }); },
  reloadDone() { if (!this.ok()) return; Snd.tone({ type: 'square', f0: 330, dur: 0.04, vol: 0.12 }); Snd.tone({ type: 'square', f0: 520, dur: 0.05, vol: 0.12, delay: 0.05 }); },
  zap() { if (!this.ok() || !Snd.gate('zap', 90)) return; for (let i = 0; i < 6; i++) Snd.tone({ type: 'square', f0: rand(1200, 2400), dur: 0.018, vol: 0.05, delay: i * 0.016 }); },
  burn() { if (!this.ok() || !Snd.gate('burn', 260)) return; Snd.noise({ dur: 0.14, vol: 0.05, type: 'lowpass', f0: 1800, f1: 500 }); },
  levelup() { if (!this.ok()) return; [523, 659, 784, 1046, 1318].forEach((f, i) => Snd.tone({ type: 'triangle', f0: f, dur: 0.16, vol: 0.16, delay: i * 0.07 })); },
  hover() { if (!this.ok() || !Snd.gate('hover', 50)) return; Snd.tone({ type: 'sine', f0: 520, dur: 0.035, vol: 0.05 }); },
  select() { if (!this.ok()) return; Snd.tone({ type: 'square', f0: 880, dur: 0.08, vol: 0.12 }); Snd.tone({ type: 'sine', f0: 1320, dur: 0.14, vol: 0.12, delay: 0.05 }); },
  loot() { if (!this.ok()) return; [392, 523, 659, 784, 1046, 1318].forEach((f, i) => Snd.tone({ type: 'triangle', f0: f, dur: 0.14, vol: 0.15, delay: i * 0.07 })); },
  wave() { if (!this.ok()) return; Snd.tone({ type: 'sawtooth', f0: 110, f1: 220, dur: 0.5, vol: 0.16, lp: 900 }); Snd.tone({ type: 'sawtooth', f0: 110, f1: 220, dur: 0.5, vol: 0.16, lp: 900, delay: 0.25 }); },
  death() { if (!this.ok()) return; [440, 370, 311, 220].forEach((f, i) => Snd.tone({ type: 'sawtooth', f0: f, f1: f * 0.8, dur: 0.3, vol: 0.16, lp: 1200, delay: i * 0.18 })); }
};

/* 程序化背景音乐：16 步循环 + 前瞻调度 */
const Music = {
  on: false, step: 0, nextT: 0, timer: 0, bpm: 138, energy: 0.3,
  BASS: [82.41, 82.41, 0, 82.41, 98.00, 0, 82.41, 0, 110.00, 110.00, 0, 110.00, 98.00, 0, 146.83, 123.47],
  LEAD: [329.63, 392.00, 440.00, 493.88, 587.33, 493.88, 440.00, 392.00, 329.63, 0, 440.00, 0, 493.88, 0, 587.33, 659.25],
  start() {
    if (!Snd.ctx) return;
    this.on = true; this.step = 0; this.nextT = Snd.ctx.currentTime + 0.08;
    Snd.music.gain.setTargetAtTime(0.42, Snd.ctx.currentTime, 0.4);
    if (!this.timer) this.timer = setInterval(() => this.tick(), 30);
  },
  stop() { this.on = false; if (Snd.ctx) Snd.music.gain.setTargetAtTime(0, Snd.ctx.currentTime, 0.25); },
  tick() {
    const ac = Snd.ctx; if (!ac || !this.on || ac.state !== 'running') return;
    const spb = 60 / this.bpm / 2;
    if (this.nextT < ac.currentTime - 0.2) this.nextT = ac.currentTime + 0.05;
    while (this.nextT < ac.currentTime + 0.16) { this.note(this.step % 16, this.nextT - ac.currentTime, (this.step >> 4) % 4); this.step++; this.nextT += spb; }
  },
  note(s, d, bar) {
    const M = Snd.music, e = this.energy;
    if (s % 4 === 0) Snd.tone({ type: 'sine', f0: 160, f1: 44, dur: 0.2, vol: 0.8, attack: 0.002, delay: d, dest: M });
    if (s === 14 && bar % 2 === 1) Snd.tone({ type: 'sine', f0: 130, f1: 50, dur: 0.14, vol: 0.5, delay: d, dest: M });
    if (s === 4 || s === 12) { Snd.noise({ dur: 0.13, vol: 0.26, type: 'bandpass', f0: 1900, q: 0.8, delay: d, dest: M }); Snd.tone({ type: 'triangle', f0: 210, f1: 150, dur: 0.09, vol: 0.2, delay: d, dest: M }); }
    if (s % 2 === 1) Snd.noise({ dur: 0.03, vol: 0.08 + 0.05 * e, type: 'highpass', f0: 8000, delay: d, dest: M });
    else if (e > 0.55) Snd.noise({ dur: 0.02, vol: 0.04, type: 'highpass', f0: 9000, delay: d, dest: M });
    const b = this.BASS[s]; if (b) Snd.tone({ type: 'square', f0: b, dur: 0.16, vol: 0.26, lp: 320 + 500 * e, q: 4, delay: d, dest: M });
    if (bar >= 2) { const l = this.LEAD[s]; if (l) Snd.tone({ type: 'sawtooth', f0: l, dur: 0.13, vol: 0.06, lp: 2600, delay: d, dest: M }); }
  }
};

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code.indexOf('Arrow') === 0 || e.code === 'Tab') e.preventDefault();
  if (e.repeat) return;
  keys.add(e.code);
  Snd.unlock();
  handleKey(e.code);
});
window.addEventListener('keyup', e => keys.delete(e.code));
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', e => {
  Snd.unlock();
  if (e.button === 0) { mouse.down = true; handleClick(); }
  else if (e.button === 2) tryDash();
});
window.addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('resize', resize);
window.addEventListener('blur', () => { keys.clear(); mouse.down = false; if (state === ST.PLAY) setPause(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { keys.clear(); mouse.down = false; if (state === ST.PLAY) setPause(true); } });

function inputDir() {
  let x = 0, y = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) y -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) y += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) x -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) x += 1;
  if (x && y) { const k = 0.70710678; x *= k; y *= k; }
  return [x, y];
}

/* 空间哈希网格（链表式，零分配） */
const Grid = {

    for (let i = 0; i < list.length; i++) { const e = list[i]; if (e.x < minx) minx = e.x; if (e.x > maxx) maxx = e.x; if (e.y < miny) miny = e.y; if (e.y > maxy) maxy = e.y; }

    this.gw = Math.min(96, Math.floor(maxx / this.cs) - this.x0 + 2); this.gh = Math.min(96, Math.floor(maxy / this.cs) - this.y0 + 2);

    for (let i = 0; i < list.length; i++) {
      const e = list[i]; if (e.dead) continue;

      g.beginPath(); g.moveTo(pts[1][0], pts[1][1]); g.lineTo(pts[2][0] * 0.5, pts[2][1] * 0.5); g.lineTo(pts[3][0] * 0.5, pts[3][1] * 0.5); g.lineTo(pts[3][0], pts[3][1]); g.closePath(); g.fillStyle = 'rgba(30,20,10,0.45)'; g.fill();

function evictChunks(x, y) {
  for (const [k, c] of chunks) { if (Math.abs(c.cx * CHUNK + CHUNK / 2 - x) > 4500 || Math.abs(c.cy * CHUNK + CHUNK / 2 - y) > 4500) chunks.delete(k); }
}

function getChunk(cx, cy) {
  const k = cx + ',' + cy; let c = chunks.get(k); if (c) return c;
  const rng = mulberry32(hash2(cx, cy) | 0);

  c.blob = { x: bx + rng() * CHUNK, y: by + rng() * CHUNK, pts: blobPts(rng, 11, 200 + rng() * 150, 0.3), col: rng() < 0.5 ? 'rgba(120,84,44,0.13)' : 'rgba(255,232,180,0.10)' };

  const nFlat = 1 + Math.floor(rng() * 3);
  for (let i = 0; i < nFlat; i++) {
    const x = bx + rng() * CHUNK, y = by + rng() * CHUNK; if (hyp(x, y) < 340) continue;
    const type = flat[Math.floor(rng() * flat.length)];
    // 平面小物件只记录"变体序号 + 缩放"：位图在启动时一次性预生成，游玩过程中不再创建画布
    if (type === 'pebble') c.props.push({ type, x, y, v: Math.floor(rng() * 6), sc: 0.7 + rng() * 0.7 });

    else c.props.push({ type, x, y, v: Math.floor(rng() * 5), sc: 0.8 + rng() * 0.5 });

  tryOne(0.5, mkRock); tryOne(0.2, mkRock);

  tryOne(0.3, mkCactus);

}

function mkRock(x, y, rng) { const r = 22 + rng() * 20; return { type: 'rock', x, y, r, cr: r * 0.8, solid: true, tall: true, dead: false, v: Math.floor(rng() * 4), sy: y + r * 0.6 }; }

function collectSolids() {
  solidsNear.length = 0;
  const R = 1000, cx0 = Math.floor((player.x - R) / CHUNK), cx1 = Math.floor((player.x + R) / CHUNK), cy0 = Math.floor((player.y - R) / CHUNK), cy1 = Math.floor((player.y + R) / CHUNK);

/* 圆形实体与固体障碍的推出分离；slide=true 时附带切向滑动，避免敌人卡死在岩石正后方 */
function resolveSolids(o, slide) {
  for (let i = 0; i < solidsNear.length; i++) {
    const p = solidsNear[i], rr2 = o.r + p.cr;
    let dx = o.x - p.x, dy = o.y - p.y;
    if (dx > rr2 || dx < -rr2 || dy > rr2 || dy < -rr2) continue;
    const d2 = dx * dx + dy * dy; if (d2 >= rr2 * rr2) continue;
    let d = Math.sqrt(d2); if (d < 0.01) { dx = 1; dy = 0; d = 1; } else { dx /= d; dy /= d; }
    const push = rr2 - d;
    o.x += dx * push; o.y += dy * push;
    if (slide) { const tg = o.t > Math.PI ? 0.9 : -0.9; o.x += -dy * tg; o.y += dx * tg; }
  }

function updateFx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {

    if (o.type === 'smoke') { o.x += o.vx * dt; o.y += o.vy * dt; const f = Math.exp(-dt * 3); o.vx *= f; o.vy *= f; o.vy -= 18 * dt; }

  }

  for (let i = words.length - 1; i >= 0; i--) { const w = words[i]; w.life -= dt; if (w.life <= 0) poolKill(words, wordPool, i); }
  for (let i = ghosts.length - 1; i >= 0; i--) { const g = ghosts[i]; g.life -= dt; if (g.life <= 0) ghosts.splice(i, 1); }
  for (let i = booms.length - 1; i >= 0; i--) { const b = booms[i]; b.t += dt; if (b.t >= b.max) booms.splice(i, 1); }
  for (let i = bolts.length - 1; i >= 0; i--) { const b = bolts[i]; b.life -= dt; if (b.life <= 0) bolts.splice(i, 1); }
  for (let i = decals.length - 1; i >= 0; i--) { const d = decals[i]; d.life -= dt; if (d.life <= 0) decals.splice(i, 1); }

    const dx = e.x - p.x, dy = e.y - p.y, d2 = dx * dx + dy * dy; if (d2 > reach * reach) continue;
    const da = wrapA(Math.atan2(dy, dx) - base), lim = lim0 + Math.atan2(e.r, Math.sqrt(d2)) * 0.7;
    if (Math.abs(da) > lim) continue;
    const score = Math.abs(da) / lim + Math.sqrt(d2) / reach * 0.35;
    if (score < bestScore) { bestScore = score; best = Math.atan2(dy, dx); has = true; }
  }
  for (let i = 0; i < solidsNear.length; i++) {
    const q = solidsNear[i]; if (q.type !== 'barrel') continue;
    const dx = q.x - p.x, dy = q.y - p.y, d2 = dx * dx + dy * dy; if (d2 > reach * reach) continue;
    const da = wrapA(Math.atan2(dy, dx) - base); if (Math.abs(da) > 26 * DEG) continue;
    const score = Math.abs(da) / (26 * DEG) + Math.sqrt(d2) / reach * 0.35 + 0.25;
    if (score < bestScore) { bestScore = score; best = Math.atan2(dy, dx); has = true; }
  }

  p.aim = lerpAng(p.aim, best, 1 - Math.exp(-dt * 24));
}

function fire() {
  const p = player, g = gun, n = g.pellets;

  const mx = p.x + Math.cos(p.aim) * 30, my = p.y + Math.sin(p.aim) * 30;
  for (let i = 0; i < n; i++) {
    const a = n === 1 ? p.aim + rand(-0.5, 0.5) * cone : p.aim + (-0.5 + i / (n - 1)) * cone * 1.6 + rand(-0.1, 0.1) * cone;
    spawnBullet(mx, my, a);
  }

function spawnBullet(x, y, a) {

  if (bullets.length >= MAX_B) { b = bullets[0]; bullets[0] = bullets[bullets.length - 1]; bullets.pop(); }
  else b = bulletPool.pop() || { hits: [] };
  const sp = gun.bulletSpeed * rand(0.96, 1.04), r = 3.2 + (gun.pierce ? 1 : 0) - (gun.pellets > 1 ? 0.4 : 0);
  b.x = x; b.y = y; b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp; b.r = r; b.len = r * 2.7;
  b.dmg = gun.dmg; b.pierce = gun.pierce; b.life = gun.life; b.fire = UPS.fire.val > 0; b.shock = UPS.shock.val > 0; b.dead = false;
  b.hits.length = 0;
  bullets.push(b);
}

function updateShooting(dt) {
  const p = player;
  if (p.muzzle > 0) p.muzzle -= dt;
  if (p.recoil > 0) p.recoil = Math.max(0, p.recoil - dt * 9);
  p.heat = Math.max(0, p.heat - dt * 1.5);
  p.spread = Math.max(0, p.spread - dt * 40);
  if (p.frenzyT > 0) p.frenzyT -= dt;
  if (p.reloading) {
    p.reloadT -= dt;
    if (p.reloadT <= 0) { p.reloading = false; p.mag = p.magMax; SFX.reloadDone(); }
    return;
  }
  if (p.mag <= 0) { startReload(false); return; }
  if (!p.hasTarget && !mouse.down) { p.fireT = Math.min(p.fireT, 0.04); return; }   // 没有目标时不浪费子弹

    fire();
    p.fireT += 1 / gun.rate; if (p.fireT < 0) p.fireT = 0;

}

function updatePlayer(dt) {
  const p = player;
  if (p.iframes > 0) p.iframes -= dt;
  if (p.flash > 0) p.flash -= dt;
  if (p.shieldFx > 0) p.shieldFx -= dt;
  if (p.regen > 0 && p.hp < p.hpMax) p.hp = Math.min(p.hpMax, p.hp + p.regen * dt);
  if (p.shieldDelay > 0) p.shieldDelay -= dt;
  else if (p.shield < p.shieldMax) p.shield = Math.min(p.shieldMax, p.shield + p.shieldRate * dt);
  if (p.dashCd > 0) p.dashCd -= dt;

  if (p.dashT > 0) {
    p.dashT -= dt;
    p.x += p.dashDx * DASH_SPEED * dt; p.y += p.dashDy * DASH_SPEED * dt;
    p.mvx = p.dashDx * 420; p.mvy = p.dashDy * 420; p.moving = true;
    p.ghostT -= dt;
    if (p.ghostT <= 0) { p.ghostT = 0.022; ghosts.push({ x: p.x, y: p.y, aim: p.aim, walk: p.walk, life: 0.3, max: 0.3 }); }
    if (Math.random() < dt * 40) addPart('spark', p.x + rand(-6, 6), p.y + rand(-6, 6) + 6, -p.dashDx * rand(60, 160), -p.dashDy * rand(60, 160), 0.2, 2, '#5FF3FF');
    if (p.dashT <= 0) p.iframes = Math.max(p.iframes, 0.05);
  } else {
    const [ix, iy] = inputDir(), k = 1 - Math.exp(-dt * 16);
    p.mvx += (ix * p.speed - p.mvx) * k; p.mvy += (iy * p.speed - p.mvy) * k;
    p.moving = !!(ix || iy);
    p.x += (p.mvx + p.kbx) * dt; p.y += (p.mvy + p.kby) * dt;
  }
  const kf = Math.exp(-dt * 9); p.kbx *= kf; p.kby *= kf;
  p.walk += hyp(p.mvx, p.mvy) * dt * 0.075;
  p.sy = p.y;
  resolveSolids(p, false);
  updateAim(dt);
  updateShooting(dt);
  // 镜头略偏向准星方向
  const tx = p.x + (mouse.x - W / 2) / ZOOM * 0.14, ty = p.y + (mouse.y - H / 2) / ZOOM * 0.14, ck = 1 - Math.exp(-dt * 9);
  cam.x += (tx - cam.x) * ck; cam.y += (ty - cam.y) * ck;
}

function hurtPlayer(dmg, sx, sy, force) {
  const p = player;
  if (!p.alive || (p.iframes > 0 && !force)) return;
  stats.dmgTaken += dmg;
  if (p.shield > 0) {
    const a = Math.min(p.shield, dmg); p.shield -= a; dmg -= a; p.shieldFx = 0.3;

      for (let i = 0; i < 10; i++) { const a2 = i / 10 * TAU; addPart('spark', p.x + Math.cos(a2) * 20, p.y + Math.sin(a2) * 20, Math.cos(a2) * 260, Math.sin(a2) * 260, 0.3, 2.5, '#5FF3FF'); }
    }
  }
  if (dmg > 0) p.hp -= dmg;
  p.shieldDelay = 4; p.iframes = 0.75; p.flash = 0.06;
  const dx = p.x - sx, dy = p.y - sy, d = hyp(dx, dy) || 1; p.kbx += dx / d * 280; p.kby += dy / d * 280;
  addShake(13); hurtFlash = 1;

}

function killPlayer() {
  const p = player; if (!p.alive) return;
  p.alive = false; deathT = 1.5;

  addDecal('splat', p.x, p.y, 22);

/* ============================================================
   敌人
   ============================================================ */
/* 在镜头视野外一圈随机取一个刷怪点 */
function edgePos(margin) {
  const hw = vw + margin, hh = vh + margin, side = Math.floor(Math.random() * 4);
  if (side === 0) return [cam.x + rand(-hw, hw), cam.y - hh];
  if (side === 1) return [cam.x + hw, cam.y + rand(-hh, hh)];
  if (side === 2) return [cam.x + rand(-hw, hw), cam.y + hh];
  return [cam.x - hw, cam.y + rand(-hh, hh)];
}

function spawnEnemy(type, x, y, elite) {
  if (enemies.length >= MAX_E) return;
  const T = ETYPES[type], sc = elite ? 1.7 : 1, e = enemyPool.pop() || {};
  e.type = type; e.x = x; e.y = y; e.scale = sc; e.r = T.r * sc;
  e.hp = e.hpMax = T.hp * hpScale() * (elite ? 12 : 1);

  e.dmg = T.dmg * dmgScale(); e.xp = T.xp * (elite ? 12 : 1);
  e.kbRes = elite ? Math.min(0.95, T.kbRes + 0.5) : T.kbRes; e.mass = T.mass * (elite ? 5 : 1);
  e.dead = false; e.elite = !!elite; e.flash = 0; e.spawnT = 0.25; e.kx = 0; e.ky = 0;
  e.burnT = 0; e.burnTick = 0; e.burnDps = 0; e.burnAcc = 0; e.armT = 0; e.awayT = 0;
  e.ang = Math.atan2(player.y - y, player.x - x); e.walk = rand(TAU); e.t = rand(TAU);
  e.wob = type === 0 ? rand(0.15, 0.45) : 0; e.wobF = rand(3, 6); e.wobP = rand(TAU);
  e.arming = false; e.dk = 2; e.vis = false;
  enemies.push(e);
  for (let i = 0; i < 2; i++) addPart('smoke', x + rand(-8, 8), y + rand(-4, 8), rand(-40, 40), rand(-40, 20), rand(0.3, 0.45), rand(4, 6.5), '#D9B377');
}

function pickType() {
  const t = gameTime, w0 = 10, w1 = t > 35 ? 2 + t / 150 : 0, w2 = t > 80 ? 1.2 + t / 200 : 0;
  let r = rand(w0 + w1 + w2);
  if ((r -= w0) < 0) return 0;
  if ((r -= w1) < 0) return 1;
  return 2;
}

function updateSpawns(dt) {
  spawnT -= dt;
  if (spawnT <= 0) {
    const rate = 1 + 0.028 * gameTime + 0.00028 * gameTime * gameTime, q = edgePos(70);
    spawnEnemy(pickType(), q[0], q[1], false);
    spawnT += 1 / rate;

  }
  if (gameTime >= nextWaveT) { nextWaveT += 40; startWave(); }
  if (gameTime >= nextBossT) {
    nextBossT += 75; const q = edgePos(60); spawnEnemy(2, q[0], q[1], true);
    announce('警告：BADASS 铁桶兵', '击倒它可获得宝箱！', '#FF5A3C'); SFX.wave();
  }
}

/* 波次：在玩家四周环形包围刷出一整圈 */
function startWave() {
  waveN++;
  const n = 10 + waveN * 4, R = Math.max(vw, vh) + 130;
  for (let i = 0; i < n; i++) { const a = i / n * TAU + rand(-0.1, 0.1), k = R * rand(0.95, 1.3); spawnEnemy(0, player.x + Math.cos(a) * k, player.y + Math.sin(a) * k, false); }
  if (waveN >= 2) for (let i = 0; i < Math.min(8, waveN * 2); i++) { const a = rand(TAU); spawnEnemy(1, player.x + Math.cos(a) * R * 1.1, player.y + Math.sin(a) * R * 1.1, false); }
  if (waveN >= 3) for (let i = 0; i < Math.min(5, waveN - 2); i++) { const a = rand(TAU); spawnEnemy(2, player.x + Math.cos(a) * R * 1.15, player.y + Math.sin(a) * R * 1.15, false); }
  announce('第 ' + waveN + ' 波', pick(['疯子军团来袭！', '他们闻到了你的血味…', '别停下，跑起来！', '更多的疯子，更多的问题。', '弹药用尽才是真正的死因。']), '#FFD23F');
  SFX.wave();
}

function damageEnemy(e, dmg, crit, dx, dy, kbMul) {
  if (e.dead || dmg <= 0) return;
  e.hp -= dmg; e.flash = 0.07;
  const kb = (crit ? 280 : 170) * (1 - e.kbRes) * kbMul;
  e.kx += dx * kb; e.ky += dy * kb;
  stats.damage += dmg;
  if (crit) { stats.crits++; if (dmg > stats.maxCrit) stats.maxCrit = dmg; }
  addText(e.x, e.y - e.r, dmg, crit ? 1 : 0, crit ? '#FFE23F' : '#FFFFFF');
  if (e.hp <= 0) killEnemy(e, dx, dy);
}
function ignite(e) { e.burnT = 3; e.burnDps = Math.max(e.burnDps, gun.burnDps); }

/* 连锁闪电：从命中目标跳向最近的未命中敌人 */
function chainLightning(src, base) {
  let from = src; const seen = [src], pts = [[src.x, src.y]];
  for (let k = 0; k < gun.chains; k++) {
    let best = null, bd = 200 * 200;
    for (let i = 0; i < enemies.length; i++) { const e = enemies[i]; if (e.dead || seen.indexOf(e) >= 0) continue; const d2 = (e.x - from.x) * (e.x - from.x) + (e.y - from.y) * (e.y - from.y); if (d2 < bd) { bd = d2; best = e; } }
    if (!best) break;
    seen.push(best); pts.push([best.x, best.y]);
    damageEnemy(best, base * 0.6, false, 0, 0, 0);
    from = best;
  }
  if (pts.length > 1) { addBolt(pts); addWord('ZAP!', from.x, from.y - 20, '#5FF3FF', 26, 'zap', 380); SFX.zap(); }
}

function killEnemy(e, dx, dy) {
  if (e.dead) return; e.dead = true;
  stats.kills++;
  if (e.type === 1) { fuses.push({ x: e.x, y: e.y, t: rand(0.05, 0.16), kind: 'bomber' }); return; }   // 自爆矮人：短引信后爆炸
  SFX.kill();
  const blood = e.type === 0 ? ['#C0281F', '#8F1510', '#E9CDA6'] : ['#C0281F', '#8F1510', '#7B828A'];
  const n = e.elite ? 10 : 4;
  for (let i = 0; i < n; i++) { const a = rand(TAU), s = rand(60, e.elite ? 420 : 260); addPart('chunk', e.x, e.y, Math.cos(a) * s + dx * 120, Math.sin(a) * s + dy * 120, rand(0.35, 0.7), rand(2.5, e.elite ? 7 : 5), pick(blood), rand(TAU)); }
  addDecal('splat', e.x, e.y, e.r * (e.elite ? 1.5 : 1.1));
  if ((Math.random() < 0.22 && e.type === 2) || e.elite) addWord(pick(KILL_WORDS), e.x, e.y - e.r - 10, '#FFD23F', e.elite ? 40 : 26, 'kill', 450);
  dropXp(e);

  if (Math.random() < (player.hp < player.hpMax * 0.4 ? 0.07 : 0.03)) spawnDrop('hp', e.x, e.y);
  addShake(e.type === 2 ? 3 : 1);
}

/* 爆炸：对范围内敌人造成衰减伤害（可误伤），可引爆附近油桶 */
function explode(x, y, radius, dmgE, dmgP, big) {
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i]; if (e.dead) continue;
    const dx = e.x - x, dy = e.y - y, d = hyp(dx, dy) || 1;

  }

  for (let i = 0; i < 12; i++) { const a = rand(TAU), s = rand(200, 520); addPart('spark', x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.2, 0.45), 2.5, i % 2 ? '#FFD23F' : '#FF8A1E'); }

function igniteBarrel(p, delay) {

function updateFuses(dt) {

function updateEnemies(dt) {

    }
    let mx = dx, my = dy;
    if (e.wob) { const w = Math.sin(gameTime * e.wobF + e.wobP) * e.wob; mx = dx - dy * w; my = dy + dx * w; }
    e.x += (mx * sp + e.kx) * dt; e.y += (my * sp + e.ky) * dt;
    e.kx *= kf; e.ky *= kf;
    e.ang = lerpAng(e.ang, Math.atan2(dy, dx), dt * 9);
    e.walk += dt * (4 + sp * 0.05);
    // 接触玩家
    if (p.alive && d < e.r + p.r + 1) {
      if (e.type === 1) { e.dead = true; explode(e.x, e.y, 118, 60 * (1 + gameTime / 200), 30 * dmgScale(), false); continue; }
      hurtPlayer(e.dmg, e.x, e.y);
      e.x -= dx * 6; e.y -= dy * 6;
    }
    // 被远远甩开的敌人：3 秒后重新绕到屏幕边缘，保持包围压力
    if (d > 1500) { e.awayT += dt; if (e.awayT > 3) { const q = edgePos(50); e.x = q[0]; e.y = q[1]; e.awayT = 0; } } else e.awayT = 0;
  }
  if (solidsNear.length) for (let i = 0; i < enemies.length; i++) { const e = enemies[i]; if (!e.dead) resolveSolids(e, true); }
}

/* 敌人间软分离（基于网格，重装兵质量大，推开小兵） */
function separate() {
  const G = Grid, cs = G.cs, gw = G.gw, gh = G.gh, head = G.head, nxt = G.next;
  if (!gw || !gh) return;
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i]; if (a.dead) continue;
    const cx = clamp(Math.floor(a.x / cs) - G.x0, 0, gw - 1), cy = clamp(Math.floor(a.y / cs) - G.y0, 0, gh - 1);
    const x0 = Math.max(0, cx - 1), x1 = Math.min(gw - 1, cx + 1), y0 = Math.max(0, cy - 1), y1 = Math.min(gh - 1, cy + 1);
    for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++) {
      for (let n = head[gy * gw + gx]; n !== 0; n = nxt[n - 1]) {
        const j = n - 1; if (j <= i) continue;
        const b = enemies[j]; if (b.dead) continue;
        let dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy);
        const min = (a.r + b.r) * 0.92;
        if (d >= min) continue;
        if (d < 0.001) { const an = rand(TAU); dx = Math.cos(an); dy = Math.sin(an); d = 1; } else { dx /= d; dy /= d; }
        const push = min - d, wa = b.mass / (a.mass + b.mass), wb = 1 - wa;
        a.x -= dx * push * wa; a.y -= dy * push * wa; b.x += dx * push * wb; b.y += dy * push * wb;
      }
    }
  }
}

function onBulletHit(b, e) {
  const crit = Math.random() < player.crit;
  const sp = hyp(b.vx, b.vy);
  damageEnemy(e, b.dmg * (crit ? 2.2 : 1), crit, b.vx / sp, b.vy / sp, 1);
  if (crit) SFX.crit(); else SFX.hit();
  for (let i = 0; i < 2; i++) addPart('spark', b.x, b.y, -b.vx * rand(0.1, 0.3) + rand(-90, 90), -b.vy * rand(0.1, 0.3) + rand(-90, 90), rand(0.12, 0.22), 2, crit ? '#FFE23F' : '#FFF6A0');
  if (crit) addWord('CRIT!', e.x + rand(-6, 6), e.y - e.r - 14, '#FFE23F', 28, 'crit', 260);
  if (!e.dead && b.fire && Math.random() < gun.fireChance) ignite(e);
  if (!e.dead && b.shock && Math.random() < gun.shockChance) chainLightning(e, b.dmg);
  if (b.pierce > 0) { b.pierce--; b.dmg *= 0.85; return; }   // 穿透：继续飞行，伤害衰减
  b.dead = true;
}

/* 子弹碰撞：网格 3x3 邻域查询敌人 + 油桶检测 */
function bulletCollide(b) {
  const G = Grid;
  if (G.gw) {
    const cx = Math.floor(b.x / G.cs) - G.x0, cy = Math.floor(b.y / G.cs) - G.y0;
    for (let gy = cy - 1; gy <= cy + 1; gy++) {
      if (gy < 0 || gy >= G.gh) continue;
      for (let gx = cx - 1; gx <= cx + 1; gx++) {
        if (gx < 0 || gx >= G.gw) continue;
        for (let n = G.head[gy * G.gw + gx]; n !== 0; n = G.next[n - 1]) {
          const e = enemies[n - 1]; if (e.dead) continue;
          const rre = e.r + b.r;
          if (Math.abs(e.x - b.x) > rre || Math.abs(e.y - b.y) > rre) continue;
          const ddx = e.x - b.x, ddy = e.y - b.y; if (ddx * ddx + ddy * ddy > rre * rre) continue;
          if (b.hits.indexOf(e) >= 0) continue;
          b.hits.push(e); onBulletHit(b, e);
          if (b.dead) return true;
        }
      }
    }
  }
  for (let i = 0; i < solidsNear.length; i++) {
    const q = solidsNear[i]; if (q.type !== 'barrel' || q.dead) continue;
    const ddx = q.x - b.x, ddy = q.y - b.y;
    if (ddx * ddx + ddy * ddy < (14 + b.r) * (14 + b.r)) { b.dead = true; igniteBarrel(q, 0.05); return true; }
  }
  return false;
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i]; b.life -= dt;
    if (b.life <= 0) { poolKill(bullets, bulletPool, i); continue; }
    const dx = b.vx * dt, dy = b.vy * dt, steps = Math.max(1, Math.ceil(hyp(dx, dy) / 14));
    let dead = false;
    for (let s = 0; s < steps && !dead; s++) { b.x += dx / steps; b.y += dy / steps; dead = bulletCollide(b); }
    if (b.fire && Math.random() < 0.12) addPart('flame', b.x, b.y, rand(-10, 10), rand(-30, -5), 0.18, 2.5, '#FF8A1E');
    if (!dead && (Math.abs(b.x - cam.x) > vw + 140 || Math.abs(b.y - cam.y) > vh + 140)) dead = true;   // 屏幕外子弹回收
    if (dead) poolKill(bullets, bulletPool, i);
  }
}

function updateDrops(dt) {
  const p = player, fr = Math.exp(-dt * 5);
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i]; d.t += dt;
    d.x += d.vx * dt; d.y += d.vy * dt; d.vx *= fr; d.vy *= fr;
    if (!p.alive) continue;
    const dx = p.x - d.x, dy = p.y - d.y, dd = hyp(dx, dy) || 1;
    if (!d.mag && dd < p.magnetR * (d.type === 'xp' ? 1 : 1.3)) d.mag = true;   // 进入磁吸范围
    if (d.mag) { d.sp = Math.min(1600, d.sp + 3400 * dt); d.x += dx / dd * d.sp * dt; d.y += dy / dd * d.sp * dt; }
    if (dd < p.r + 12) { collect(d); drops.splice(i, 1); }
  }
}

function sweepEnemies() {
  for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].dead) { const e = enemies[i]; enemies[i] = enemies[enemies.length - 1]; enemies.pop(); enemyPool.push(e); }
}

/* ============================================================
   升级 / 三选一
   ============================================================ */
function rollRarity() { const r = Math.random(); return r < 0.58 ? 0 : r < 0.84 ? 1 : r < 0.955 ? 2 : 3; }
function applyUpgrade(key, ri) {
  const u = UPS[key]; if (!u) return;
  u.val = Math.min(u.cap, u.val + u.base * RARITY[ri].mult); u.lvl++;
  if (u.val >= u.cap - 1e-9) u.val = u.cap;
  recalcStats();
}
function makeCard(key) {
  const u = UPS[key], ex = EXTRA[key];
  return { key, name: ex ? ex.name : u.name, type: ex ? ex.type : u.type, desc: ex ? ex.desc : u.desc, rarity: rollRarity(),
    isNew: !ex && !u.lvl, extra: !!ex, fill: ex ? 1 : clamp(u.val / u.cap, 0, 1), lvl: ex ? 0 : u.lvl,
    rot: 0, hover: 0, wasHover: false, x: -9999, y: -9999, w: 0, h: 0 };
}
function openLevelUp() {
  const pool = Object.keys(UPS).filter(k => UPS[k].val < UPS[k].cap - 1e-9);
  cards = [];
  const rots = [-0.07, 0.015, 0.075];
  while (cards.length < 3 && pool.length) {
    let tot = 0; for (const k of pool) tot += UPS[k].lvl === 0 ? 1.35 : 1;
    let r = Math.random() * tot, idx = 0;
    for (; idx < pool.length; idx++) { r -= UPS[pool[idx]].lvl === 0 ? 1.35 : 1; if (r <= 0) break; }
    idx = Math.min(idx, pool.length - 1);
    const key = pool.splice(idx, 1)[0], c = makeCard(key);
    c.rot = rots[cards.length]; cards.push(c);
  }
  const fb = ['heal', 'nuke', 'frenzy'];   // 全部满级后的补给卡
  for (let i = 0; i < fb.length && cards.length < 3; i++) { const c = makeCard(fb[i]); c.rot = rots[cards.length]; c.rarity = 0; cards.push(c); }
  state = ST.LEVEL; levelT = 0; picking = null; uiRects.skip = null;
  for (let i = words.length - 1; i >= 0; i--) if (words[i].screen) poolKill(words, wordPool, i);   // 连续升级时只保留一个 LEVEL UP!
  addWord('LEVEL UP!', W / 2 + 268, 88, '#5FF3FF', 40, null, 0, true);
  SFX.levelup();
}
function levelUp() {
  while (player.xp >= player.xpNext) { player.xp -= player.xpNext; player.level++; player.xpNext = xpNeed(player.level); pendingLevels++; }
  if (state === ST.PLAY) openLevelUp();
}
/* 震爆脉冲卡：对屏幕内所有敌人造成大额伤害与击退 */
function shockwave() {
  const R = Math.max(vw, vh) + 80;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i]; if (e.dead) continue;
    const dx = e.x - player.x, dy = e.y - player.y, d = hyp(dx, dy); if (d > R) continue;
    damageEnemy(e, 220 * (1 + gameTime / 120), false, dx / (d || 1), dy / (d || 1), 6);
  }
  booms.push({ x: player.x, y: player.y, r: R * 1.05, t: 0, max: 0.55, ring: true, rot: 0, pts: null });
  addShake(20); hitStop = 0.08; addWord('KA-BOOM!', player.x, player.y - 40, '#FFD23F', 64, null, 0); SFX.boom();
  toast('震爆脉冲：全场敌人受创！', '#5FF3FF');
}
/* i: 0-2 选卡，3 跳过 */
function chooseCard(i) {
  if (state !== ST.LEVEL || picking) return;
  if (i === 3 || i >= cards.length) { picking = { i: 3, t: 0 }; return; }
  picking = { i, t: 0 };
  SFX.select();
}
function resolvePick() {
  const i = picking.i; picking = null;
  if (i === 3) { heal(20); toast('跳过：回复 20 生命', '#F4E9D3'); }
  else {
    const c = cards[i];
    if (c.key === 'heal') heal(Math.round(player.hpMax * 0.4));
    else if (c.key === 'nuke') shockwave();
    else if (c.key === 'frenzy') player.frenzyT = 15;
    else applyUpgrade(c.key, c.rarity);
  }
  pendingLevels--;
  if (pendingLevels > 0) openLevelUp();
  else { state = ST.PLAY; player.iframes = Math.max(player.iframes, 0.5); }
}

function setPause(on) {
  if (on && state === ST.PLAY) { state = ST.PAUSE; uiRects.resume = null; }
  else if (!on && state === ST.PAUSE) { state = ST.PLAY; uiRects.resume = null; }
}
function toggleMute() { Snd.unlock(); Snd.setMute(!Snd.muted); }

function startGame() {
  Snd.unlock();
  for (const k in UPS) { UPS[k].val = 0; UPS[k].lvl = 0; }
  player = newPlayer();
  stats = { kills: 0, damage: 0, crits: 0, maxCrit: 0, dmgTaken: 0, xp: 0, dashes: 0 };
  [enemies, enemyPool, bullets, bulletPool, parts, partPool, texts, textPool, words, wordPool, drops, fuses, booms, bolts, ghosts, decals, toasts, solidsNear].forEach(a => { a.length = 0; });
  chunks.clear(); deadBarrels.clear();
  gameTime = 0; spawnT = 1.4; nextWaveT = 40; waveN = 0; nextBossT = 100; pendingLevels = 0; picking = null; hitStop = 0;
  hurtFlash = 0; whiteFlash = 0; speedT = 0; hintT = 14; xpCount = 0; banner = null;
  cam.x = player.x; cam.y = player.y; cam.shake = 0;
  gun = calcGun(); state = ST.PLAY; uiRects.skip = null;
  Music.start();
  announce('活下来。', 'WASD 移动 · 鼠标瞄准 · 空格 / 右键 冲刺', '#FFD23F');
}

function handleKey(code) {
  if (code === 'KeyM') { toggleMute(); return; }
  if (code === 'Backquote') { debug = !debug; return; }
  if (state === ST.START) { if (code === 'Enter' || code === 'NumpadEnter' || code === 'Space') startGame(); return; }
  if (state === ST.PLAY) {
    if (code === 'Space' || code === 'ShiftLeft' || code === 'ShiftRight') tryDash();
    else if (code === 'KeyR') startReload(true);
    else if (code === 'KeyP' || code === 'Escape') setPause(true);
    return;
  }
  if (state === ST.LEVEL) { const n = DIGITS[code]; if (n !== undefined) chooseCard(n - 1); return; }
  if (state === ST.PAUSE) { if (code === 'KeyP' || code === 'Escape' || code === 'Space' || code === 'Enter') setPause(false); return; }
  if (state === ST.OVER) { if (overT > 0.6 && (code === 'KeyR' || code === 'Enter' || code === 'Space')) startGame(); }
}

function handleClick() {
  const mx = mouse.x, my = mouse.y;
  if (ptInRect(mx, my, uiRects.mute)) { toggleMute(); return; }
  if (state === ST.START) { if (ptInRect(mx, my, uiRects.start)) startGame(); return; }
  if (state === ST.LEVEL) {
    if (picking) return;
    for (let i = 0; i < cards.length; i++) if (ptInRect(mx, my, cards[i])) { chooseCard(i); return; }
    if (ptInRect(mx, my, uiRects.skip)) chooseCard(3);
    return;
  }
  if (state === ST.PAUSE) { if (ptInRect(mx, my, uiRects.resume)) setPause(false); return; }
  if (state === ST.OVER && overT > 0.6 && ptInRect(mx, my, uiRects.over)) startGame();
}
/* ============================================================
   文本
   ============================================================ */
function txt(s, x, y, size, col, align, ol, font) {
  ctx.font = '900 ' + size + 'px ' + (font || FONT_UI);
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  if (ol) { ctx.lineJoin = 'round'; ctx.lineWidth = ol; ctx.strokeStyle = '#000'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
/* 美漫标题字：粗黑描边 + 硬投影 + 斜体 */
function comicText(s, x, y, size, col, ol, sh, rot) {
  ctx.save();
  if (rot) { ctx.translate(x, y); ctx.rotate(rot); x = 0; y = 0; }
  ctx.font = 'italic 900 ' + size + 'px ' + FONT_IMPACT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (sh) { ctx.lineWidth = ol; ctx.strokeStyle = '#000'; ctx.strokeText(s, x + sh, y + sh); ctx.fillStyle = '#000'; ctx.fillText(s, x + sh, y + sh); }
  ctx.lineWidth = ol; ctx.strokeStyle = '#000'; ctx.strokeText(s, x, y);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
  ctx.restore();
}

/* ============================================================
   位图缓存
   重复出现的矢量图（敌人 / 晶体 / 子弹 / 场景物 / 弹坑）只画一次，
   之后每帧每个对象只发 1 次 drawImage，把每帧绘制调用从近万次压到千余次。
   ============================================================ */
let RES = 2;   // 位图倍率：按 设备像素比 × 镜头缩放 选取，保证放大后仍然清晰
const SPR_CACHE = {};
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
/* 以画布中心为原点、放大 R 倍的方形精灵画布 */
function spriteCtx(r, R) {
  const cv = mkCanvas(r * 2 * R, r * 2 * R), g = cv.getContext('2d');
  g.setTransform(R, 0, 0, R, r * R, r * R); g.lineJoin = 'round'; g.lineCap = 'round';
  return { cv, g, r };
}
function cachedSprite(key, make) { return SPR_CACHE[key] || (SPR_CACHE[key] = make()); }
/* 居中贴图：k 为缩放，alpha 为不透明度 */
function blit(s, x, y, k, alpha) {
  const r = s.r * (k || 1);
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.drawImage(s.cv, x - r, y - r, r * 2, r * 2);
  if (alpha !== undefined) ctx.globalAlpha = 1;
}

/* 描边文字位图缓存：带黑描边的文字每帧重绘很贵（战斗高潮时一帧有上百个跳字），
   按"内容 + 样式"缓存成位图，之后每帧只贴图 */
const MEASURE = mkCanvas(1, 1).getContext('2d'), TXT_CACHE = new Map();
function textSprite(str, size, fill, ol, sh, R) {
  const font = 'italic 900 ' + size + 'px ' + FONT_IMPACT, key = str + '|' + font + '|' + fill + '|' + ol + '|' + sh + '|' + R;
  let s = TXT_CACHE.get(key);
  if (!s) {
    if (TXT_CACHE.size > 400) TXT_CACHE.clear();   // 防止长局中无限增长
    MEASURE.font = font;
    const w = Math.ceil(MEASURE.measureText(str).width + ol * 2 + sh + size * 0.2 + 6), h = Math.ceil(size * 1.7 + ol * 2 + sh);
    const cv = mkCanvas(w * R, h * R), g = cv.getContext('2d');
    g.setTransform(R, 0, 0, R, 0, 0); g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
    const cx = w / 2, cy = h / 2;
    if (sh) { g.lineWidth = ol; g.strokeStyle = '#000'; g.strokeText(str, cx + sh, cy + sh); g.fillStyle = '#000'; g.fillText(str, cx + sh, cy + sh); }
    g.lineWidth = ol; g.strokeStyle = '#000'; g.strokeText(str, cx, cy);
    g.fillStyle = fill; g.fillText(str, cx, cy);
    s = { cv, w, h }; TXT_CACHE.set(key, s);
  }
  return s;
}
function drawTextSprite(s, x, y, rot, sc) {
  ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); if (sc !== 1) ctx.scale(sc, sc);
  ctx.drawImage(s.cv, -s.w / 2, -s.h / 2, s.w, s.h);
  ctx.restore();
}

/* ============================================================
   场景物件（矢量画法：首次用到时烘焙成位图并缓存在物件上）
   ============================================================ */
function drawFlatProp(g, p) {
  switch (p.type) {
    case 'pebble':
      polyPath(g, p.pts, p.x, p.y); g.fillStyle = p.col; g.fill(); g.strokeStyle = '#111'; g.lineWidth = 1.5; g.stroke();
      break;
    case 'tire': {
      const x = p.x, y = p.y;
      circ(g, x, y, 15); g.fillStyle = '#2A2623'; g.fill(); g.strokeStyle = '#000'; g.lineWidth = 2.5; g.stroke();
      circ(g, x, y, 7.5); g.fillStyle = '#B9965F'; g.fill(); g.lineWidth = 2; g.stroke();
      g.strokeStyle = '#4A443F'; g.lineWidth = 2; g.beginPath();
      for (let i = 0; i < 8; i++) { const a = p.rot + i / 8 * TAU; g.moveTo(x + Math.cos(a) * 9, y + Math.sin(a) * 9); g.lineTo(x + Math.cos(a) * 13, y + Math.sin(a) * 13); }
      g.stroke();
      break;
    }
    case 'bones': {
      g.save(); g.translate(p.x, p.y); g.rotate(p.rot);
      g.strokeStyle = '#000'; g.lineWidth = 5; g.beginPath(); g.moveTo(-14, 8); g.lineTo(2, 14); g.stroke();
      g.strokeStyle = '#F1EBDD'; g.lineWidth = 2.6; g.beginPath(); g.moveTo(-14, 8); g.lineTo(2, 14); g.stroke();
      g.fillStyle = '#F1EBDD'; g.strokeStyle = '#000'; g.lineWidth = 1.5;
      circ(g, -15, 6.5, 2.6); g.fill(); g.stroke(); circ(g, -13, 10.5, 2.6); g.fill(); g.stroke();
      circ(g, 2, 16, 2.6); g.fill(); g.stroke(); circ(g, 5.5, 14, 2.6); g.fill(); g.stroke();
      circ(g, 6, 0, 6); g.fill(); g.lineWidth = 2; g.stroke();
      rr(g, 2, 4.5, 8, 4, 1.5); g.fill(); g.lineWidth = 1.5; g.stroke();
      g.fillStyle = '#111'; circ(g, 4, -1, 1.7); g.fill(); circ(g, 8.5, -1, 1.7); g.fill();
      g.restore();
      break;
    }
    case 'scrap':
      g.save(); g.translate(p.x, p.y); g.rotate(p.rot);
      polyPath(g, p.pts); g.fillStyle = p.col; g.fill(); g.strokeStyle = '#000'; g.lineWidth = 2; g.stroke();
      g.strokeStyle = '#111'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(-p.pts[0][0] * 0.6, -p.pts[0][1] * 0.6); g.lineTo(p.pts[0][0] * 0.6, p.pts[0][1] * 0.6); g.stroke();
      g.fillStyle = '#111'; circ(g, p.pts[1][0] * 0.4, p.pts[1][1] * 0.4, 1.3); g.fill();
      g.restore();
      break;
  }
}

/* 高物件在地面上的硬边投影 */
function drawPropShadow(p) {
  ctx.fillStyle = 'rgba(30,15,5,0.26)';
  if (p.type === 'rock') {
    const k = p.r / ROCK_BASE;
    ctx.beginPath();
    PROP_SPR.rock[p.v].pts.forEach((q, i) => { const x = p.x + 9 + q[0] * k, y = p.y + 11 + q[1] * k; if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
    ctx.closePath(); ctx.fill();
  }
  else if (p.type === 'barrel') { ctx.beginPath(); ctx.ellipse(p.x + 7, p.y + 9, 12.5, 8, 0, 0, TAU); ctx.fill(); }
  else if (p.type === 'cactus') { ctx.beginPath(); ctx.ellipse(p.x + 12, p.y + 3, 20, 7, 0, 0, TAU); ctx.fill(); }

/* 场景物件精灵集：启动时一次性预生成固定数量的变体（碎石 6 / 轮胎 1 / 尸骨 3 / 废铁 5 / 岩块 4 / 油桶 1 / 仙人掌 2 / 路牌 2），

/* ============================================================

   ============================================================ */
let groundTile = null, vignCv = null, vignRed = null;
const TILE = 768;
function buildGroundTile() {

  const R = clamp(DPR * ZOOM, 1, 2.25), size = Math.ceil(TILE * R), cv = mkCanvas(size, size), g = cv.getContext('2d');
  g.setTransform(R, 0, 0, R, 0, 0); g.fillStyle = groundPattern; g.fillRect(0, 0, TILE, TILE);

}

    const gr = g.createRadialGradient(W / 4, H / 4, Math.min(W, H) * 0.21, W / 4, H / 4, Math.max(W, H) * 0.375);
    gr.addColorStop(0, c0); gr.addColorStop(1, c1);

  };

/* 绘制地面，并构建按 y 排序的绘制队列（高物件 / 敌人 / 玩家 / 掉落物） */
function drawGround(x0, y0, x1, y1) {
  // 地面：无缝瓦片按网格贴图（瓦片间留 0.6 单位重叠，避免镜头旋转时出现接缝）
  const tx0 = Math.floor(x0 / TILE), tx1 = Math.floor(x1 / TILE), ty0 = Math.floor(y0 / TILE), ty1 = Math.floor(y1 / TILE);
  for (let j = ty0; j <= ty1; j++) for (let i = tx0; i <= tx1; i++) ctx.drawImage(groundTile, i * TILE, j * TILE, TILE + 0.6, TILE + 0.6);
  drawList.length = 0;
  const cx0 = Math.floor(x0 / CHUNK), cx1 = Math.floor(x1 / CHUNK), cy0 = Math.floor(y0 / CHUNK), cy1 = Math.floor(y1 / CHUNK);
  for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
    const c = getChunk(cx, cy), b = c.blob;
    if (b.x + 360 > x0 && b.x - 360 < x1 && b.y + 360 > y0 && b.y - 360 < y1) { polyPath(ctx, b.pts, b.x, b.y); ctx.fillStyle = b.col; ctx.fill(); }
    for (let i = 0; i < c.props.length; i++) {
      const p = c.props[i];
      if (p.tall) { if (p.dead) continue; drawPropShadow(p); p.dk = 1; drawList.push(p); }
      else drawPropCached(p);
    }
  }
  if (chunks.size > 900) evictChunks(cam.x, cam.y);
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    e.vis = !e.dead && e.x > x0 && e.x < x1 && e.y > y0 && e.y < y1;
    if (e.vis) drawList.push(e);
  }
  for (let i = 0; i < drops.length; i++) { const d = drops[i]; if (d.x > x0 && d.x < x1 && d.y > y0 && d.y < y1) drawList.push(d); }
  if (state !== ST.START && player.alive) drawList.push(player);
  drawList.sort((a, b) => (a.sy !== undefined ? a.sy : a.y) - (b.sy !== undefined ? b.sy : b.y));
}

/* ============================================================

/* ============================================================

const GEM_COLS = ['#3FE0FF', '#58E35A', '#FFB01E'];

function drawDrop(d) {

/* ============================================================

/* ============================================================

/* ============================================================
   敌人图集：每种敌人按 48 个朝向预渲染（疯子 / 矮人各 2 个步行相位），
   运行时每个敌人只发 1 次 drawImage；受击闪白 / 自爆预警用纯色剪影图集。
   ============================================================ */
const SPR = { n: 48, cols: 8, half: [38, 24, 36], types: null };
/* 逐帧扫描图集的透明度，得到每帧不透明内容的紧致包围盒（图集像素）；绘制时只贴这部分，省掉大片透明像素 */
function tightBounds(cv, cw, cols) {
  const W = cv.width, H = cv.height, data = cv.getContext('2d').getImageData(0, 0, W, H).data, bb = [];
  for (let k = 0, rows = Math.ceil(H / cw); k < rows * cols; k++) {
    const ox = (k % cols) * cw, oy = Math.floor(k / cols) * cw;
    let x0 = cw, y0 = cw, x1 = -1, y1 = -1;
    for (let y = 0; y < cw; y++) for (let x = 0; x < cw; x++) if (data[((oy + y) * W + ox + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    bb.push(x1 < 0 ? [0, 0, cw, cw] : [Math.max(0, x0 - 2), Math.max(0, y0 - 2), Math.min(cw, x1 + 3), Math.min(cw, y1 + 3)]);
  }
  return bb;
}
function enemyAtlas(type, phases, R, sil) {
  const n = SPR.n, cols = SPR.cols, rows = Math.ceil(n / cols), cw = Math.ceil(SPR.half[type] * 2 * R), out = [];
  for (let ph = 0; ph < phases; ph++) {
    const cv = mkCanvas(cw * cols, cw * rows), g = cv.getContext('2d');
    for (let k = 0; k < n; k++) {
      g.setTransform(R, 0, 0, R, ((k % cols) + 0.5) * cw, (Math.floor(k / cols) + 0.5) * cw);
      g.lineJoin = 'round'; g.lineCap = 'round';
      const e = { type, x: 0, y: 0, ang: k / n * TAU, walk: ph * Math.PI, scale: 1, spawnT: 0, t: 0, armT: 0, elite: false, hp: 1, hpMax: 1 };
      (type === 0 ? drawPsycho : type === 1 ? drawBomber : drawBruiser)(g, e, sil);
    }
    out.push({ cv, cw, bb: tightBounds(cv, cw, cols) });
  }
  return out;
}
function buildEnemySprites() {
  SPR.types = [0, 1, 2].map(t => ({ half: SPR.half[t], phases: enemyAtlas(t, t === 2 ? 1 : 2, RES, null), white: null, red: null }));
}
function buildFlashSprites() {
  for (let t = 0; t < 3; t++) {
    SPR.types[t].white = enemyAtlas(t, t === 2 ? 1 : 2, 1.5, '#FFFFFF');
    if (t === 1) SPR.types[t].red = enemyAtlas(1, 2, 1.5, '#FF3B2E');
  }
}

function drawEnemy(e) {
  const T = SPR.types[e.type], n = SPR.n, k = ((Math.round(e.ang / TAU * n) % n) + n) % n;
  const two = T.phases.length > 1, ph = two && Math.sin(e.walk) < 0 ? 1 : 0;
  let A = T.phases[ph];
  if (e.flash > 0 && T.white) A = T.white[ph];   // 受击瞬间闪白
  else if (e.type === 1 && e.arming && T.red && Math.floor(uiT * (e.armT > 0.5 ? 22 : 12)) % 2 === 0) A = T.red[ph];   // 引信：红白交替闪烁
  const sc = e.scale * spawnScale(e), w = T.half * 2 * sc, u = w / A.cw, bb = A.bb[k], bw = bb[2] - bb[0], bh = bb[3] - bb[1];
  ctx.drawImage(A.cv, (k % SPR.cols) * A.cw + bb[0], Math.floor(k / SPR.cols) * A.cw + bb[1], bw, bh,
    e.x - w / 2 + bb[0] * u, e.y - w / 2 - Math.abs(Math.sin(e.walk)) * 1.3 * sc + bb[1] * u, bw * u, bh * u);
}

/* 所有敌人的地面投影合并成一次填充 */
function drawEnemyShadows() {

    ctx.moveTo(e.x + r, e.y + 5); ctx.ellipse(e.x, e.y + 5, r, r * 0.5, 0, 0, TAU);

function barW(x, y, w, h, frac, col) {
  ctx.fillStyle = '#000'; ctx.fillRect(x - 1.5, y - 1.5, w + 3, h + 3);

/* ============================================================

function smokeSprite(col) {
  return cachedSprite('smk' + col, () => { const s = spriteCtx(13, 2); circ(s.g, 0, 0, 11.5); s.g.fillStyle = col; s.g.fill(); s.g.lineWidth = 2.2; s.g.strokeStyle = '#000'; s.g.stroke(); return s; });
}
function chunkSprite(col) {
  return cachedSprite('chk' + col, () => { const s = spriteCtx(8.5, 3), g = s.g; g.beginPath(); g.moveTo(-6.5, -4); g.lineTo(7.2, 0); g.lineTo(-2.6, 5.8); g.closePath(); g.fillStyle = col; g.fill(); g.lineWidth = 1.3; g.strokeStyle = '#000'; g.stroke(); return s; });
}
function drawParts() {
  ctx.lineCap = 'round';
  for (let i = 0; i < parts.length; i++) {
    const o = parts[i], k = o.life / o.max;
    switch (o.type) {
      case 'spark':
        ctx.globalAlpha = Math.min(1, k * 1.6); ctx.strokeStyle = o.col; ctx.lineWidth = o.size;
        ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(o.x - o.vx * 0.03, o.y - o.vy * 0.03); ctx.stroke();
        break;
      case 'flame':
        ctx.globalAlpha = k; circ(ctx, o.x, o.y, o.size * k); ctx.fillStyle = o.col; ctx.fill();
        break;
      case 'smoke':
        blit(smokeSprite(o.col), o.x, o.y, o.size * (1.7 - k * 0.7) / 11.5, Math.min(1, k * 1.8) * 0.9);
        break;
      case 'chunk': {
        const s = o.size * Math.min(1, k * 2 + 0.2) / 7, spr = chunkSprite(o.col);
        ctx.globalAlpha = Math.min(1, k * 2.5);
        ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.rot); ctx.drawImage(spr.cv, -8.5 * s, -8.5 * s, 17 * s, 17 * s); ctx.restore();
        break;
      }
      case 'shell':
        ctx.globalAlpha = Math.min(1, k * 3);
        ctx.save(); ctx.translate(o.x, o.y - o.z); ctx.rotate(o.rot);
        ctx.fillStyle = o.col; ctx.fillRect(-2.4, -1.1, 4.8, 2.2); ctx.lineWidth = 1.2; ctx.strokeStyle = '#000'; ctx.strokeRect(-2.4, -1.1, 4.8, 2.2);
        ctx.restore();
        break;
    }
  }
  ctx.globalAlpha = 1;
}

/* 伤害跳字：普通白色 / 暴击大号黄色 / 持续伤害橙色；弹出放大后上飘淡出（位图缓存，每条只贴图一次） */
function drawTexts() {
  for (let i = 0; i < texts.length; i++) {
    const t = texts[i], k = t.life / t.max, age = t.max - t.life, sc = 1 + (1 - Math.min(1, age / 0.09)) * 0.7, size = t.crit ? 28 : t.small ? 14 : 17;
    ctx.globalAlpha = k < 0.35 ? k / 0.35 : 1;
    drawTextSprite(textSprite(t.str, size, t.col, t.crit ? 6 : 4, 0, RES), t.x, t.y, t.rot, sc);
  }
  ctx.globalAlpha = 1;
}

/* 拟声词：弹出放大 → 回弹 → 上飘淡出；带黑描边与硬投影（位图缓存） */
function drawWords(screenLayer) {
  for (let i = 0; i < words.length; i++) {
    const w = words[i]; if (!!w.screen !== screenLayer) continue;
    const t = 1 - w.life / w.max, pop = t < 0.14 ? lerp(2.0, 1, easeOut(t / 0.14)) : 1, k = w.life / w.max;
    ctx.globalAlpha = k < 0.4 ? k / 0.4 : 1;
    drawTextSprite(textSprite(w.str, w.size, w.col, w.size * 0.2, w.size * 0.07, clamp(DPR * (w.screen ? 1 : ZOOM), 1, 2.5)), w.x + (t < 0.1 ? rand(-2.5, 2.5) : 0), w.y - t * 24, w.rot, pop);
  }
  ctx.globalAlpha = 1;
}

function drawBooms() {
  ctx.lineJoin = 'round';
  for (let i = 0; i < booms.length; i++) {
    const b = booms[i], t = clamp(b.t / b.max, 0, 1), r = b.r * easeOut(t);
    if (b.ring) {   // 震爆脉冲：扩散冲击环
      ctx.globalAlpha = 1 - t;
      ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, TAU); ctx.lineWidth = 26 * (1 - t) + 4; ctx.strokeStyle = '#000'; ctx.stroke();
      ctx.lineWidth = 16 * (1 - t) + 2; ctx.strokeStyle = '#FFF6A0'; ctx.stroke();
      ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.94, 0, TAU); ctx.lineWidth = 8 * (1 - t) + 1; ctx.strokeStyle = '#FFD23F'; ctx.stroke();
      continue;
    }
    ctx.globalAlpha = 1 - t * t;
    if (t < 0.6) {   // 漫画爆炸星形
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      const sr = b.r * (0.9 + t * 0.5); ctx.scale(sr, sr);
      polyPath(ctx, b.pts); ctx.fillStyle = '#FFD23F'; ctx.fill(); ctx.lineWidth = 4 / sr; ctx.strokeStyle = '#000'; ctx.stroke();
      ctx.restore();
    }
    circ(ctx, b.x, b.y, r); ctx.fillStyle = '#FF7A1A'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.stroke();
    circ(ctx, b.x, b.y, r * 0.7); ctx.fillStyle = '#FFC61A'; ctx.fill();
    circ(ctx, b.x, b.y, r * 0.4 * (1 - t * 0.5)); ctx.fillStyle = '#FFF6D0'; ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawBolts() {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 0; i < bolts.length; i++) {
    const b = bolts[i], s = b.seg;
    ctx.globalAlpha = Math.min(1, b.life / b.max * 2);
    for (let pass = 0; pass < 3; pass++) {
      ctx.lineWidth = pass === 0 ? 6.5 : pass === 1 ? 3.2 : 1.3; ctx.strokeStyle = pass === 0 ? '#000' : pass === 1 ? '#5FF3FF' : '#FFFFFF';
      ctx.beginPath();
      for (let j = 0; j < s.length; j += 4) { ctx.moveTo(s[j], s[j + 1]); ctx.lineTo(s[j + 2], s[j + 3]); }
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

/* 冲刺残影：玩家剪影 × 12 个朝向 × 2 种颜色，启动时预生成 */
const GHOST_SPR = [];
function buildGhostSprites() {
  for (let k = 0; k < 12; k++) GHOST_SPR[k] = ['#49E6FF', '#FFD23F'].map(col => { const sp = spriteCtx(26, 2.5); drawPlayerBody(sp.g, 0, 0, k / 12 * TAU, 0, true, 0, 1, col); return sp; });
}
function drawGhosts() {
  for (let i = 0; i < ghosts.length; i++) {
    const g = ghosts[i], k = ((Math.round(g.aim / TAU * 12) % 12) + 12) % 12;

/* 程序化图标：在 [-1,1] 单位框内绘制，s 为半宽像素 */
function drawIcon(id, cx, cy, s, col, g) {
  g = g || ctx;
  g.save(); g.translate(cx, cy); g.scale(s, s);
  g.lineJoin = 'round'; g.lineCap = 'round';
  const line = (x1, y1, x2, y2, w) => {
    g.strokeStyle = '#000'; g.lineWidth = w + 0.18; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
    g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  };
  const dot = (x, y, r) => { g.fillStyle = '#000'; circ(ctx, x, y, r + 0.09); g.fill(); g.fillStyle = col; circ(ctx, x, y, r); g.fill(); };
  const poly = (pts, fill, ol) => {
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath();
    if (fill) { g.fillStyle = fill; g.fill(); }
    if (ol) { g.lineWidth = ol; g.strokeStyle = '#000'; g.stroke(); }
  };
  const ring = (x, y, r, w) => { g.strokeStyle = '#000'; g.lineWidth = w + 0.18; circ(ctx, x, y, r); g.stroke(); g.strokeStyle = col; g.lineWidth = w; circ(ctx, x, y, r); g.stroke(); };
  switch (id) {
    case 'shotgun':
      for (const a of [-0.42, 0, 0.42]) { line(-0.65, 0.45, -0.65 + Math.cos(a) * 1.05, 0.45 + Math.sin(a) * 1.05, 0.15); dot(-0.65 + Math.cos(a) * 1.28, 0.45 + Math.sin(a) * 1.28, 0.14); }
      break;
    case 'firerate':
      poly([[-0.15, -0.28], [0.9, -0.28], [0.9, 0], [-0.15, 0]], col, 0.14);
      poly([[-0.15, 0], [0.12, 0], [0, 0.62], [-0.3, 0.62]], col, 0.14);
      line(-0.9, -0.2, -0.32, -0.2, 0.13); line(-0.82, 0.16, -0.28, 0.16, 0.13); line(-0.9, 0.52, -0.36, 0.52, 0.13);
      break;
    case 'pierce':
      ring(0.05, 0, 0.5, 0.15); line(-0.9, 0, 0.72, 0, 0.17); poly([[0.84, 0], [0.42, -0.3], [0.42, 0.3]], col, 0.12);
      break;
    case 'fire':
      poly([[0, -0.92], [0.48, -0.3], [0.78, 0.2], [0.6, 0.7], [0, 0.92], [-0.6, 0.7], [-0.78, 0.2], [-0.4, -0.2], [-0.22, -0.55]], col, 0.14);
      poly([[0, -0.3], [0.32, 0.15], [0.32, 0.58], [0, 0.74], [-0.32, 0.58], [-0.32, 0.15]], '#FFE23F', 0);
      break;
    case 'shock':
      poly([[0.15, -0.92], [-0.48, 0.1], [-0.08, 0.1], [-0.25, 0.92], [0.52, -0.14], [0.1, -0.14]], col, 0.14);
      break;
    case 'damage':
      poly([[-0.62, -0.2], [0, -0.92], [0.62, -0.2], [0.62, 0.55], [0.38, 0.9], [-0.38, 0.9], [-0.62, 0.55]], col, 0.14);
      poly([[-0.22, -0.25], [0, -0.66], [0.22, -0.25]], '#FFFFFF', 0);
      g.fillStyle = '#111'; g.fillRect(-0.62, 0.36, 1.24, 0.14);
      break;
    case 'speed':
      poly([[-0.9, -0.55], [-0.35, 0], [-0.9, 0.55], [-0.55, 0.55], [0, 0], [-0.55, -0.55]], col, 0.13);
      poly([[-0.05, -0.55], [0.5, 0], [-0.05, 0.55], [0.3, 0.55], [0.85, 0], [0.3, -0.55]], col, 0.13);
      break;
    case 'magnet': {
      const u = () => { g.beginPath(); g.moveTo(-0.45, -0.55); g.lineTo(-0.45, 0.15); g.arc(0, 0.15, 0.45, Math.PI, 0, true); g.lineTo(0.45, -0.55); };
      g.lineCap = 'butt';
      u(); g.strokeStyle = '#000'; g.lineWidth = 0.5; g.stroke(); u(); g.strokeStyle = col; g.lineWidth = 0.3; g.stroke();
      g.lineWidth = 0.12; g.fillStyle = '#F4F1E8'; g.strokeStyle = '#000';
      rr(ctx, -0.6, -0.85, 0.3, 0.24, 0.05); g.fill(); g.stroke(); rr(ctx, 0.3, -0.85, 0.3, 0.24, 0.05); g.fill(); g.stroke();
      break;
    }
    case 'crit':
      ring(0, 0, 0.52, 0.15); dot(0, 0, 0.16);
      for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; line(Math.cos(a) * 0.66, Math.sin(a) * 0.66, Math.cos(a) * 0.98, Math.sin(a) * 0.98, 0.15); }
      break;
    case 'shield': {
      const sh = [[-0.75, -0.6], [0, -0.88], [0.75, -0.6], [0.7, 0.22], [0, 0.9], [-0.7, 0.22]];
      poly(sh, col, 0); poly([[0, -0.88], [0.75, -0.6], [0.7, 0.22], [0, 0.9]], 'rgba(0,0,0,0.32)', 0); poly(sh, null, 0.15);
      break;
    }
    case 'maxhp': case 'heal':
      rr(ctx, -0.78, -0.78, 1.56, 1.56, 0.28); g.fillStyle = '#F4F1E8'; g.fill(); g.lineWidth = 0.15; g.strokeStyle = '#000'; g.stroke();
      rr(ctx, -0.17, -0.52, 0.34, 1.04, 0.06); g.fillStyle = '#E8452C'; g.fill(); g.lineWidth = 0.09; g.stroke();
      rr(ctx, -0.52, -0.17, 1.04, 0.34, 0.06); g.fillStyle = '#E8452C'; g.fill(); g.stroke();
      break;
    case 'dashcd':
      line(-0.95, -0.5, 0, -0.5, 0.16); line(-0.8, 0.05, -0.1, 0.05, 0.16); line(-0.95, 0.6, 0.05, 0.6, 0.16); dot(0.42, 0.05, 0.36);
      break;
    case 'nuke':
      dot(0, 0, 0.3);
      for (let i = 0; i < 8; i++) { const a = i / 8 * TAU + 0.2; line(Math.cos(a) * 0.5, Math.sin(a) * 0.5, Math.cos(a) * 0.95, Math.sin(a) * 0.95, 0.14); }
      break;
    case 'frenzy':
      for (const ox of [-0.45, 0.45]) { poly([[ox - 0.26, -0.25], [ox, -0.9], [ox + 0.26, -0.25], [ox + 0.26, 0.6], [ox - 0.26, 0.6]], col, 0.13); g.fillStyle = '#111'; g.fillRect(ox - 0.26, 0.3, 0.52, 0.12); }
      break;
    case 'vault':
      poly([[-0.9, -0.6], [0, -0.05], [0.9, -0.6], [0.55, 0.7], [0, 0.22], [-0.55, 0.7]], col, 0.16);
      break;
    case 'skull':
      circ(ctx, 0, -0.15, 0.62); g.fillStyle = '#F4F1E8'; g.fill(); g.lineWidth = 0.16; g.strokeStyle = '#000'; g.stroke();
      rr(ctx, -0.38, 0.35, 0.76, 0.42, 0.14); g.fillStyle = '#F4F1E8'; g.fill(); g.stroke();
      g.fillStyle = '#111'; circ(ctx, -0.25, -0.2, 0.19); g.fill(); circ(ctx, 0.25, -0.2, 0.19); g.fill();
      g.fillRect(-0.2, 0.42, 0.07, 0.26); g.fillRect(0.13, 0.42, 0.07, 0.26); g.fillRect(-0.035, 0.42, 0.07, 0.26);
      break;
  }
  g.restore();
}

/* 平涂进度条：黑描边 + 顶部亮条（赛璐璐上色） */
function bar(x, y, w, h, frac, col, colLight) {
  ctx.fillStyle = '#000'; rr(ctx, x - 3, y - 3, w + 6, h + 6, 5); ctx.fill();
  ctx.fillStyle = '#2B2118'; ctx.fillRect(x, y, w, h);
  const fw = Math.round(w * clamp(frac, 0, 1));
  if (fw > 0) {
    ctx.fillStyle = col; ctx.fillRect(x, y, fw, h);
    if (colLight) { ctx.fillStyle = colLight; ctx.fillRect(x, y, fw, Math.ceil(h * 0.34)); }
  }
}

function drawSpeaker(x, y, muted, g) {
  g = g || ctx;
  g.beginPath(); g.moveTo(x - 10, y - 4); g.lineTo(x - 5, y - 4); g.lineTo(x + 1, y - 9); g.lineTo(x + 1, y + 9); g.lineTo(x - 5, y + 4); g.lineTo(x - 10, y + 4); g.closePath();
  g.fillStyle = muted ? '#E8452C' : '#1A120B'; g.fill(); g.lineJoin = 'round'; g.lineWidth = 2; g.strokeStyle = '#000'; g.stroke();
  if (muted) {
    g.strokeStyle = '#E8452C'; g.lineWidth = 3; g.beginPath(); g.moveTo(x + 6, y - 5); g.lineTo(x + 14, y + 5); g.moveTo(x + 14, y - 5); g.lineTo(x + 6, y + 5); g.stroke();
  } else {
    g.strokeStyle = '#1A120B'; g.lineWidth = 2;
    g.beginPath(); g.arc(x + 2, y, 6, -0.9, 0.9); g.stroke();
    g.beginPath(); g.arc(x + 2, y, 10, -0.8, 0.8); g.stroke();
  }
}

/* 字距拉开的英文副标题 */
function spaced(s, x, y, size, col, gap) {
  ctx.font = '900 ' + size + 'px ' + FONT_IMPACT; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  let total = 0; for (const ch of s) total += ctx.measureText(ch).width + gap;
  total -= gap;
  let cx = x - total / 2;
  ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = '#000';
  for (const ch of s) { const w = ctx.measureText(ch).width; ctx.strokeText(ch, cx, y); ctx.fillStyle = col; ctx.fillText(ch, cx, y); cx += w + gap; }
}

/* 一排按键帽 + 说明 */
function keyRow(items, cx, y) {
  ctx.font = '900 14px ' + FONT_UI;
  const ws = items.map(it => [Math.max(30, ctx.measureText(it[0]).width + 16), ctx.measureText(it[1]).width]);
  let total = 0; for (const w of ws) total += w[0] + 8 + w[1];
  total += (items.length - 1) * 26;
  let x = cx - total / 2;
  items.forEach((it, i) => {
    const kw = ws[i][0];
    ctx.fillStyle = '#F4E9D3'; rr(ctx, x, y - 14, kw, 28, 6); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.stroke();
    ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(it[0], x + kw / 2, y + 1);
    txt(it[1], x + kw + 8, y + 1, 14, '#F4E9D3', 'left', 4);
    x += kw + 8 + ws[i][1] + 26;
  });
}

function upgradeBoxSprite(key, u) {

    g.lineWidth = 3; g.strokeStyle = '#000'; g.strokeText(label, maxed ? 0 : 12, 12); g.fillStyle = maxed ? '#FFD23F' : '#fff'; g.fillText(label, maxed ? 0 : 12, 12);

/* 中文换行：优先在逗号处断行，避免行尾只剩一个字 */
function wrapText(s, n) {
  const out = []; let cur = '';
  for (let i = 0; i < s.length; i++) {
    const ch = s[i]; cur += ch;
    if (ch === '，' && cur.length >= 6) { out.push(cur); cur = ''; }
    else if (cur.length >= n && s[i + 1] !== '，') {
      if (s.length - i - 1 === 1 && cur.length > 2) { out.push(cur.slice(0, -1)); cur = cur[cur.length - 1]; }
      else { out.push(cur); cur = ''; }
    }
  }
  if (cur) out.push(cur);
  return out;
}

function drawCrosshair(x, y) {
  const p = player, gap = 8 + clamp(p.spread, 0, 30) * 0.7, len = 9, R = gap + len + 8;
  const col = p.reloading ? '#FFFFFF' : p.hasTarget ? '#FF4A36' : '#FFE23F';
  ctx.save(); ctx.translate(x, y); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.save();
  if (p.reloading) ctx.rotate(uiT * 6);
  for (let i = 0; i < 4; i++) {   // 随射击 / 移动扩散的刻线
    const c = Math.cos(i * Math.PI / 2), s = Math.sin(i * Math.PI / 2);
    ctx.beginPath(); ctx.moveTo(c * gap, s * gap); ctx.lineTo(c * (gap + len), s * (gap + len));
    ctx.lineWidth = 5.5; ctx.strokeStyle = '#000'; ctx.stroke(); ctx.lineWidth = 2.6; ctx.strokeStyle = col; ctx.stroke();
  }
  ctx.restore();
  circ(ctx, 0, 0, 2.2); ctx.fillStyle = '#000'; ctx.fill(); circ(ctx, 0, 0, 1.1); ctx.fillStyle = col; ctx.fill();
  const frac = p.reloading ? 1 - p.reloadT / p.reloadMax : p.mag / p.magMax;   // 外圈：弹药量 / 装弹进度
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.85)'; circ(ctx, 0, 0, R); ctx.stroke();
  ctx.lineWidth = 2.8; ctx.strokeStyle = p.reloading ? '#5FF3FF' : '#FFD23F';
  ctx.beginPath(); ctx.arc(0, 0, R, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(frac, 0, 1)); ctx.stroke();
  ctx.restore();
  if (p.reloading) txt('装填中', x, y + R + 16, 13, '#5FF3FF', 'center', 4);
}

/* ============================================================
   主循环
   ============================================================ */
function updateWorld(dt) {
  gameTime += dt;
  collectSolids();
  if (player.alive) updatePlayer(dt);
  updateSpawns(dt);
  updateEnemies(dt);
  Grid.build(enemies);
  separate();
  updateBullets(dt);
  updateDrops(dt);
  updateFuses(dt);
  sweepEnemies();
  if (player.alive && player.xp >= player.xpNext) levelUp();
}

function update(dt) {
  uiT += dt;
  mouse.wx = cam.x + (mouse.x - W / 2) / ZOOM; mouse.wy = cam.y + (mouse.y - H / 2) / ZOOM;
  // 屏幕震动（位移 + 轻微旋转），线性衰减
  if (cam.shake > 0) { cam.shake = Math.max(0, cam.shake - dt * 34); cam.sx = rand(-cam.shake, cam.shake); cam.sy = rand(-cam.shake, cam.shake); cam.rot = rand(-cam.shake, cam.shake) * 0.0011; }
  else { cam.sx = cam.sy = cam.rot = 0; }
  if (hurtFlash > 0) hurtFlash = Math.max(0, hurtFlash - dt * 2.4);
  if (whiteFlash > 0) whiteFlash = Math.max(0, whiteFlash - dt * 2.2);
  if (speedT > 0) speedT -= dt;

  if (state === ST.START) {
    cam.x += 24 * dt; cam.y += 10 * dt;
    Music.energy = 0.3;
    updateFx(dt);
  } else if (state === ST.PLAY) {
    Music.energy = clamp(0.3 + gameTime / 420, 0.3, 1);
    if (hintT > 0) hintT -= dt;
    let sdt = dt;
    if (hitStop > 0) { hitStop -= dt; sdt = dt * 0.1; }   // 顿帧：爆炸 / 爆头瞬间的时间拉伸
    if (!player.alive) sdt = dt * 0.3;                     // 死亡慢镜头
    gun = calcGun();
    updateWorld(sdt);
    updateFx(sdt);
    if (!player.alive) { deathT -= dt; if (deathT <= 0) { state = ST.OVER; overT = 0; uiRects.over = null; Music.stop(); } }
  } else if (state === ST.LEVEL) {
    levelT += dt; Music.energy = 0.3;
    for (let i = 0; i < cards.length; i++) {
      const c = cards[i], on = !picking && levelT > 0.3 + i * 0.08 && ptInRect(mouse.x, mouse.y, c);
      c.hover = clamp(c.hover + (on ? 0.25 : -0.25), 0, 1);
      if (on && !c.wasHover) SFX.hover();
      c.wasHover = on;
    }
    const son = !picking && levelT > 0.3 && ptInRect(mouse.x, mouse.y, uiRects.skip);
    skipHover = clamp(skipHover + (son ? 0.25 : -0.25), 0, 1);
    if (son && !skipWas) SFX.hover();
    skipWas = son;
    if (picking) { picking.t += dt; if (picking.t >= 0.24) resolvePick(); }
    updateFx(dt * 0.2);
  } else if (state === ST.OVER) {
    overT += dt; Music.energy = 0.3;
    updateFx(dt * 0.35);
  }
  // PAUSE：世界与特效全部冻结
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  uiHover = false;
  // ---- 世界层（镜头：缩放 + 震动位移 + 震动旋转）----
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.rotate(cam.rot); ctx.scale(ZOOM, ZOOM); ctx.translate(-cam.x + cam.sx, -cam.y + cam.sy);
  const x0 = cam.x - vw - 90, y0 = cam.y - vh - 90, x1 = cam.x + vw + 90, y1 = cam.y + vh + 90;
  drawGround(x0, y0, x1, y1);
  drawDecals();
  drawGhosts();
  drawEnemyShadows();
  for (let i = 0; i < drawList.length; i++) {
    const o = drawList[i];
    if (o.dk === 1) drawPropCached(o); else if (o.dk === 2) drawEnemy(o); else if (o.dk === 3) drawPlayer(); else drawDrop(o);
  }
  drawEnemyOverlays();
  drawBooms(); drawBolts(); drawBullets(); drawParts(); drawTexts(); drawWords(false);
  ctx.restore();
  // ---- 屏幕层 ----
  if (speedT > 0) drawSpeedLines(speedT / 0.22);
  ctx.drawImage(vignCv, 0, 0, W, H);
  const lowHp = player.alive && player.hp < player.hpMax * 0.3 && state !== ST.START;
  const redA = Math.max(hurtFlash * 0.55, lowHp ? 0.16 + Math.sin(uiT * 6) * 0.08 : 0);
  if (redA > 0.01) { ctx.globalAlpha = clamp(redA / 0.55, 0, 1); ctx.drawImage(vignRed, 0, 0, W, H); ctx.globalAlpha = 1; }
  if (whiteFlash > 0) { ctx.fillStyle = 'rgba(255,246,210,' + (whiteFlash * 0.6).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
  if (state === ST.START) drawStart();
  else {
    drawHUD(state === ST.PLAY || state === ST.PAUSE);   // 升级 / 结算界面顶部让位给标题
    if (state === ST.LEVEL) drawLevelUp(); else if (state === ST.PAUSE) drawPause(); else if (state === ST.OVER) drawOver();
  }
  drawWords(true);
  if (debug) drawDebug();
  drawCursor();
}

let last = performance.now(), qAcc = 0, qN = 0, qBad = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const raw = (now - last) / 1000; last = now;
  let dt = raw > 0.25 ? 0.25 : raw; if (dt < 0) dt = 0;
  fpsAcc += dt; fpsN++;
  if (fpsAcc >= 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  // 动态分辨率：战斗中连续两个 1.5 秒窗口的平均帧率都低于 57，就降低一档内部渲染分辨率（最低到 0.5 倍），流畅优先
  if (state === ST.PLAY && gameTime > 4 && raw < 0.2 && !document.hidden) {
    qAcc += raw; qN++;
    if (qAcc >= 1.5) {
      if (qN / qAcc < 57) { if (++qBad >= 2 && resScale > 0.5) { resScale = Math.max(0.5, resScale - 0.2); resize(); qBad = 0; } }
      else qBad = 0;
      qAcc = 0; qN = 0;
    }
  } else { qAcc = 0; qN = 0; qBad = 0; }
  let step = dt > 0.05 ? 0.05 : dt;
  update(step);
  render();
}

/* 调试 / 自动化测试接口（不影响正常游玩） */
window.__wm = {
  get state() { return state; }, get time() { return gameTime; }, get fps() { return fps; },
  player: () => player, enemies: () => enemies, stats: () => stats,
  counts: () => ({ enemies: enemies.length, bullets: bullets.length, parts: parts.length, drops: drops.length, decals: decals.length }),
  start: startGame,
  xp(n) { player.xp += n; },
  setTime(t) { gameTime = t; },
  spawn(n, type, elite, dist) { for (let i = 0; i < n; i++) { const a = rand(TAU), d = dist || rand(380, 700); spawnEnemy(type || 0, player.x + Math.cos(a) * d, player.y + Math.sin(a) * d, !!elite); } },
  hurt(n) { hurtPlayer(n, player.x + 40, player.y, true); },
  pick: chooseCard,
  up(key, ri) { applyUpgrade(key, ri === undefined ? 0 : ri); },
  tick(n, dt) { for (let i = 0; i < n; i++) update(dt || 1 / 60); render(); }   // 手动推帧（不依赖 requestAnimationFrame）
};

/* 预热：首次使用某种字体 / 描边样式时浏览器要加载字形，可能造成一帧卡顿；在首帧之前先画一遍（不可见） */
function warmup() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.font = 'italic 900 17px ' + FONT_IMPACT; ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.fillStyle = '#fff';
  ctx.strokeText('0123456789', 60, 40); ctx.fillText('0123456789', 60, 40);
  comicText('BOOM! CRIT! 12 升级！第 波 已暂停 敌 来袭', W / 2, H / 2, 42, '#FFD23F', 8, 5);
  txt('护盾 100 / 100 冲刺就绪 装填中 0123456789', W / 2, H / 2 + 60, 16, '#fff', 'center', 4);
  txt('00:00 LV 12', W / 2, H / 2 + 90, 24, '#fff', 'center', 4, FONT_IMPACT);
  spaced('WASTELAND MAYHEM', W / 2, H / 2 + 130, 24, '#fff', 6);
  for (const id of ['shotgun', 'firerate', 'pierce', 'fire', 'shock', 'damage', 'speed', 'magnet', 'crit', 'shield', 'maxhp', 'dashcd', 'heal', 'nuke', 'frenzy', 'vault', 'skull']) drawIcon(id, W / 2, H / 2 + 180, 12, '#FFD23F');
}

resize();
Snd.unlock();   // 页面加载时就创建音频设备（约几十毫秒）；浏览器会先挂起，等玩家第一次按键/点击时再恢复，避免开局首帧卡顿
buildGround();
buildGroundTile();
buildStaticSprites();
buildEnemySprites();
buildFlashSprites();
warmup();
mouse.x = W / 2; mouse.y = H * 0.45;
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
