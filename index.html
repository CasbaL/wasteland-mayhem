  cards = [];
  const rots = [-0.07, 0.015, 0.075];
  const wgt = k => TIER[UPS[k].tier].w * (UPS[k].lvl === 0 ? 1.35 : 1);   // 没拿过的卡更容易出现；传奇卡更稀有
  const draw = pool => { let tot = 0; for (const k of pool) tot += wgt(k); let r = Math.random() * tot, idx = 0; for (; idx < pool.length; idx++) { r -= wgt(pool[idx]); if (r <= 0) break; } return Math.min(idx, pool.length - 1); };
  const take = (pool, i) => { const c = makeCard(pool.splice(i, 1)[0]); c.rot = rots[cards.length]; cards.push(c); };
  if (vault) {   // 秘藏宝箱：只出元素 / 厂牌（蓝）与传奇（橙），并且必出 1 张传奇
    let pool = all.filter(k => UPS[k].tier >= 1);
    const leg = pool.filter(k => UPS[k].tier === 2);
    if (leg.length) { const k = leg[draw(leg)]; pool.splice(pool.indexOf(k), 1); take([k], 0); }
    while (cards.length < 3 && pool.length) take(pool, draw(pool));
    while (cards.length < 3) {   // 稀有卡全部满级了，才用基础卡补位
      const rest = all.filter(k => UPS[k].tier === 0 && !cards.some(c => c.key === k));
      if (!rest.length) break;
      take(rest, draw(rest));
    }
  } else while (cards.length < 3 && all.length) take(all, draw(all));
  const fb = ['heal', 'nuke', 'frenzy'];   // 全部满级后的补给卡
  for (let i = 0; i < fb.length && cards.length < 3; i++) { const c = makeCard(fb[i]); c.rot = rots[cards.length]; cards.push(c); }
  state = ST.LEVEL; levelT = 0; picking = null; uiRects.skip = null;
  for (let i = words.length - 1; i >= 0; i--) if (words[i].screen) poolKill(words, wordPool, i);   // 连续升级时只保留一个 LEVEL UP!
  addWord(vaultMode ? 'VAULT LOOT!' : 'LEVEL UP!', W / 2 + 268, 88, vaultMode ? '#FF8C00' : '#5FF3FF', 40, null, 0, true);
  SFX.levelup();
}
function levelUp() {
  while (player.xp >= player.xpNext) { player.xp -= player.xpNext; player.level++; player.xpNext = xpNeed(player.level); pendingLevels++; }
  if (state === ST.PLAY) openLevelUp();
}
/* 震爆脉冲卡：对屏幕内所有敌人造成大额伤害与击退 */
function shockwave() {
  const R = Math.max(vw, vh) + 80;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i]; if (e.dead) continue;
    const dx = e.x - player.x, dy = e.y - player.y, d = hyp(dx, dy); if (d > R) continue;
    applyDamage(e, 220 * (1 + gameTime / 120), { sourceTag: 'nuke', kx: dx / (d || 1), ky: dy / (d || 1), kb: 6 });
  }
  booms.push({ x: player.x, y: player.y, r: R * 1.05, t: 0, max: 0.55, ring: true, rot: 0, pts: null });
  addShake(20); hitStop = 0.08; addWord('KA-BOOM!', player.x, player.y - 40, '#FFD23F', 64, null, 0); SFX.boom();
  toast('震爆脉冲：全场敌人受创！', '#5FF3FF');
}
/* i: 0-2 选卡，3 跳过 */
function chooseCard(i) {
  if (state !== ST.LEVEL || picking) return;
  if (i === 3 || i >= cards.length) { if (vaultMode) return; picking = { i: 3, t: 0 }; return; }   // 宝箱强化是必选的奖励，不能跳过
  picking = { i, t: 0, vault: vaultMode };
  SFX.select();
}
function resolvePick() {
  const i = picking.i, vault = !!picking.vault; picking = null;
  vaultMode = false;
  if (i === 3) { heal(20); toast('跳过：回复 20 生命', '#F4E9D3'); }
  else {
    const c = cards[i];
    if (c.key === 'heal') heal(Math.round(player.hpMax * 0.4));
    else if (c.key === 'nuke') shockwave();
    else if (c.key === 'frenzy') player.frenzyT = 15;
    else applyUpgrade(c.key);
  }

function handleKey(code) {
  if (code === 'KeyM') { toggleMute(); return; }
  if (code === 'Backquote') { debug = !debug; return; }
  if (settings) {   // 设置面板：ESC / P / 空格 / 回车返回，左右方向键以 10% 微调震动
    if (code === 'Escape' || code === 'KeyP' || code === 'Space' || code === 'Enter' || code === 'NumpadEnter') closeSettings();
    else if (code === 'ArrowLeft') { setShake(shakeScale - 0.1); SFX.select(); }
    else if (code === 'ArrowRight') { setShake(shakeScale + 0.1); SFX.select(); }
    return;
  }
  if (state === ST.START) { if (code === 'Enter' || code === 'NumpadEnter' || code === 'Space') startGame(); return; }
  if (state === ST.PLAY) {
    if (bossIntro > 0 && code !== 'KeyP' && code !== 'Escape') return;   // Boss 定格出场期间除了暂停不能操作
    if (code === 'Space' || code === 'ShiftLeft' || code === 'ShiftRight') tryDash();
    else if (code === 'KeyR') startReload(true);
    else if (code === 'KeyP' || code === 'Escape') setPause(true);
    else if (DIGITS[code] !== undefined && DIGITS[code] <= 3) switchWeapon(DIGITS[code] - 1);   // 1 / 2 / 3 换枪（升级界面的选卡数字键在下面单独处理）
    return;
  }
  if (state === ST.LEVEL) { const n = DIGITS[code]; if (n !== undefined) chooseCard(n - 1); return; }
  if (state === ST.PAUSE) { if (code === 'KeyP' || code === 'Escape' || code === 'Space' || code === 'Enter') setPause(false); return; }
  if (state === ST.OVER) { if (overT > 0.6 && (code === 'KeyR' || code === 'Enter' || code === 'Space')) startGame(); }
}

function handleClick() {
  const mx = mouse.x, my = mouse.y;
  if (settings) { clickSettings(mx, my); return; }   // 设置面板打开时只响应面板里的控件
  if (ptInRect(mx, my, muteRect())) { toggleMute(); return; }
  if (state === ST.START) {
    if (ptInRect(mx, my, gearRect())) { openSettings(); return; }
    if (ptInRect(mx, my, uiRects.start)) startGame(); return;
  }
  if (state === ST.LEVEL) {
    if (picking) return;
    for (let i = 0; i < cards.length; i++) if (ptInRect(mx, my, cards[i])) { chooseCard(i); return; }
    if (ptInRect(mx, my, uiRects.skip)) chooseCard(3);
    return;
  }
  if (state === ST.PAUSE) {
    if (ptInRect(mx, my, uiRects.pset)) { openSettings(); return; }
    if (ptInRect(mx, my, uiRects.resume)) setPause(false); return;
  }
  if (state === ST.OVER && overT > 0.6 && ptInRect(mx, my, uiRects.over)) startGame();
}

/* 绘制地面，并构建按 y 排序的绘制队列（高物件 / 敌人 / 玩家 / 掉落物） */
function drawGround(x0, y0, x1, y1) {
  // 地面：无缝瓦片按网格贴图（瓦片间留 0.6 单位重叠，避免镜头旋转时出现接缝）
  const tx0 = Math.floor(x0 / TILE), tx1 = Math.floor(x1 / TILE), ty0 = Math.floor(y0 / TILE), ty1 = Math.floor(y1 / TILE);
  for (let j = ty0; j <= ty1; j++) for (let i = tx0; i <= tx1; i++) ctx.drawImage(groundTile, i * TILE, j * TILE, TILE + 0.6, TILE + 0.6);
  drawList.length = 0;
  const cx0 = Math.floor(x0 / CHUNK), cx1 = Math.floor(x1 / CHUNK), cy0 = Math.floor(y0 / CHUNK), cy1 = Math.floor(y1 / CHUNK);
  for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
    const c = getChunk(cx, cy), b = c.blob;
    if (b.x + 360 > x0 && b.x - 360 < x1 && b.y + 360 > y0 && b.y - 360 < y1) { polyPath(ctx, b.pts, b.x, b.y); ctx.fillStyle = b.col; ctx.fill(); }
    for (let i = 0; i < c.props.length; i++) {

      else drawPropCached(p);

  if (chunks.size > 900) evictChunks(cam.x, cam.y);
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    e.vis = !e.dead && e.x > x0 && e.x < x1 && e.y > y0 && e.y < y1;
    if (e.vis) drawList.push(e);
  }
  for (let i = 0; i < drops.length; i++) { const d = drops[i]; if (d.x > x0 && d.x < x1 && d.y > y0 && d.y < y1) drawList.push(d); }
  if (state !== ST.START && player.alive) drawList.push(player);
  drawList.sort((a, b) => (a.sy !== undefined ? a.sy : a.y) - (b.sy !== undefined ? b.sy : b.y));

    g.beginPath(); g.moveTo(bx - 15, cy - 4.6); g.lineTo(bx + 5, cy - 4.6); g.lineTo(bx + 14, cy); g.lineTo(bx + 5, cy + 4.6); g.lineTo(bx - 15, cy + 4.6); g.closePath();   // 弹体

function drawBullets() {
  ctx.lineCap = 'round';

    if (b.hyp) {   // 亥伯龙锁定：拖尾变成青色激光束（黑边 + 青色 + 白芯）
      const tail = -s.ax * k + 10;

function buildStaticSprites() {
  RES = clamp(DPR * ZOOM, 1.25, 2.25);
  buildDecalSprites(); buildPickupSprites(); buildBulletSprites(); buildPropSprites(); buildMuzzleSprites();
  buildGhostSprites();

  for (const c of ['#4A3C32', '#7A6A5A', '#D9B377', '#2A2420']) smokeSprite(c);
  bubbleSprite('#8CFF3A'); bubbleSprite('#C44DFF');

  for (let v = 0; v < 3; v++) flameSprite(v);   // 火苗三种变体
  zapSprite();
  for (let w = 0; w < 3; w++) { gunIconSprite(w, '#231A12'); gunIconSprite(w, '#F4E9D3'); }   // 枪械侧视剪影（深 / 浅两色）
}
/* ============================================================
   角色矢量画法（粗黑描边 + 平涂阴影块 + 战损划痕）
   g 为目标上下文：敌人画法只在烘焙图集时调用一次，玩家每帧直接绘制。
   ============================================================ */
const PPAL = { boot: '#3B2A1D', jacket: '#E9A21B', jacketDark: '#B5700C', strap: '#6B4226', pad: '#8C3B1E', skin: '#F2C9A0', hair: '#5B2C1A', band: '#2BB3C0', gun: '#4A4E57', gunDark: '#33363D', mag: '#22252B', stripe: '#FFD23F' };
function spawnScale(e) { return e.spawnT > 0 ? 0.4 + 0.6 * (1 - e.spawnT / 0.25) : 1; }

/* 两段式肢体（肩 → 肘 → 手）：先给两段整体描粗黑边，再叠上臂 / 前臂的平涂色；
   上臂与前臂颜色不同时在肘部留一道袖口线。F / S 为取色函数（剪影模式下全部返回剪影色） */
function limb(g, sx, sy, ex, ey, hx, hy, wUp, wFore, cUp, cFore, F, S, handR, handCol) {
  g.lineJoin = 'round'; g.lineCap = 'round';
  g.strokeStyle = S();
  g.lineWidth = wUp + 3; g.beginPath(); g.moveTo(sx, sy); g.lineTo(ex, ey); g.stroke();
  g.lineWidth = wFore + 3; g.beginPath(); g.moveTo(ex, ey); g.lineTo(hx, hy); g.stroke();
  g.strokeStyle = F(cUp); g.lineWidth = wUp; g.beginPath(); g.moveTo(sx, sy); g.lineTo(ex, ey); g.stroke();
  g.strokeStyle = F(cFore); g.lineWidth = wFore; g.beginPath(); g.moveTo(ex, ey); g.lineTo(hx, hy); g.stroke();
  if (cUp !== cFore) {
    const fx = hx - ex, fy = hy - ey, fl = hyp(fx, fy) || 1, nx = -fy / fl, ny = fx / fl, cw = wFore * 0.5 + 1;
    g.strokeStyle = S(); g.lineWidth = 1.5; g.beginPath(); g.moveTo(ex + nx * cw, ey + ny * cw); g.lineTo(ex - nx * cw, ey - ny * cw); g.stroke();
  }
  if (handR > 0) { g.fillStyle = F(handCol || cFore); g.strokeStyle = S(); g.lineWidth = 2.2; circ(g, hx, hy, handR); g.fill(); g.stroke(); }
}
/* 手持武器（俯视，枪口朝 +x）：0 突击步枪（长枪管 + 弹匣 + 木托）1 双管霰弹枪（两根粗枪管 + 木托）2 元素冲锋枪（短枪管 + 青色线圈 + 能量罐）
   rx 为后坐位移；sil 为剪影色（冲刺残影 / 受击闪白），为空则正常上色 */
function drawGun(g, w, rx, F, S, sil) {
  g.lineJoin = 'round'; g.lineCap = 'round'; g.strokeStyle = S(); g.lineWidth = 2.5;
  if (w === 1) {
    g.fillStyle = F('#6B4226'); rr(g, 2 + rx, -4, 11, 8, 2); g.fill(); g.stroke();                      // 木制机匣
    g.fillStyle = F('#5E656D'); rr(g, 10 + rx, -5.6, 25, 4.6, 1.6); g.fill(); g.stroke();               // 上枪管
    rr(g, 10 + rx, 1, 25, 4.6, 1.6); g.fill(); g.stroke();                                              // 下枪管
    g.fillStyle = F('#111'); g.fillRect(33 + rx, -4.7, 1.6, 2.8); g.fillRect(33 + rx, 1.9, 1.6, 2.8);   // 两个枪口
  } else if (w === 2) {
    g.fillStyle = F('#33363D'); rr(g, 5 + rx, -5.5, 15, 11, 3); g.fill(); g.stroke();                   // 机匣
    g.fillStyle = F('#4A4E57'); rr(g, 18 + rx, -2.4, 10, 4.8, 1.6); g.fill(); g.stroke();              // 短枪管
    g.strokeStyle = sil || '#5FF3FF'; g.lineWidth = 2.2;                                             // 青色能量线圈
    for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(19.5 + rx + i * 3, -3.6); g.lineTo(19.5 + rx + i * 3, 3.6); g.stroke(); }
    g.fillStyle = sil || '#5FF3FF'; rr(g, 7.5 + rx, 4.5, 5, 6, 1.5); g.fill(); g.strokeStyle = S(); g.lineWidth = 1.8; g.stroke();   // 能量罐
  } else {
    g.fillStyle = F('#33363D'); rr(g, 2 + rx, -5.5, 14, 11, 2.5); g.fill(); g.stroke();                 // 机匣
    g.fillStyle = F('#4A4E57'); rr(g, 14 + rx, -3, 21, 6, 2); g.fill(); g.stroke();                    // 枪管
    g.fillStyle = F('#22252B'); rr(g, 7.5 + rx, 4, 5, 9, 1.5); g.fill(); g.lineWidth = 2; g.stroke();   // 弹匣
    g.fillStyle = F('#6B4226'); rr(g, -3 + rx, -3.5, 6, 7, 1.5); g.fill(); g.stroke();                 // 枪托
    g.strokeStyle = sil || '#FFD23F'; g.lineWidth = 2; g.beginPath(); g.moveTo(16 + rx, 0); g.lineTo(33 + rx, 0); g.stroke();   // 黄色条纹
  }
}

/* sil：剪影色（受击闪白 / 冲刺残影），为空则正常上色；weapon：手持武器序号 */
function drawPlayerBody(g, x, y, aim, walk, moving, recoil, scale, sil, weapon) {
  const F = c => sil || c, S = () => sil || '#000';
  g.save(); g.translate(x, y); g.scale(scale, scale);
  if (!sil) { g.fillStyle = 'rgba(30,15,5,0.3)'; g.beginPath(); g.ellipse(0, 6, 15, 7, 0, 0, TAU); g.fill(); }
  g.rotate(aim);
  g.lineJoin = 'round'; g.lineCap = 'round';
  const w = weapon || 0, st = moving ? Math.sin(walk) * 7 : 0, rx = -recoil * (w === 1 ? 6 : w === 2 ? 2.2 : 3.5);   // 霰弹枪后坐行程最大
  g.strokeStyle = S(); g.lineWidth = 2.5; g.fillStyle = F(PPAL.boot);
  for (let s = -1; s <= 1; s += 2) { rr(g, st * s - 5.5, s * 6.5 - 3.5, 11, 7, 3); g.fill(); g.stroke(); }
  // 躯干
  g.beginPath(); g.ellipse(0, 0, 12.5, 14, 0, 0, TAU); g.fillStyle = F(PPAL.jacket); g.fill();
  if (!sil) {
    g.save(); g.clip();
    g.fillStyle = PPAL.jacketDark; g.fillRect(-14, 3.5, 28, 12);
    g.strokeStyle = '#000'; g.lineWidth = 1.1;
    for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(-11 + i * 6, 14); g.lineTo(-5 + i * 6, 5); g.stroke(); }
    g.restore();
  }
  g.beginPath(); g.ellipse(0, 0, 12.5, 14, 0, 0, TAU); g.strokeStyle = S(); g.lineWidth = 3; g.stroke();
  g.strokeStyle = sil || PPAL.strap; g.lineWidth = 3.2; g.beginPath(); g.moveTo(-6, -12.5); g.lineTo(6, 12.5); g.stroke();
  if (!sil) { g.strokeStyle = '#F4E9D3'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(-5, -14); g.lineTo(-1, -10); g.moveTo(-3, 12); g.lineTo(1, 10); g.stroke(); }
  // 后手 → 枪 → 前手：两条两段式手臂（肩 → 肘 → 手），前手压在枪上，握点随枪一起后坐
  const hxF = (w === 2 ? 16.5 : w === 1 ? 24 : 19) + rx;   // 前手握点：冲锋枪线圈座 / 霰弹枪护木 / 步枪枪管
  limb(g, -1, 10, 3, 15.5, 12 + rx, 3.5, 6.5, 5, PPAL.jacket, PPAL.skin, F, S, 4);
  if (w >= 0) drawGun(g, w, rx, F, S, sil);   // w = -1：泰迪尔装填期间枪已掷出，空手
  limb(g, -1, -10, 7.5, -14.5, hxF, -1.8, 6.5, 5, PPAL.jacket, PPAL.skin, F, S, 4);
  // 肩甲压在手臂根部上 + 战损划痕
  for (let s = -1; s <= 1; s += 2) { g.beginPath(); g.arc(-2, s * 11.5, 5.6, 0, TAU); g.fillStyle = F(PPAL.pad); g.fill(); g.strokeStyle = S(); g.lineWidth = 2.5; g.stroke(); }
  // 头
  g.beginPath(); g.arc(1.5, 0, 8.5, 0, TAU); g.fillStyle = F(PPAL.skin); g.fill();
  if (!sil) {
    g.fillStyle = PPAL.hair; g.beginPath(); g.arc(1.5, 0, 8.5, Math.PI * 0.5, Math.PI * 1.5); g.closePath(); g.fill();
    g.strokeStyle = PPAL.band; g.lineWidth = 2.6; g.beginPath(); g.moveTo(0.5, -8.4); g.lineTo(0.5, 8.4); g.stroke();
    g.fillStyle = '#111'; circ(g, 5.5, -3.2, 1.25); g.fill(); circ(g, 5.5, 3.2, 1.25); g.fill();
    g.strokeStyle = '#111'; g.lineWidth = 1.3; g.beginPath(); g.moveTo(6, 0.2); g.lineTo(8.4, -0.8); g.stroke();
  }
  g.beginPath(); g.arc(1.5, 0, 8.5, 0, TAU); g.strokeStyle = S(); g.lineWidth = 3; g.stroke();
  g.restore();
}

/* ============================================================
   枪口焰：三把枪 × 3 个变体，启动时烘焙成位图（原点在枪口，朝向 +x）
   突击步枪 = 橙 / 黄 / 白三层尖刺星；双管霰弹枪 = 前冲气浪 + 上下枪口两团火星 + 黑色冲击线；元素冲锋枪 = 小号青白电光星 + 电弧
   ============================================================ */
const MUZ_T = [0.06, 0.1, 0.05], MUZZLE = [[], [], []], MUZ_GLOW = [null, null];
/* 尖刺星路径：n 个尖角，朝前（+x）的更长；seed 决定各尖角的长度抖动，所以每个变体形状都不同 */
function burstPath(g, n, r1, r0, bias, seed) {
  const rng = mulberry32(seed); g.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = i / (n * 2) * TAU, r = (i & 1 ? r0 * (0.8 + rng() * 0.4) : r1 * (0.7 + rng() * 0.6)) * (1 + bias * Math.cos(a));
    if (i) g.lineTo(Math.cos(a) * r, Math.sin(a) * r); else g.moveTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  g.closePath();
}
/* 由外到内叠 cols 层尖刺星，外两层带黑描边 */
function drawBurst(g, cx, cy, n, r1, r0, bias, seed, cols, ol) {
  g.save(); g.translate(cx, cy); g.lineJoin = 'round';
  for (let k = 0; k < cols.length; k++) {
    g.save(); g.rotate(k * 0.19);
    burstPath(g, n, r1 * Math.pow(0.62, k), r0 * Math.pow(0.62, k), bias, seed + k * 13);
    g.fillStyle = cols[k]; g.fill();
    if (k < 2) { g.lineWidth = ol * (k ? 0.6 : 1); g.strokeStyle = '#000'; g.stroke(); }
    g.restore();
  }
  g.restore();
}
function buildMuzzleSprites() {
  const mk = (r, fn) => { const s = spriteCtx(r, RES); fn(s.g); return s; };
  const warm = ['#FF7A1A', '#FFD23F', '#FFF6A0'];
  for (let v = 0; v < 3; v++) {
    MUZZLE[0].push(mk(42, g => {
      drawBurst(g, 0, 0, 8, 23, 7.5, 0.4, 7100 + v * 37, warm, 3);   // 步枪射速高：焰形收着点，不遮准星附近的敌人
      circ(g, 0, 0, 4.5); g.fillStyle = '#fff'; g.fill(); g.lineWidth = 2; g.strokeStyle = '#000'; g.stroke();
    }));
    MUZZLE[1].push(mk(46, g => {
      const L = 50 + v * 5;
      g.save(); g.scale(0.6, 0.6);                                          // 整体缩到 60%：再大就遮住正前方的敌人
      g.lineJoin = 'round'; g.lineCap = 'round';
      g.beginPath(); g.moveTo(2, -6); g.lineTo(L * 0.58, -26); g.lineTo(L, 0); g.lineTo(L * 0.58, 26); g.lineTo(2, 6); g.closePath();   // 前冲的喇叭形气浪
      g.fillStyle = '#FF7A1A'; g.fill(); g.lineWidth = 3; g.strokeStyle = '#000'; g.stroke();
      g.beginPath(); g.moveTo(2, -3.5); g.lineTo(L * 0.44, -13); g.lineTo(L * 0.7, 0); g.lineTo(L * 0.44, 13); g.lineTo(2, 3.5); g.closePath(); g.fillStyle = '#FFD23F'; g.fill();
      g.strokeStyle = '#000'; g.lineWidth = 2.6; g.beginPath();                                   // 四散的黑色冲击线
      for (let i = 0; i < 8; i++) { const a = -1.3 + i / 7 * 2.6, r0 = 40 + (i % 2) * 7 + v * 3, r1 = r0 + 12 + (i % 3) * 5; g.moveTo(Math.cos(a) * r0, Math.sin(a) * r0 * 0.6); g.lineTo(Math.cos(a) * r1, Math.sin(a) * r1 * 0.6); }
      g.stroke();
      drawBurst(g, 3, -3.3, 7, 40, 11, 0.6, 7200 + v * 41, warm, 3);                              // 上下两根枪口各一团
      drawBurst(g, 3, 3.3, 7, 40, 11, 0.6, 7300 + v * 53, warm, 3);
      g.restore();
    }));
    MUZZLE[2].push(mk(38, g => {
      drawBurst(g, 0, 0, 6, 16, 5.5, 0.7, 7400 + v * 29, ['#5FF3FF', '#FFFFFF'], 2.6);
      g.lineJoin = 'round'; g.lineCap = 'round';
      for (let i = 0; i < 3; i++) {                                                               // 三道细小电弧（黑边 + 白心）
        const a = -0.7 + i * 0.7 + (v - 1) * 0.15, ca = Math.cos(a), sa = Math.sin(a), seg = [[11, 0], [15, i % 2 ? 2.4 : -2.4], [21, 0]];
        for (const pass of [0, 1]) {
          g.lineWidth = pass ? 1.5 : 3.8; g.strokeStyle = pass ? '#FFFFFF' : '#000'; g.beginPath();
          seg.forEach((q, j) => { const x = ca * q[0] - sa * q[1], y = sa * q[0] + ca * q[1]; if (j) g.lineTo(x, y); else g.moveTo(x, y); });
          g.stroke();
        }
      }
    }));
  }
  // 枪口在地面上投下的一团光：暖色（火药）/ 青色（电）
  const glow = (c0, c1) => { const r = 72, S = r * 2, cv = mkCanvas(S * 2, S * 2), g = cv.getContext('2d'), gr = g.createRadialGradient(S, S, 0, S, S, S); gr.addColorStop(0, c0); gr.addColorStop(1, c1); g.fillStyle = gr; g.fillRect(0, 0, S * 2, S * 2); return { cv, r }; };
  MUZ_GLOW[0] = glow('rgba(255,214,110,0.42)', 'rgba(255,150,40,0)');
  MUZ_GLOW[1] = glow('rgba(150,243,255,0.36)', 'rgba(60,200,255,0)');
}
/* 枪口焰贴图：k 为剩余寿命比例（1 → 0），v 为这一枪选中的变体；三帧换一个变体形成闪烁 */
function drawMuzzleFlash(x, y, aim, w, k, v, sc) {
  k = clamp(k, 0, 1);
  const s = MUZZLE[w][(v + Math.floor((1 - k) * 3)) % 3], q = (0.8 + 0.5 * k) * sc;
  ctx.save(); ctx.translate(x, y); ctx.rotate(aim); ctx.scale(q * (0.9 + Math.random() * 0.2), q * (0.9 + Math.random() * 0.2));
  ctx.drawImage(s.cv, -s.r, -s.r, s.r * 2, s.r * 2);
  ctx.restore();
}

function drawPlayer() {
  const p = player;
  if (p.iframes > 0 && p.dashT <= 0 && p.swT <= 0 && Math.floor(uiT * 22) % 2 === 0) return;   // 受击无敌闪烁
  const ca = Math.cos(p.aim), sa = Math.sin(p.aim), md = WEAPONS[p.weapon].muzzle;
  const w = p.rel[p.weapon] > 0 && UPS.tediore.lvl ? -1 : p.swapT > 0.11 ? p.prevW : p.weapon;   // 泰迪尔：装填期间枪已经掷出去了；换枪前半段手里仍是旧枪
  if (p.muzzle > 0) {   // 枪口焰：先在地面铺一团枪口投光，画完角色后把火焰压在枪口上
    const k = clamp(p.muzzle / MUZ_T[p.weapon], 0, 1);
    blit(MUZ_GLOW[p.weapon === 2 ? 1 : 0], p.x + ca * (md - 8), p.y + sa * (md - 8), 0.55 + 0.3 * k, 0.5 * k);
  }
  drawPlayerBody(ctx, p.x, p.y, p.aim, p.walk, p.moving, p.recoil, 1, p.flash > 0 ? '#FFFFFF' : null, w);
  if (p.muzzle > 0 && w >= 0) drawMuzzleFlash(p.x + ca * md, p.y + sa * md, p.aim, p.weapon, p.muzzle / MUZ_T[p.weapon], p.muzV, 1);
  // 双持狂暴：左右两侧各多一把枪，跟着一起开火
  if (p.gunzT > 0) for (let s = -1; s <= 1; s += 2) {
    const a = p.aim + s * 0.38, gx = p.x - sa * 15 * s, gy = p.y + ca * 15 * s;
    ctx.save(); ctx.translate(gx, gy); ctx.rotate(a); ctx.scale(1.12, 1.12); drawGun(ctx, p.weapon, 0, c => c, () => '#000', null); ctx.restore();
    if (p.muzzle > 0) drawMuzzleFlash(gx + Math.cos(a) * md * 1.12, gy + Math.sin(a) * md * 1.12, a, p.weapon, clamp(p.muzzle / MUZ_T[p.weapon], 0, 1), p.muzV, 0.6);
  }
  // 亥伯龙锁定：枪口浮现蓝色全息护盾线框（旋转的六边形 + 扫描线，带闪烁）
  if (p.hypLock && UPS.hyperion.lvl) {
    ctx.save(); ctx.translate(p.x + ca * (md + 11), p.y + sa * (md + 11)); ctx.rotate(p.aim);
    ctx.globalAlpha = 0.6 + Math.sin(uiT * 30) * 0.16; ctx.lineJoin = 'round';
    ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + uiT * 1.6, x = Math.cos(a) * 13, y = Math.sin(a) * 10; if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); } ctx.closePath();

/* ============================================================
   敌人图集：每种敌人按 48 个朝向预渲染（疯子 / 矮人各 2 个步行相位），
   运行时每个敌人只发 1 次 drawImage；受击闪白 / 自爆预警用纯色剪影图集。
   ============================================================ */
const SPR = { n: 48, cols: 8, half: [38, 24, 36], types: null };
/* 逐帧扫描图集的透明度，得到每帧不透明内容的紧致包围盒（图集像素）；绘制时只贴这部分，省掉大片透明像素 */
function tightBounds(cv, cw, cols) {
  const W = cv.width, H = cv.height, data = cv.getContext('2d').getImageData(0, 0, W, H).data, bb = [];
  for (let k = 0, rows = Math.ceil(H / cw); k < rows * cols; k++) {
    const ox = (k % cols) * cw, oy = Math.floor(k / cols) * cw;
    let x0 = cw, y0 = cw, x1 = -1, y1 = -1;
    for (let y = 0; y < cw; y++) for (let x = 0; x < cw; x++) if (data[((oy + y) * W + ox + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    bb.push(x1 < 0 ? [0, 0, cw, cw] : [Math.max(0, x0 - 2), Math.max(0, y0 - 2), Math.min(cw, x1 + 3), Math.min(cw, y1 + 3)]);
  }
  return bb;
}
function enemyAtlas(type, phases, R, sil) {
  const n = SPR.n, cols = SPR.cols, rows = Math.ceil(n / cols), cw = Math.ceil(SPR.half[type] * 2 * R), out = [];
  for (let ph = 0; ph < phases; ph++) {
    const cv = mkCanvas(cw * cols, cw * rows), g = cv.getContext('2d');
    for (let k = 0; k < n; k++) {
      g.setTransform(R, 0, 0, R, ((k % cols) + 0.5) * cw, (Math.floor(k / cols) + 0.5) * cw);
      g.lineJoin = 'round'; g.lineCap = 'round';
      const e = { type, x: 0, y: 0, ang: k / n * TAU, walk: ph * Math.PI, scale: 1, spawnT: 0, t: 0, armT: 0, elite: false, hp: 1, hpMax: 1 };
      (type === 0 ? drawPsycho : type === 1 ? drawBomber : drawBruiser)(g, e, sil);
    }
    out.push({ cv, cw, bb: tightBounds(cv, cw, cols) });
  }
  return out;
}
function buildEnemySprites() {
  SPR.types = [0, 1, 2].map(t => ({ half: SPR.half[t], phases: enemyAtlas(t, t === 2 ? 1 : 2, RES, null), white: null, red: null }));
}
/* 给已有的图集整体换色（比把敌人重新矢量渲染一遍便宜得多）：白色剪影 → 任意纯色。scale < 1 时顺带降采样，省显存（半透明叠色用不着满分辨率） */
function tintAtlas(src, col, scale) {
  const k = scale || 1;
  return src.map(a => {
    const cv = mkCanvas(Math.ceil(a.cv.width * k), Math.ceil(a.cv.height * k)), g = cv.getContext('2d');
    g.drawImage(a.cv, 0, 0, cv.width, cv.height); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, cv.width, cv.height);
    return { cv, cw: a.cw * k, bb: a.bb.map(b => b.map(v => v * k)) };
  });
}
function buildFlashSprites() {
  for (let t = 0; t < 3; t++) {
    const T = SPR.types[t], W = enemyAtlas(t, t === 2 ? 1 : 2, 1.5, '#FFFFFF');
    T.white = W;
    T.fire = tintAtlas(W, '#FF7A1A', 0.66);   // 燃烧：橙色
    T.red = tintAtlas(W, '#FF2A1E');          // 自爆预警 / 殊死一搏：红色
    T.blue = tintAtlas(W, '#49C6FF', 0.66);   // 电击：电蓝色
    T.acid = tintAtlas(W, '#8CFF3A', 0.66);   // 腐蚀：荧光绿
    T.slag = tintAtlas(W, '#B44CFF', 0.66);   // 紫渣：亮紫
  }
}
/* 把敌人图集的某一帧贴到屏幕上（帧序号 k、相位 ph、抖动 jx / jy 都由调用方算好） */
function enemyBlit(e, T, A, k, ph, jx, jy, alpha) {
  const sc = e.scale * spawnScale(e), w = T.half * 2 * sc, u = w / A.cw, bb = A.bb[k], bw = bb[2] - bb[0], bh = bb[3] - bb[1];
  if (alpha < 1) ctx.globalAlpha = alpha;
  ctx.drawImage(A.cv, (k % SPR.cols) * A.cw + bb[0], Math.floor(k / SPR.cols) * A.cw + bb[1], bw, bh,
    e.x + jx - w / 2 + bb[0] * u, e.y + jy - w / 2 - Math.abs(Math.sin(e.walk)) * 1.3 * sc + bb[1] * u, bw * u, bh * u);
  if (alpha < 1) ctx.globalAlpha = 1;
}
function drawEnemy(e) {
  if (e.boss) { drawBoss(e); return; }
  if (e.drone) { drawDroneE(e); return; }
  const T = SPR.types[e.type], n = SPR.n, k = ((Math.round(e.ang / TAU * n) % n) + n) % n;
  const two = T.phases.length > 1, ph = two && Math.sin(e.walk) < 0 ? 1 : 0;
  let A = T.phases[ph], jx = 0, jy = 0;
  if (e.flash > 0 && T.white) A = T.white[ph];   // 受击瞬间闪白
  else if (e.type === 1 && e.arming && T.red && Math.floor(uiT * (e.armT > 0.5 ? 22 : 12)) % 2 === 0) A = T.red[ph];   // 引信：红白交替闪烁
  else if (e.shockSlowTimer > 0 && T.white) {   // 被电到：高频闪白 / 电蓝 + 抽搐
    A = (Math.floor(uiT * 40) % 2 === 0 || !T.blue) ? T.white[ph] : T.blue[ph];
    jx = rand(-1.4, 1.4); jy = rand(-1.4, 1.4);
  }
  else if (e.burnTimer > 0 && T.fire && Math.floor(uiT * 9 + e.t) % 4 === 0) A = T.fire[ph];   // 燃烧：周期性整只闪橙
  enemyBlit(e, T, A, k, ph, jx, jy, 1);
  // 状态染色（受击闪白的帧不叠）：灼烧 = 常驻的橙红色调 · 腐蚀 = 常驻的绿色调并周期性闪亮 · 紫渣 = 盖住全身的紫色"油漆"
  if (e.flash > 0 || e.shockSlowTimer > 0) return;
  if (e.burnTimer > 0 && T.fire && A !== T.fire[ph]) enemyBlit(e, T, T.fire[ph], k, ph, jx, jy, 0.42);
  if (e.corrosiveTimer > 0 && T.acid) enemyBlit(e, T, T.acid[ph], k, ph, jx, jy, Math.floor(uiT * 7 + e.t) % 3 === 0 ? 0.7 : 0.36);
  if (e.slagTimer > 0 && T.slag) enemyBlit(e, T, T.slag[ph], k, ph, jx, jy, 0.72);
}
/* 殊死一搏：黑白世界里只有敌人保留红色高亮（在褪色后的画面上再叠一层红色剪影） */
function drawEnemyRed(e) {
  if (e.boss) { ctx.save(); ctx.globalAlpha = 0.9; bossXf(e, 0, 0); BOSS_DRAW[e.kind](ctx, e, '#FF2A1E'); ctx.restore(); return; }
  if (e.drone) { ctx.save(); ctx.globalAlpha = 0.9; ctx.translate(e.x, e.y - 7); drawDrone(ctx, e, '#FF2A1E'); ctx.restore(); return; }
  const T = SPR.types[e.type], n = SPR.n, k = ((Math.round(e.ang / TAU * n) % n) + n) % n;
  enemyBlit(e, T, T.red[T.phases.length > 1 && Math.sin(e.walk) < 0 ? 1 : 0], k, 0, 0, 0, 0.9);
}

/* 所有敌人的地面投影合并成一次填充 */

/* 敌人头顶的小血条：同款斜切平行四边形（黑描边 + 平涂 + 顶部亮带） */
function barW(x, y, w, h, frac, col) {
  const sk = h * 0.8, fw = w * clamp(frac, 0, 1);
  ctx.fillStyle = '#000'; pgram(ctx, x - 2, y - 2, w + 4, h + 4, sk + 1); ctx.fill();
  ctx.fillStyle = '#2B2118'; pgram(ctx, x, y, w, h, sk); ctx.fill();
  if (fw > 0.5) {
    ctx.save(); pgram(ctx, x, y, w, h, sk); ctx.clip();
    ctx.fillStyle = col; ctx.fillRect(x, y, sk + fw, h);
    ctx.fillStyle = 'rgba(255,255,255,0.38)'; ctx.fillRect(x, y, sk + fw, Math.ceil(h * 0.36));
    ctx.restore();
  }
}

/* 顶层标记：自爆预警 "!"、坦克血条、战损裂纹、BADASS 标签 */
function drawEnemyOverlays() {

    if (e.elite) comicText('BADASS', e.x, top - 18, 16, '#FF4A36', 4, 2);

/* 斜切平行四边形路径：上下两条边错开 sk，左右两端是平行的斜边 */
function pgram(g, x, y, w, h, sk) { g.beginPath(); g.moveTo(x + sk, y); g.lineTo(x + w, y); g.lineTo(x + w - sk, y + h); g.lineTo(x, y + h); g.closePath(); }
/* 斜切平行四边形进度条（美漫风）：右下硬投影 + 黑粗描边 + 排线底纹 + 平涂色块（顶部亮带 / 底部暗带）+ 斜切分段刻线
   frac 当前比例；ghost 为"残影比例"，大于 frac 时在末端多画一段米白色，表示刚被扣掉的那部分（省略则不画） */
function bar(x, y, w, h, frac, col, colLight, ghost) {
  frac = clamp(frac, 0, 1);
  const sk = Math.min(h * 0.7, 13), fw = sk + (w - sk) * frac, tick = (w - sk) / Math.max(3, Math.round((w - sk) / 26));
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; pgram(ctx, x + 4, y + 4, w, h, sk); ctx.fill();          // 硬投影
  ctx.save(); pgram(ctx, x, y, w, h, sk); ctx.clip();
  ctx.fillStyle = '#2B2118'; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);                         // 底槽
  ctx.strokeStyle = 'rgba(244,233,211,0.12)'; ctx.lineWidth = 1.5; ctx.beginPath();             // 排线底纹
  for (let tx = x - h; tx < x + w + h; tx += 6) { ctx.moveTo(tx, y + h); ctx.lineTo(tx + h, y); }
  ctx.stroke();
  if (ghost > frac) { ctx.fillStyle = '#FFF6E5'; ctx.fillRect(x + fw - 1, y, (w - sk) * (ghost - frac) + 1, h); }   // 掉血残影
  if (fw > 0.5) {
    ctx.fillStyle = col; ctx.fillRect(x - 2, y, fw + 2, h);
    if (colLight) { ctx.fillStyle = colLight; ctx.fillRect(x - 2, y, fw + 2, Math.ceil(h * 0.34)); }               // 顶部亮带
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(x - 2, y + Math.round(h * 0.72), fw + 2, h);                    // 底部暗带
  }
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.beginPath();                                         // 斜切分段刻线
  for (let tx = x + sk + tick; tx < x + w - 2; tx += tick) { ctx.moveTo(tx, y); ctx.lineTo(tx + 2, y); ctx.lineTo(tx + 2 - sk, y + h); ctx.lineTo(tx - sk, y + h); ctx.closePath(); }
  ctx.fill();
  ctx.restore();
  pgram(ctx, x, y, w, h, sk); ctx.lineJoin = 'round'; ctx.lineWidth = 3.5; ctx.strokeStyle = '#000'; ctx.stroke();
}

function drawSpeaker(x, y, muted, g) {

/* 字距拉开的英文副标题 */
function spaced(s, x, y, size, col, gap) {
  ctx.font = '900 ' + size + 'px ' + FONT_IMPACT; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';

  total -= gap;

  ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = '#000';
  for (const ch of s) { const w = ctx.measureText(ch).width; ctx.strokeText(ch, cx, y); ctx.fillStyle = col; ctx.fillText(ch, cx, y); cx += w + gap; }
}

/* 顶部 Boss 血条：贯穿屏幕的斜切平行四边形，3px 纯黑外描边，50% 处一道狂暴分割线，下方列出当前挂着的元素状态。
   元素状态直接反映在血条上：紫渣 = 亮紫色脉冲外框 · 腐蚀 = 荧光绿 · 灼烧 = 橙红 + 外圈火光 · 电击 = 青色闪烁 */
function drawBossBar() {
  const e = boss; if (!e || !bossBarOn()) return;
  const D = BOSS_DEFS[e.kind], rage = e.phase === 2, f = clamp(e.hp / e.hpMax, 0, 1), gh = clamp(e.hpGhost / e.hpMax, 0, 1);
  const w = Math.max(240, W - 40), x = (W - w) / 2, h = 26, y = 14, sk = 15, k = easeOut(clamp(e.age / 0.35, 0, 1));
  const acid = e.corrosiveTimer > 0, burn = e.burnTimer > 0;
  const col = acid ? '#8CFF3A' : burn ? '#FF7A1E' : rage ? '#FF3B2E' : D.col, colL = acid ? '#E9FFC8' : burn ? '#FFE45C' : rage ? '#FFB4A8' : '#FFF2A8';
  ctx.save(); ctx.translate(0, (1 - k) * -80);   // 登场后从屏幕上方滑入
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; pgram(ctx, x + 5, y + 5, w, h, sk); ctx.fill();   // 硬投影
  ctx.save(); pgram(ctx, x, y, w, h, sk); ctx.clip();
  ctx.fillStyle = '#2B2118'; ctx.fillRect(x - 4, y - 4, w + 8, h + 8);                 // 底槽 + 排线底纹
  ctx.strokeStyle = 'rgba(244,233,211,0.1)'; ctx.lineWidth = 1.5; ctx.beginPath();
  for (let tx = x - h; tx < x + w + h; tx += 7) { ctx.moveTo(tx, y + h); ctx.lineTo(tx + h, y); }
  ctx.stroke();
  const fw = sk + (w - sk) * f, gw = sk + (w - sk) * gh;
  if (gh > f) { ctx.fillStyle = '#FFF6E5'; ctx.fillRect(x + fw - 1, y, gw - fw + 1, h); }   // 掉血残影
  if (fw > 0.5) {
    ctx.fillStyle = col; ctx.fillRect(x - 2, y, fw + 2, h);
    ctx.fillStyle = colL; ctx.fillRect(x - 2, y, fw + 2, 9);                                  // 顶部亮带
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(x - 2, y + 19, fw + 2, h - 19);             // 底部暗带
  }
  ctx.fillStyle = 'rgba(0,0,0,0.32)'; ctx.beginPath();                                         // 每 10% 一道细刻线
  for (let i = 1; i < 10; i++) { if (i === 5) continue; const tx = x + sk + (w - sk) * i / 10; ctx.moveTo(tx, y); ctx.lineTo(tx + 2, y); ctx.lineTo(tx + 2 - sk, y + h); ctx.lineTo(tx - sk, y + h); ctx.closePath(); }
  ctx.fill();
  const mx = x + sk + (w - sk) * 0.5;                                                          // 50%：狂暴分割线
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.moveTo(mx + sk - 2, y - 2); ctx.lineTo(mx + sk + 4, y - 2); ctx.lineTo(mx + 4, y + h + 2); ctx.lineTo(mx - 2, y + h + 2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = rage && Math.floor(uiT * 8) % 2 === 0 ? '#FF3B2E' : '#FFF6E5'; ctx.beginPath(); ctx.moveTo(mx + sk, y + 3); ctx.lineTo(mx + sk + 2, y + 3); ctx.lineTo(mx + 2, y + h - 3); ctx.lineTo(mx, y + h - 3); ctx.closePath(); ctx.fill();
  ctx.restore();
  pgram(ctx, x, y, w, h, sk); ctx.lineJoin = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.stroke();   // 3px 纯黑外描边
  if (e.slagTimer > 0) {   // 紫渣增幅：血条泛起亮紫色脉冲边框
    const pu = 0.5 + 0.5 * Math.sin(uiT * 9);
    ctx.lineWidth = 4 + 5 * pu; ctx.strokeStyle = 'rgba(196,77,255,' + (0.4 + 0.5 * pu).toFixed(3) + ')'; ctx.stroke();
    ctx.lineWidth = 1.6; ctx.strokeStyle = '#F3E0FF'; ctx.stroke();
  } else if (e.shockSlowTimer > 0 && Math.floor(uiT * 30) % 2 === 0) { ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(95,243,255,0.75)'; ctx.stroke(); }
  else if (burn) { ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,138,30,' + (0.35 + 0.3 * Math.sin(uiT * 14)).toFixed(3) + ')'; ctx.stroke(); }
  // 名称 / 血量 / 阶段
  txt(D.name + '  ' + D.name2, x + sk + 16, y + h / 2 + 1, 18, '#FFFFFF', 'left', 5, FONT_IMPACT);
  if (w > 760) txt(rage ? '狂暴 PHASE 2' : 'PHASE 1', x + w - 16, y + h / 2 + 1, 17, rage ? (Math.floor(uiT * 6) % 2 ? '#FF3B2E' : '#FFE23F') : '#FFE9B0', 'right', 5, FONT_IMPACT);
  if (w > 620) txt(fmtNum(Math.max(0, e.hp)) + ' / ' + fmtNum(e.hpMax), x + w - (w > 760 ? 168 : 16), y + h / 2 + 1, 15, '#FFFFFF', 'right', 4, FONT_IMPACT);
  // 元素状态贴纸
  let cx = x + sk + 4;
  const chip = (label, cc) => { ctx.font = '900 13px ' + FONT_UI; const tw = Math.ceil(ctx.measureText(label).width) + 18; pgram(ctx, cx, y + h + 7, tw, 20, 6); ctx.fillStyle = 'rgba(20,12,6,0.82)'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = cc; ctx.stroke(); txt(label, cx + tw / 2, y + h + 17.5, 13, cc, 'center', 3); cx += tw + 8; };

/* ============================================================
   设置面板：屏幕震动强度（0–100%，自动保存在浏览器本地）+ 音效开关
   入口：开始界面右上角的齿轮按钮、暂停菜单的「设置」按钮。面板打开期间世界冻结
   ============================================================ */
let shakeScale = 1;   // 整体震动倍率：所有镜头震动（含霰弹枪后坐）都乘以它，0 = 完全不震
try { const v = parseFloat(localStorage.getItem('wm-shake')); if (v >= 0 && v <= 1) shakeScale = Math.round(v * 10) / 10; } catch (err) {}
function setShake(v) {
  shakeScale = Math.round(clamp(v, 0, 1) * 10) / 10;   // 以 10% 为一档
  try { localStorage.setItem('wm-shake', String(shakeScale)); } catch (err) {}
}
let settings = false, setTest = 0, setHoverWas = false;   // settings：面板是否打开 · setTest：「试震一下」按钮的高亮计时
const SET_PRESETS = [[0, '关'], [0.3, '30%'], [0.6, '60%'], [1, '100%']];
const setRects = { back: null, test: null, sound: null, left: null, right: null, track: null, presets: [] };
function openSettings() { settings = true; setTest = 0; SFX.select(); }
function closeSettings() { settings = false; SFX.hover(); }
function gearRect() { return { x: W - 106, y: 18, w: 40, h: 40 }; }   // 开始界面右上角的齿轮按钮（静音按钮左边）
/* 指针是否落在滑轨上（band 为纵向容差：点击 24px，按住拖动时放宽到 44px） */
function onSlider(mx, my, band) {
  const tr = setRects.track;
  return !!tr && Math.abs(my - tr.cy) < band && mx > tr.x - 16 && mx < tr.x + tr.w + 16;
}
function updateSettings(dt) {
  if (setTest > 0) setTest -= dt;
  let hv = !!(setRects.back && ptInRect(mouse.x, mouse.y, setRects.back));
  for (const r of [setRects.test, setRects.sound, setRects.left, setRects.right]) if (r && ptInRect(mouse.x, mouse.y, r)) hv = true;
  for (const r of setRects.presets) if (ptInRect(mouse.x, mouse.y, r)) hv = true;
  if (onSlider(mouse.x, mouse.y, 24)) hv = true;
  if (hv && !setHoverWas) SFX.hover();
  setHoverWas = hv;
  if (mouse.down && onSlider(mouse.x, mouse.y, 44)) setShake((mouse.x - setRects.track.x) / setRects.track.w);   // 按住拖动滑块
}
function clickSettings(mx, my) {
  if (ptInRect(mx, my, setRects.back)) { closeSettings(); return; }
  if (ptInRect(mx, my, setRects.left)) { setShake(shakeScale - 0.1); SFX.select(); return; }
  if (ptInRect(mx, my, setRects.right)) { setShake(shakeScale + 0.1); SFX.select(); return; }
  for (let i = 0; i < SET_PRESETS.length; i++) if (ptInRect(mx, my, setRects.presets[i])) { setShake(SET_PRESETS[i][0]); SFX.select(); return; }
  if (onSlider(mx, my, 24)) { setShake((mx - setRects.track.x) / setRects.track.w); SFX.select(); return; }   // 点在滑轨上：按下即生效（极短的点击也不会漏掉），按住可以继续拖
  if (ptInRect(mx, my, setRects.sound)) { toggleMute(); return; }
  if (ptInRect(mx, my, setRects.test)) { addShake(12); setTest = 0.6; }   // 试震一下：相当于身边不远处炸了一下
}
function drawSettings() {
  const cw = 620, ch = 470, k = Math.min(1, (W - 24) / cw, (H - 24) / ch), ox = W / 2 - cw * k / 2, oy = H / 2 - ch * k / 2;
  const R = (cx, cy, w, h) => ({ x: ox + (cx - w / 2) * k, y: oy + (cy - h / 2) * k, w: w * k, h: h * k });   // 卡片坐标 → 屏幕矩形（点击检测用）
  const inR = r => ptInRect(mouse.x, mouse.y, r);
  ctx.fillStyle = 'rgba(20,12,6,0.72)'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(ox, oy); ctx.scale(k, k);
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; rr(ctx, 9, 11, cw, ch, 18); ctx.fill();                                  // 硬投影 + 纸面
  ctx.fillStyle = '#F4E9D3'; rr(ctx, 0, 0, cw, ch, 18); ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = '#000'; ctx.stroke();
  comicText('设 置', cw / 2, 56, 54, '#FFD23F', 11, 6);
  ctx.fillStyle = '#000'; ctx.fillRect(28, 92, cw - 56, 3);
  let any = false;
  const chip = (cx, cy, label, on, hv) => {   // 选项贴纸：选中 = 黄底黑字，悬停 = 亮黄描边
    ctx.fillStyle = on ? '#FFD23F' : '#E6D9BE'; rr(ctx, cx - 60, cy - 20, 120, 40, 8); ctx.fill();
    ctx.lineWidth = on ? 4 : 3; ctx.strokeStyle = hv && !on ? '#FFE23F' : '#000'; ctx.stroke();
    txt(label, cx, cy + 1, on ? 20 : 18, on ? '#000' : '#3A2E20', 'center', 0, FONT_IMPACT);
  };
  // ---- 屏幕震动强度 ----
  const pct = Math.round(shakeScale * 100);
  txt('屏幕震动强度', 36, 128, 24, '#000', 'left', 0);
  txt(pct + '%', cw - 36, 128, 34, pct === 0 ? '#7A5A2A' : '#B3261E', 'right', 0, FONT_IMPACT);
  setRects.presets.length = 0;
  for (let i = 0; i < SET_PRESETS.length; i++) {   // 预设：关 / 30% / 60% / 100%
    const r = R(36 + 60 + i * 142, 180, 120, 40), hv = inR(r); any = any || hv; setRects.presets.push(r);
    chip(96 + i * 142, 180, SET_PRESETS[i][1], Math.abs(SET_PRESETS[i][0] - shakeScale) < 1e-6, hv);
  }
  const tx = 116, tw = cw - 232, ty = 244, tr = R(tx, ty, tw, 40);   // 滑块：◀ [======o------] ▶
  tr.x = ox + tx * k; tr.w = tw * k; tr.cy = oy + ty * k; setRects.track = tr;   // 滑轨只记横向范围和中心线（拖动时按横坐标取值）
  setRects.left = R(58, ty, 44, 44); setRects.right = R(cw - 58, ty, 44, 44);
  rr(ctx, tx - 3, ty - 11, tw + 6, 22, 11); ctx.fillStyle = '#E6D9BE'; ctx.fill();
  if (pct > 0) { rr(ctx, tx - 3, ty - 11, tw * shakeScale + 6, 22, 11); ctx.fillStyle = '#E8452C'; ctx.fill(); }
  ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.stroke();
  for (const [cx, dir] of [[58, 1], [cw - 58, -1]]) {   // 左右微调按钮（到头时变淡）
    const hv = inR(dir > 0 ? setRects.left : setRects.right), off = dir > 0 ? pct <= 0 : pct >= 100; any = any || hv;
    ctx.globalAlpha = off ? 0.35 : 1;
    ctx.fillStyle = hv && !off ? '#FFE23F' : '#F4E9D3'; rr(ctx, cx - 22, ty - 22, 44, 44, 9); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 8 * dir, ty - 11); ctx.lineTo(cx + 8 * dir, ty + 11); ctx.lineTo(cx - 8 * dir, ty); ctx.closePath(); ctx.fillStyle = '#000'; ctx.fill();
    ctx.globalAlpha = 1;
  }
  const kx = tx + tw * shakeScale;   // 滑块把手
  circ(ctx, kx, ty, 17); ctx.fillStyle = '#FFD23F'; ctx.fill(); ctx.lineWidth = 3.5; ctx.strokeStyle = '#000'; ctx.stroke();
  circ(ctx, kx - 4, ty - 5, 4); ctx.fillStyle = '#FFF6E5'; ctx.fill();
  any = any || onSlider(mouse.x, mouse.y, 24);   // 悬停在滑轨上：光标高亮
  setRects.test = R(128, 306, 184, 40); {   // 「试震一下」：按当前强度震一下，马上能感觉出来合不合适
    const hv = inR(setRects.test), on = setTest > 0 || hv; any = any || hv;
    ctx.fillStyle = on ? '#FFD23F' : '#231A12'; rr(ctx, 36, 286, 184, 40, 9); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.stroke();
    txt('试震一下', 128, 307, 19, on ? '#000' : '#FFD23F', 'center', 0);
  }
  txt('远处更轻 · 0% 时也关掉爆炸慢动作 · 自动保存', 240, 306, 15, '#7A5A2A', 'left', 0);
  // ---- 音效 ----
  ctx.fillStyle = '#000'; ctx.fillRect(28, 344, cw - 56, 3);
  txt('音效', 36, 376, 24, '#000', 'left', 0);
  setRects.sound = R(cw - 96, 376, 120, 40); { const hv = inR(setRects.sound); any = any || hv; chip(cw - 96, 376, Snd.muted ? '关' : '开', !Snd.muted, hv); }
  txt('ESC / P / 空格 返回   ·   ← → 微调震动', 150, 376, 14, '#7A5A2A', 'left', 0);
  // ---- 返回 ----
  setRects.back = R(cw / 2, 434, 220, 44); {   // 硬投影 + 纸面
    const hv = inR(setRects.back); any = any || hv;
    ctx.fillStyle = hv ? '#FFF2A8' : '#FFD23F'; rr(ctx, cw / 2 - 110, 412, 220, 44, 10); ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.stroke();
    txt('返回', cw / 2, 435, 24, '#000', 'center', 0);
  }
  ctx.restore();
  if (any) uiHover = true;
}

   ============================================================ */
function drawCrosshair(x, y) {
  const p = player, wi = p.weapon, rl = p.rel[wi] > 0, hyp = UPS.hyperion.lvl > 0, hk = hyp ? clamp(p.hypT / hyperionTime(), 0, 1) : 0;
  const gap = 6 + (2 + clamp(p.spread, 0, 30) * 0.7) * (hyp ? 1 - hk : 1), len = 9, R = gap + len + 8;   // 霰弹枪扩散大 → 准星张得更开；亥伯龙连射时逐渐收紧
  const col = rl ? '#FFFFFF' : p.hypLock ? '#5FF3FF' : p.hasTarget ? '#FF4A36' : hyp ? mixCol('#FFFFFF', '#5FF3FF', hk) : '#FFE23F';   // 亥伯龙：由白渐变到青蓝，锁定后全青
  ctx.save(); ctx.translate(x, y); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.save();
  if (rl) ctx.rotate(uiT * 6);
  for (let i = 0; i < 4; i++) {   // 随射击 / 移动扩散的刻线
    const c = Math.cos(i * Math.PI / 2), s = Math.sin(i * Math.PI / 2);
    ctx.beginPath(); ctx.moveTo(c * gap, s * gap); ctx.lineTo(c * (gap + len), s * (gap + len));
    ctx.lineWidth = 5.5; ctx.strokeStyle = '#000'; ctx.stroke(); ctx.lineWidth = 2.6; ctx.strokeStyle = col; ctx.stroke();
  }
  ctx.restore();
  circ(ctx, 0, 0, 2.2); ctx.fillStyle = '#000'; ctx.fill(); circ(ctx, 0, 0, 1.1); ctx.fillStyle = col; ctx.fill();
  const frac = rl ? 1 - p.rel[wi] / gun.reload : (p.gunzT > 0 ? 1 : p.ammo[wi] / p.mmax[wi]);   // 外圈：当前武器的弹药量 / 装弹进度（双持狂暴期间不耗弹 → 常满）
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.85)'; circ(ctx, 0, 0, R); ctx.stroke();
  ctx.lineWidth = 2.8; ctx.strokeStyle = rl ? '#5FF3FF' : '#FFD23F';
  ctx.beginPath(); ctx.arc(0, 0, R, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(frac, 0, 1)); ctx.stroke();
  ctx.restore();
  if (rl) txt('装填中', x, y + R + 16, 13, '#5FF3FF', 'center', 4);
  else if (p.swapT > 0) txt('换枪中', x, y + R + 16, 13, '#F4E9D3', 'center', 4);
  else if (p.hypLock) txt('已锁定', x, y + R + 16, 13, '#5FF3FF', 'center', 4);
}

function drawCursor() {
  const x = mouse.x, y = mouse.y;
  if (state === ST.PLAY && player.alive) { drawCrosshair(x, y); return; }
  ctx.save(); ctx.translate(x, y); ctx.scale(1.6, 1.6);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 16.5); ctx.lineTo(4.6, 12.8); ctx.lineTo(7.5, 19.2); ctx.lineTo(10.6, 17.8); ctx.lineTo(7.7, 11.5); ctx.lineTo(13.2, 11.2); ctx.closePath();
  ctx.fillStyle = uiHover ? '#FFD23F' : '#FFFFFF'; ctx.fill(); ctx.lineJoin = 'round'; ctx.lineWidth = 1.7; ctx.strokeStyle = '#000'; ctx.stroke();
  ctx.restore();
}

/* 冲刺时从屏幕四周向中心的漫画速度线 */
function drawSpeedLines(k) {
  const a = clamp(k, 0, 1), R = hyp(W, H) / 2;
  ctx.lineCap = 'round';
  for (let i = 0; i < 30; i++) {
    const ang = i / 30 * TAU + Math.sin(i * 12.9898) * 0.2 + uiT * 0.25;
    const r1 = R * (0.42 + ((i * 37) % 11) / 11 * 0.3), r2 = r1 + R * (0.18 + ((i * 53) % 7) / 7 * 0.22);
    const c = Math.cos(ang), s = Math.sin(ang);
    ctx.globalAlpha = a * 0.9;
    ctx.beginPath(); ctx.moveTo(W / 2 + c * r1, H / 2 + s * r1); ctx.lineTo(W / 2 + c * r2, H / 2 + s * r2);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 7; ctx.stroke();
    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 3.5; ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawDebug() {
  const lines = [VERSION + ' (' + BUILD_DATE + ')   FPS ' + fps.toFixed(0) + '   render x' + DPR.toFixed(2), 'enemies ' + enemies.length + '  bullets ' + bullets.length + '  parts ' + parts.length,
    'drops ' + drops.length + '  draw ' + drawList.length + '  chunks ' + chunks.size, 'time ' + gameTime.toFixed(1) + '  state ' + state,
    'boss ' + (boss ? BOSS_DEFS[boss.kind].en + ' P' + boss.phase + ' ' + boss.st + ' ' + Math.round(boss.hp) + '/' + boss.hpMax : 'none') + '  eb ' + ebullets.length + '  warns ' + warns.length + '  next ' + Math.round(bossNextT - gameTime) + '  shake ' + cam.shake.toFixed(1) + 'x' + shakeScale.toFixed(1)];
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(10, 96, 440, 102);
  ctx.font = '13px monospace'; ctx.fillStyle = '#7CFC7C'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, 18, 112 + i * 18));
}

/* ============================================================
   主循环
   ============================================================ */
function updateWorld(dt) {
  gameTime += dt;
  collectSolids();
  if (player.alive) updatePlayer(dt);
  updateSpawns(dt);
  updateEnemies(dt);
  Grid.build(enemies);
  separate();
  // 敌人互相推挤后可能被同伴挤进掩体，再推出一次（不带滑动），保证任何一帧都没人陷在掩体里
  if (solidsNear.length) for (let i = 0; i < enemies.length; i++) { const e = enemies[i]; if (!e.dead && !e.boss && !e.drone) resolveSolids(e, false); }
  updateBullets(dt);
  updateDrops(dt);
  updateFuses(dt);
  updateThrows(dt);
  updateEBullets(dt); updateWarns(dt); updateZones(dt); updateRings(dt);   // Boss 弹幕 / 地面预警 / 残留危险区 / 冲击波环
  sweepEnemies();
  if (player.alive && player.xp >= player.xpNext) levelUp();
}

function update(dt) {
  uiT += dt;
  mouse.wx = cam.x + (mouse.x - W / 2) / ZOOM; mouse.wy = cam.y + (mouse.y - H / 2) / ZOOM;
  // 屏幕震动（位移 + 轻微旋转），线性衰减
  if (cam.shake > 0) {   // 震动幅度 × 设置里的整体震动强度（0 = 完全不震）
    cam.shake = Math.max(0, cam.shake - dt * 34); const k = cam.shake * shakeScale;
    cam.sx = rand(-k, k); cam.sy = rand(-k, k); cam.rot = rand(-k, k) * 0.0011;
  }
  else { cam.sx = cam.sy = cam.rot = 0; }
  const kc = Math.exp(-dt * 14); cam.kx *= kc; cam.ky *= kc;   // 霰弹枪后坐力的镜头后蹬回弹
  if (hurtFlash > 0) hurtFlash = Math.max(0, hurtFlash - dt * 2.4);
  if (whiteFlash > 0) whiteFlash = Math.max(0, whiteFlash - dt * 2.2);
  if (speedT > 0) speedT -= dt;

  if (settings) { updateSettings(dt); return; }   // 设置面板打开：世界冻结（震动照常衰减，「试震一下」可以预览）

  if (state === ST.START) {
    cam.x += 24 * dt; cam.y += 10 * dt;
    Music.energy = 0.3;
    updateFx(dt);
    // 角色预览跟着鼠标方向空枪试射，展示当前这把枪的枪口焰与后坐（不出声、不消耗任何东西）
    demoRecoil = Math.max(0, demoRecoil - dt * 9); if (demoMuzzle > 0) demoMuzzle -= dt;
    const dw = Math.floor(uiT / 2.4) % 3; if (dw !== demoW) { demoW = dw; demoT = 0.35; }
    demoT -= dt;
    if (demoT <= 0) { demoT = dw === 1 ? 1.1 : dw === 2 ? 0.26 : 0.42; demoRecoil = 1; demoMuzzle = MUZ_T[dw]; demoV = (Math.random() * 3) | 0; }
  } else if (state === ST.PLAY) {
    Music.energy = boss ? 1 : clamp(0.3 + gameTime / 420, 0.3, 1);   // Boss 战：音乐能量拉满
    if (hintT > 0) hintT -= dt;
    let sdt = dt;
    if (hitStop > 0) { hitStop -= dt; sdt = dt * (1 - 0.9 * shakeScale); }   // 顿帧：爆炸 / 爆头瞬间的时间拉伸。强度跟随设置里的震动强度——0% 时世界照常速度走，没有任何慢动作
    if (!player.alive) sdt = dt * 0.3;                     // 死亡慢镜头
    if (bossSlow > 0) { bossSlow = Math.max(0, bossSlow - dt); sdt = dt * 0.22; }   // 击杀 Boss：0.5 秒慢动作特写
    gun = weaponStats(player.weapon);
    if (bossIntro > 0) {   // Boss 定格出场：世界逻辑冻结 1.8 秒，镜头平滑移向登场位置
      bossIntro = Math.max(0, bossIntro - dt);
      if (boss) { const k = 1 - Math.exp(-dt * 7); cam.x += (lerp(player.x, boss.x, 0.7) - cam.x) * k; cam.y += (lerp(player.y, boss.y, 0.7) - cam.y) * k; }
    } else { if (boss) boss.age += sdt; updateWorld(sdt); }
    updateFx(sdt);
    if (!player.alive) { deathT -= dt; if (deathT <= 0) { state = ST.OVER; overT = 0; uiRects.over = null; Music.stop(); for (let i = words.length - 1; i >= 0; i--) if (words[i].screen) poolKill(words, wordPool, i); } }   // 进结算时清掉屏幕层的拟声词，不盖住战绩卡
  } else if (state === ST.LEVEL) {
    levelT += dt; Music.energy = 0.3;
    for (let i = 0; i < cards.length; i++) {
      const c = cards[i], on = !picking && levelT > 0.3 + i * 0.08 && ptInRect(mouse.x, mouse.y, c);
      c.hover = clamp(c.hover + (on ? 0.25 : -0.25), 0, 1);
      if (on && !c.wasHover) SFX.hover();
      c.wasHover = on;
    }
    const son = !vaultMode && !picking && levelT > 0.3 && ptInRect(mouse.x, mouse.y, uiRects.skip);
    skipHover = clamp(skipHover + (son ? 0.25 : -0.25), 0, 1);
    if (son && !skipWas) SFX.hover();
    skipWas = son;
    if (picking) { picking.t += dt; if (picking.t >= 0.24) resolvePick(); }
    updateFx(dt * 0.2);
  } else if (state === ST.OVER) {
    overT += dt; Music.energy = 0.3;
    updateFx(dt * 0.35);
  }
  // PAUSE：世界与特效全部冻结
}

/* 镜头变换：缩放 + 震动位移 + 震动旋转（世界层和叠在它上面的绘制共用） */
function camXf() { ctx.translate(W / 2, H / 2); ctx.rotate(cam.rot); ctx.scale(ZOOM, ZOOM); ctx.translate(-cam.x + cam.sx + cam.kx, -cam.y + cam.sy + cam.ky); }

/* 卷土重来用的全屏滤镜能力检测（只做一次）：优先 ctx.filter（灰度 + 增对比），不支持就退回"饱和度"混合模式 */
const FILTER_OK = (() => { try { const g = mkCanvas(2, 2).getContext('2d'); if (typeof g.filter !== 'string') return false; g.filter = 'blur(1px)'; return g.filter === 'blur(1px)'; } catch (err) { return false; } })();
const SAT_OK = (() => { try { const g = mkCanvas(2, 2).getContext('2d'); g.globalCompositeOperation = 'saturation'; return g.globalCompositeOperation === 'saturation'; } catch (err) { return false; } })();
let fxCv = null;
/* 把已经画好的世界层转成高对比黑白。k 为强度（0~1，用于进入 / 退出的过渡） */
function desaturateWorld(k) {
  const cw = canvas.width, ch = canvas.height;
  if (!fxCv || fxCv.width !== cw || fxCv.height !== ch) fxCv = mkCanvas(cw, ch);
  const fg = fxCv.getContext('2d');
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (FILTER_OK) {
    fg.drawImage(canvas, 0, 0);
    ctx.globalAlpha = k; ctx.filter = 'grayscale(1) contrast(1.7) brightness(1.08)'; ctx.drawImage(fxCv, 0, 0); ctx.filter = 'none';
  } else if (SAT_OK) {
    ctx.globalAlpha = k; ctx.globalCompositeOperation = 'saturation'; ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, cw, ch);   // 饱和度归零
    fg.drawImage(canvas, 0, 0);
    ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = k * 0.6; ctx.drawImage(fxCv, 0, 0);                              // 画面与自身"叠加"，拉高对比
  }
  ctx.restore();
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  uiHover = false;
  // ---- 世界层（镜头：缩放 + 震动位移 + 震动旋转）----
  ctx.save();
  camXf();
  const x0 = cam.x - vw - 90, y0 = cam.y - vh - 90, x1 = cam.x + vw + 90, y1 = cam.y + vh + 90;
  drawGround(x0, y0, x1, y1);
  drawDecals();
  drawWarns(); drawZones();   // 地面预警画在所有角色下面
  if (boss && bossIntro <= 0) drawBossTele(boss);
  drawGhosts();
  drawEnemyShadows(); drawBossShadows();
  drawBurnGlows();
  for (let i = 0; i < drawList.length; i++) {
    const o = drawList[i];
    if (o.dk === 1) drawPropCached(o); else if (o.dk === 2) drawEnemy(o); else if (o.dk === 3) drawPlayer(); else drawDrop(o);
  }
  drawEnemyOverlays();
  if (boss && bossIntro <= 0) drawBossLaser(boss);   // 激光十字压在角色上面
  drawRings();
  drawBooms(); drawBolts(); drawTracers(); drawZaps(); drawThrows(); drawBullets(); drawEBullets(); drawParts(); drawTexts(); drawWords(false);
  ctx.restore();
  // 卷土重来：世界转成高对比黑白，再给敌人叠一层红色剪影（只有敌人保留颜色）
  if (player.swT > 0 && state !== ST.START) {
    desaturateWorld(clamp(Math.min((SW_TIME - player.swT) / 0.25, player.swT / 0.4), 0, 1));
    ctx.save(); camXf();
    for (let i = 0; i < enemies.length; i++) { const e = enemies[i]; if (e.vis && !e.dead) drawEnemyRed(e); }
    ctx.restore();
  }
  // ---- 屏幕层 ----
  if (speedT > 0) drawSpeedLines(speedT / 0.22);
  if (player.gunzT > 0 && state !== ST.START) drawGunzBorder();   // 双持狂暴：燃烧的橙红网点边框
  ctx.drawImage(vignCv, 0, 0, W, H);
  const lowHp = player.alive && player.hp < player.hpMax * 0.3 && state !== ST.START;
  const redA = Math.max(hurtFlash * 0.55, lowHp ? 0.16 + Math.sin(uiT * 6) * 0.08 : 0);
  if (redA > 0.01) { ctx.globalAlpha = clamp(redA / 0.55, 0, 1); ctx.drawImage(vignRed, 0, 0, W, H); ctx.globalAlpha = 1; }
  if (whiteFlash > 0) { ctx.fillStyle = 'rgba(255,246,210,' + (whiteFlash * 0.6).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
  if (state === ST.START) drawStart();
  else {
    drawHUD(state === ST.PLAY || state === ST.PAUSE);   // 升级 / 结算界面顶部让位给标题
    drawBossPointer();
    if (boss && bossIntro > 0) drawBossSplash();   // Boss 定格出场：盖住 HUD，但压在暂停 / 升级界面下面
    if (state === ST.LEVEL) drawLevelUp(); else if (state === ST.PAUSE) drawPause(); else if (state === ST.OVER) drawOver();
  }
  if (settings) drawSettings();   // 设置面板：盖在开始 / 暂停界面上
  drawWords(true);
  if (debug) drawDebug();
  if (!(boss && bossIntro > 0)) drawCursor();   // 定格出场期间不画准星
}

let last = performance.now(), qAcc = 0, qN = 0, qBad = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const raw = (now - last) / 1000; last = now;
  let dt = raw > 0.25 ? 0.25 : raw; if (dt < 0) dt = 0;
  fpsAcc += dt; fpsN++;
  if (fpsAcc >= 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  // 动态分辨率：战斗中连续两个 1.5 秒窗口的平均帧率都低于 57，就降低一档内部渲染分辨率（最低到 0.5 倍），流畅优先
  if (state === ST.PLAY && gameTime > 4 && raw < 0.2 && !document.hidden) {
    qAcc += raw; qN++;
    if (qAcc >= 1.5) {
      if (qN / qAcc < 57) { if (++qBad >= 2 && resScale > 0.5) { resScale = Math.max(0.5, resScale - 0.2); resize(); qBad = 0; } }
      else qBad = 0;
      qAcc = 0; qN = 0;
    }
  } else { qAcc = 0; qN = 0; qBad = 0; }
  let step = dt > 0.05 ? 0.05 : dt;
  update(step);
  render();
}

/* 调试 / 自动化测试接口（不影响正常游玩） */
window.__wm = {
  version: VERSION + ' ' + BUILD_DATE,
  boss: () => boss,
  bossInfo: () => boss ? { kind: boss.kind, phase: boss.phase, st: boss.st, stT: +boss.stT.toFixed(3), hp: boss.hp, hpMax: boss.hpMax, x: boss.x, y: boss.y, nB: boss.nB, lA: boss.lA, lDir: boss.lDir, lSpd: boss.lSpd, rate: boss.rate, age: boss.age, cycle: boss.cycle, txA: boss.txA, el: boss.el, sx: boss.sx, sy: boss.sy } : null,
  bossState: () => ({ intro: bossIntro, slow: bossSlow, n: bossN, next: bossNextT, wave: nextWaveT, badass: nextBossT, vaultPending, vaultMode }),
  bossNow(kind) { if (boss) return null; bossNextT = gameTime; startBossFight(kind); return boss; }, // 立刻让指定序号的 Boss 登场
  skipIntro() { if (bossIntro > 0) bossIntro = 0.001; },
  bossSeq(n) { bossN = n; },
  nextBossAt(tt) { bossNextT = tt; },                                                                // 指定下一个 Boss 的登场时刻（测试用）；登场序号决定血量，见 bossSeq
  bossHurt(n) { if (boss) applyDamage(boss, n, { silent: true }); },
  clearLoot() { drops.length = 0; xpCount = 0; vaultPending = false; },                              // 清掉地面的掉落物并解除刷怪暂停（测试用）
  clearEnemies() { for (let i = enemies.length - 1; i >= 0; i--) if (!enemies[i].boss) enemies.splice(i, 1); fuses.length = 0; },// 清掉全部小兵和未爆的引信，只留 Boss（测试用）
  holdSpawns(on) { spawnHold = !!on; },                                                                         // 暂停 / 恢复常规刷怪（测试用：自然刷怪会干扰测量）
  clearShots() { ebullets.length = 0; },
  autoAim(n) { for (let i = 0; i < n && boss; i++) { mouse.x = W / 2 + (boss.x - cam.x) * ZOOM; mouse.y = H / 2 + (boss.y - cam.y) * ZOOM; update(1 / 60); } }, // 准星始终对准 Boss 推 n 帧（不渲染；只在 Boss 存在时才推帧）
  loot: () => drops.map(d => ({ type: d.type, v: d.v, tier: d.tier })),                              // 地面上的掉落物
  vaultCards: () => { openLevelUp(true); return cards.map(c => [c.key, (UPS[c.key] || EXTRA[c.key]).tier]); }, // 直接开一次宝箱强化并返回三张卡（统计用）
  pending: () => pendingLevels,
  ebullets: () => ebullets.map(b => ({ kind: b.kind, x: b.x, y: b.y, a: b.a, dmg: b.dmg, life: b.life })),
  warns: () => warns.map(w => ({ x: w.x, y: w.y, r: w.r, t: w.t, max: w.max, dmg: w.dmg })),
  zones: () => zones.map(z => ({ x: z.x, y: z.y, a: z.a, half: z.half, len: z.len, t: z.t, max: z.max, el: z.el })),
  rings: () => rings.map(r => ({ x: r.x, y: r.y, r: r.r, maxR: r.maxR, hit: r.hit })),
  drones: () => enemies.filter(e => e.drone && !e.dead).map(e => ({ x: e.x, y: e.y, arming: e.arming, hp: e.hp })),
  booms: () => booms.map(b => ({ x: Math.round(b.x), y: Math.round(b.y), r: Math.round(b.r) })),
  get state() { return state; }, get time() { return gameTime; }, get fps() { return fps; },
  cam: () => cam,                                                                                    // 镜头状态（震动幅度 / 位移 / 旋转 / 后坐；测试用）
  shake: v => { if (v === undefined) return shakeScale; setShake(v); return shakeScale; },           // 读 / 设置整体震动强度（0~1；测试用）
  settings: on => { if (on === undefined) return settings; if (on) openSettings(); else closeSettings(); return settings; }, // 打开 / 关闭设置面板
  ui: () => ({ gear: gearRect(), pause: uiRects.pset || null, resume: uiRects.resume || null, start: uiRects.start || null, panel: JSON.parse(JSON.stringify(setRects)), state, muted: Snd.muted, view: { w: W, h: H, vw, vh } }), // 设置相关控件的屏幕矩形
  player: () => player, enemies: () => enemies, stats: () => stats,
  counts: () => ({ enemies: enemies.length, bullets: bullets.length, parts: parts.length, drops: drops.length, decals: decals.length }),
  start: startGame,
  xp(n) { player.xp += n; },
  setTime(t) { gameTime = t; },
  spawn(n, type, elite, dist) { for (let i = 0; i < n; i++) { const a = rand(TAU), d = dist || rand(380, 700); spawnEnemy(type || 0, player.x + Math.cos(a) * d, player.y + Math.sin(a) * d, !!elite); } },
  hurt(n) { hurtPlayer(n, player.x + 40, player.y, true); },
  pick: chooseCard,
  wipe() { bullets.length = 0; },                                                                    // 清掉飞行中的子弹（测试用）
  up(key) { applyUpgrade(key); },                                                                    // 直接获得一级词条（测试用）
  weapon(i) { if (i === undefined) return player.weapon; switchWeapon(i); },                         // 不传参数返回当前武器序号；传 0/1/2 切换
  gun: () => gun,                                                                                    // 当前武器的实际数值
  hit(i, base, opts) { return applyDamage(enemies[i], base, opts || {}); },                          // 对第 i 个敌人走一次统一伤害结算，返回实际伤害
  ups: () => { const o = {}; for (const k in UPS) o[k] = [UPS[k].lvl, +UPS[k].val.toFixed(3), UPS[k].tier, UPS[k].tag || '']; return o; }, // 全部词条的 [等级, 数值, 分级, 角标]
  dmgBy: () => JSON.parse(JSON.stringify(stats.dmgBy)),                                              // 按来源统计的伤害
  cards: () => cards.map(c => c.key),
  fx: () => ({ tracers: tracers.length, throws: throws.length, bolts: bolts.length, booms: booms.length, words: words.map(w => w.str) }),
  solids: () => solidsNear.map(p => ({ type: p.type, x: p.x, y: p.y, cr: p.cr, hw: p.hw, hh: p.hh, rot: p.rot, hard: !!p.hard })), // 玩家附近的固体障碍（掩体测试用）
  tick(n, dt) { for (let i = 0; i < n; i++) update(dt || 1 / 60); render(); }                        // 手动推帧（不依赖 requestAnimationFrame）
};

/* 预热：首次使用某种字体 / 描边样式时浏览器要加载字形，可能造成一帧卡顿；在首帧之前先画一遍（不可见） */
function warmup() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.font = 'italic 900 17px ' + FONT_IMPACT; ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.fillStyle = '#fff';
  ctx.strokeText('0123456789', 60, 40); ctx.fillText('0123456789', 60, 40);
  comicText('BOOM! CRIT! FWOOSH! ZAP! 12 升级！第 波 已暂停 敌 来袭', W / 2, H / 2, 42, '#FFD23F', 8, 5);
  txt('护盾 100 / 100 冲刺就绪 装填中 换枪中 火焰 40% 电击 30% 0123456789', W / 2, H / 2 + 60, 16, '#fff', 'center', 4);
  txt('00:00 LV 12', W / 2, H / 2 + 90, 24, '#fff', 'center', 4, FONT_IMPACT);
  spaced('WASTELAND MAYHEM', W / 2, H / 2 + 130, 24, '#fff', 6);
  comicText('PING! BOOM! KABOOM! GUNZERK! HISSS! NOVA! SECOND WIND! 殊死一搏！已锁定', W / 2, H / 2 + 20, 30, '#FFD23F', 6, 4);
  comicText('BOSS DEFEATED! LOOT! ENRAGED! CRUNCH! SLAM! DEPLOY! DIZZY! 狂暴化！元素过载！秘藏宝箱！', W / 2, H / 2 + 50, 30, '#FFD23F', 6, 4);
  txt('轰炸狂人布姆·博姆亥伯龙实验体W4R-D3N构造体血翼变异体元素领主他把你的头盖骨当成了烟灰缸！50% 进入狂暴 紫渣 ×2.0 BOSS 00:00', W / 2, H / 2 + 80, 20, '#fff', 'center', 4);
  for (const id of ['shotgun', 'firerate', 'pierce', 'fire', 'shock', 'damage', 'speed', 'magnet', 'crit', 'shield', 'maxhp', 'dashcd', 'heal', 'nuke', 'frenzy', 'vault', 'skull',
    'jakobs', 'torgue', 'hyperion', 'tediore', 'gunzerker', 'corrosive', 'slag', 'nova', 'secondwind', 'bloodlust']) drawIcon(id, W / 2, H / 2 + 180, 12, '#FFD23F');
}

resize();
Snd.unlock();   // 页面加载时就创建音频设备（约几十毫秒）；浏览器会先挂起，等玩家第一次按键/点击时再恢复，避免开局首帧卡顿
buildGround();
buildGroundTile();
buildStaticSprites();
buildEnemySprites();
buildFlashSprites();
warmup();
mouse.x = W / 2; mouse.y = H * 0.45;
requestAnimationFrame(frame);

})();
</script>
