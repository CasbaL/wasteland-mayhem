(() => {
'use strict';

/* ============================================================
   基础工具
   ============================================================ */
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const hyp = Math.hypot;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const wrapA = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
function lerpAng(a, b, t) { return a + wrapA(b - a) * clamp(t, 0, 1); }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return (h ^ h >>> 16) >>> 0; }
function fmtTime(s) { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function fmtNum(n) { return Math.round(n).toLocaleString('en-US'); }
function rr(g, x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function circ(g, x, y, r) { g.beginPath(); g.arc(x, y, Math.max(0, r), 0, TAU); }
function polyPath(g, pts, x = 0, y = 0) { g.beginPath(); g.moveTo(pts[0][0] + x, pts[0][1] + y); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0] + x, pts[i][1] + y); g.closePath(); }
function blobPts(rng, n, r, jit) { const p = []; for (let i = 0; i < n; i++) { const a = i / n * TAU, v = r * (1 + (rng() * 2 - 1) * jit); p.push([Math.cos(a) * v, Math.sin(a) * v]); } return p; }
function starPts(n, jit) { const p = []; for (let i = 0; i < n * 2; i++) { const a = i / (n * 2) * TAU, v = i % 2 ? 1 - jit * rand(0.5, 1.4) : 1; p.push([Math.cos(a) * v, Math.sin(a) * v]); } return p; }
function ptInRect(x, y, r) { return !!r && x >= r.x && y >= r.y && x <= r.x + r.w && y <= r.y + r.h; }
function poolKill(arr, free, i) { const o = arr[i]; arr[i] = arr[arr.length - 1]; arr.pop(); if (free) free.push(o); }

const FONT_IMPACT = 'Impact,"Arial Black","Helvetica Neue",Arial,sans-serif';
const FONT_UI = '"PingFang SC","Microsoft YaHei","Noto Sans SC","Heiti SC",sans-serif';

/* 版本号：每次改动上线前手动更新（VERSION 末位递增，BUILD_DATE 填当天），三处要一致——这里、<title>、以及提交说明。
   显示在浏览器标签页标题、开始界面右下角、暂停 / 结算界面和调试信息里，用来确认线上是不是最新版。
   v1.0.0 初版 · v1.1.0 三武器与元素 · v1.2.0 渲染层（手臂 / 枪口焰 / 掩体 / 斜切进度条）· v1.3.0 12 个词条与统一伤害结算 · v1.3.1 版本号显示 · v1.4.0 关底 Boss 战（每 3 分钟登场）· v1.4.1 自爆怪爆炸只伤到范围内的玩家 · v1.4.2 震屏按距离衰减，设置里可调震动强度 · v1.4.3 顿帧强度跟随震动设置，小爆炸不再顿帧 */
const VERSION = 'v1.4.3', BUILD_DATE = '2026-11-26';
document.title = '废土疯潮 ' + VERSION + ' · WASTELAND MAYHEM';

/* ============================================================
   画布
   ============================================================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 1, H = 1, DPR = 1, ZOOM = 1, vw = 1, vh = 1, resScale = 1;   // resScale：动态分辨率系数（帧率不足时自动下调）
const PIXEL_BUDGET = 3.4e6;   // 内部渲染像素预算：高分屏上超过这个量，全屏填充类绘制就开始吃不掉 16.7ms 的帧预算
function resize() {
  const devDpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(320, window.innerWidth); H = Math.max(240, window.innerHeight);
  // 优先用设备像素比，但不让内部渲染总像素超过预算（最低保持 1 倍），再乘以动态分辨率系数
  DPR = Math.max(1, Math.min(devDpr, Math.sqrt(PIXEL_BUDGET / (W * H)))) * resScale;
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  ZOOM = clamp(Math.min(W / 1120, H / 700), 1, 1.6);
  vw = W / ZOOM / 2; vh = H / ZOOM / 2;
  uiRects.mute = { x: W - 58, y: 18, w: 40, h: 40 };
  if (groundPattern) buildGroundTile();
  buildVignettes();
}

/* ============================================================
   音频（Web Audio 实时合成，无外部文件）
   ============================================================ */
const Snd = {
  ctx: null, master: null, sfx: null, music: null, noiseBuf: null, muted: false, gateT: {},
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        const ac = this.ctx = new AC();
        this.master = ac.createGain(); this.master.gain.value = this.muted ? 0 : 1; this.master.connect(ac.destination);
        this.sfx = ac.createGain(); this.sfx.gain.value = 0.5; this.sfx.connect(this.master);
        this.music = ac.createGain(); this.music.gain.value = 0; this.music.connect(this.master);
        const len = ac.sampleRate | 0, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        this.noiseBuf = buf;
      } catch (e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  },
  setMute(m) { this.muted = m; if (this.ctx) this.master.gain.setTargetAtTime(m ? 0 : 1, this.ctx.currentTime, 0.02); },
  gate(name, ms) { const now = performance.now(), last = this.gateT[name] || 0; if (now - last < ms) return false; this.gateT[name] = now; return true; },
  tone(o) {
    const ac = this.ctx; if (!ac) return;
    const t0 = ac.currentTime + Math.max(0, o.delay || 0);
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(Math.max(1, o.f0), t0);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t0 + o.dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(o.vol, t0 + (o.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
    let node = osc;
    if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q || 1; osc.connect(f); node = f; }
    node.connect(g); g.connect(o.dest || this.sfx);
    osc.start(t0); osc.stop(t0 + o.dur + 0.05);
  },
  noise(o) {
    const ac = this.ctx; if (!ac || !this.noiseBuf) return;
    const t0 = ac.currentTime + Math.max(0, o.delay || 0);
    const src = ac.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = ac.createBiquadFilter(); f.type = o.type || 'lowpass'; f.Q.value = o.q || 0.7;
    f.frequency.setValueAtTime(Math.max(20, o.f0), t0);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t0 + o.dur);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(o.vol, t0 + (o.attack || 0.003)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
    src.connect(f); f.connect(g); g.connect(o.dest || this.sfx);
    src.start(t0, Math.random() * 0.5); src.stop(t0 + o.dur + 0.05);
  }
};

const SFX = {
  ok() { return !!Snd.ctx; },
  /* 枪声按武器区分：0 突击步枪（清脆点射）1 双管霰弹枪（低沉轰鸣）2 元素冲锋枪（高频电流啪声） */

    const p = rand(0.9, 1.1);
    if (w === 1) { Snd.noise({ dur: 0.24, vol: 0.5, type: 'lowpass', f0: 3200, f1: 180 }); Snd.tone({ type: 'sine', f0: 150, f1: 40, dur: 0.22, vol: 0.5 }); Snd.tone({ type: 'square', f0: 210, f1: 70, dur: 0.08, vol: 0.16 }); }
    else if (w === 2) { Snd.noise({ dur: 0.04, vol: 0.12, type: 'highpass', f0: 2600 * p }); Snd.tone({ type: 'square', f0: 880 * p, f1: 330, dur: 0.05, vol: 0.08 }); Snd.tone({ type: 'sine', f0: 1900 * p, f1: 1300, dur: 0.05, vol: 0.05 }); }
    else { Snd.noise({ dur: 0.06, vol: 0.2, type: 'highpass', f0: 1500 * p }); Snd.tone({ type: 'square', f0: 520 * p, f1: 150, dur: 0.07, vol: 0.12 }); Snd.tone({ type: 'sine', f0: 150, f1: 60, dur: 0.06, vol: 0.2 }); }
  },

  },
  /* 点燃：一团火苗窜起的"呼"声 */
  ignite() { if (!this.ok() || !Snd.gate('ignite', 140)) return; Snd.noise({ dur: 0.28, vol: 0.16, type: 'bandpass', f0: 500, f1: 2600, q: 0.8 }); },

  select() { if (!this.ok()) return; Snd.tone({ type: 'square', f0: 880, dur: 0.08, vol: 0.12 }); Snd.tone({ type: 'sine', f0: 1320, dur: 0.14, vol: 0.12, delay: 0.05 }); },
  loot() { if (!this.ok()) return; [392, 523, 659, 784, 1046, 1318].forEach((f, i) => Snd.tone({ type: 'triangle', f0: f, dur: 0.14, vol: 0.15, delay: i * 0.07 })); },
  wave() { if (!this.ok()) return; Snd.tone({ type: 'sawtooth', f0: 110, f1: 220, dur: 0.5, vol: 0.16, lp: 900 }); Snd.tone({ type: 'sawtooth', f0: 110, f1: 220, dur: 0.5, vol: 0.16, lp: 900, delay: 0.25 }); },
  /* 第三轮新增的音效：弹射 / 火箭 / 锁定 / 掷枪 / 双持 / 腐蚀 / 新星 / 倒地 / 复活 / 紫渣 */
  ping() { if (!this.ok() || !Snd.gate('ping', 70)) return; Snd.tone({ type: 'sine', f0: 2600, f1: 3400, dur: 0.09, vol: 0.12 }); Snd.tone({ type: 'triangle', f0: 5200, f1: 4600, dur: 0.05, vol: 0.05 }); },

  blast() { if (!this.ok() || !Snd.gate('blast', 70)) return; Snd.noise({ dur: 0.14, vol: 0.24, type: 'lowpass', f0: 2000, f1: 160 }); Snd.tone({ type: 'sine', f0: 96, f1: 40, dur: 0.14, vol: 0.26 }); },

/* 程序化背景音乐：16 步循环 + 前瞻调度 */
const Music = {
  on: false, step: 0, nextT: 0, timer: 0, bpm: 138, energy: 0.3,
  BASS: [82.41, 82.41, 0, 82.41, 98.00, 0, 82.41, 0, 110.00, 110.00, 0, 110.00, 98.00, 0, 146.83, 123.47],
  LEAD: [329.63, 392.00, 440.00, 493.88, 587.33, 493.88, 440.00, 392.00, 329.63, 0, 440.00, 0, 493.88, 0, 587.33, 659.25],
  start() {
    if (!Snd.ctx) return;
    this.on = true; this.step = 0; this.nextT = Snd.ctx.currentTime + 0.08;
    Snd.music.gain.setTargetAtTime(0.42, Snd.ctx.currentTime, 0.4);
    if (!this.timer) this.timer = setInterval(() => this.tick(), 30);
  },
  stop() { this.on = false; if (Snd.ctx) Snd.music.gain.setTargetAtTime(0, Snd.ctx.currentTime, 0.25); },
  tick() {
    const ac = Snd.ctx; if (!ac || !this.on || ac.state !== 'running') return;
    const spb = 60 / this.bpm / 2;
    if (this.nextT < ac.currentTime - 0.2) this.nextT = ac.currentTime + 0.05;
    while (this.nextT < ac.currentTime + 0.16) { this.note(this.step % 16, this.nextT - ac.currentTime, (this.step >> 4) % 4); this.step++; this.nextT += spb; }
  },
  note(s, d, bar) {
    const M = Snd.music, e = this.energy;
    if (s % 4 === 0) Snd.tone({ type: 'sine', f0: 160, f1: 44, dur: 0.2, vol: 0.8, attack: 0.002, delay: d, dest: M });
    if (s === 14 && bar % 2 === 1) Snd.tone({ type: 'sine', f0: 130, f1: 50, dur: 0.14, vol: 0.5, delay: d, dest: M });
    if (s === 4 || s === 12) { Snd.noise({ dur: 0.13, vol: 0.26, type: 'bandpass', f0: 1900, q: 0.8, delay: d, dest: M }); Snd.tone({ type: 'triangle', f0: 210, f1: 150, dur: 0.09, vol: 0.2, delay: d, dest: M }); }
    if (s % 2 === 1) Snd.noise({ dur: 0.03, vol: 0.08 + 0.05 * e, type: 'highpass', f0: 8000, delay: d, dest: M });
    else if (e > 0.55) Snd.noise({ dur: 0.02, vol: 0.04, type: 'highpass', f0: 9000, delay: d, dest: M });
    const b = this.BASS[s]; if (b) Snd.tone({ type: 'square', f0: b, dur: 0.16, vol: 0.26, lp: 320 + 500 * e, q: 4, delay: d, dest: M });
    if (bar >= 2) { const l = this.LEAD[s]; if (l) Snd.tone({ type: 'sawtooth', f0: l, dur: 0.13, vol: 0.06, lp: 2600, delay: d, dest: M }); }
  }
};

canvas.addEventListener('wheel', e => {
  if (state !== ST.PLAY || e.ctrlKey || !player.alive) return;
  e.preventDefault();
  switchWeapon(player.weapon + (e.deltaY > 0 ? 1 : -1));
}, { passive: false });
window.addEventListener('resize', resize);
window.addEventListener('blur', () => { keys.clear(); mouse.down = false; if (state === ST.PLAY) setPause(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { keys.clear(); mouse.down = false; if (state === ST.PLAY) setPause(true); } });

function inputDir() {
  let x = 0, y = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) y -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) y += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) x -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) x += 1;
  if (x && y) { const k = 0.70710678; x *= k; y *= k; }
  return [x, y];
}

      if (dx > rr2 || dx < -rr2 || dy > rr2 || dy < -rr2) continue;
      const d2 = dx * dx + dy * dy; if (d2 >= rr2 * rr2) continue;
      let d = Math.sqrt(d2); if (d < 0.01) { dx = 1; dy = 0; d = 1; } else { dx /= d; dy /= d; }
      push = rr2 - d;
    }
    o.x += dx * push; o.y += dy * push;
    if (slide) { const tg = o.t > Math.PI ? 0.9 : -0.9; o.x += -dy * tg; o.y += dx * tg; }
  }
}

/* 点（带半径 r）是否落在硬掩体（岩石 / 集装箱）上：圆按距离算，集装箱换到局部坐标后按矩形算 */
function hitSolid(q, x, y, r) {
  if (q.type !== 'box') return hyp(x - q.x, y - q.y) < q.cr + r;
  const rx = x - q.x, ry = y - q.y;
  return Math.abs(rx * q.c + ry * q.s) < q.hw + r && Math.abs(-rx * q.s + ry * q.c) < q.hh + r;
}
/* 线段 (x0,y0)→(x1,y1) 是否穿过以 (cx,cy) 为圆心、半径 r 的圆 */
function segCircle(x0, y0, x1, y1, cx, cy, r) {
  const dx = x1 - x0, dy = y1 - y0, t = clamp(((cx - x0) * dx + (cy - y0) * dy) / (dx * dx + dy * dy || 1), 0, 1);
  return hyp(cx - (x0 + dx * t), cy - (y0 + dy * t)) < r;
}
/* 线段 (x0,y0)→(x0+dx,y0+dy) 是否穿过以原点为中心、半边长 hx / hy 的轴对齐矩形（平板法） */
function segBox(x0, y0, dx, dy, hx, hy) {
  let t0 = 0, t1 = 1;
  if (Math.abs(dx) < 1e-6) { if (x0 < -hx || x0 > hx) return false; }
  else { let a = (-hx - x0) / dx, b = (hx - x0) / dx; if (a > b) { const c = a; a = b; b = c; } if (a > t0) t0 = a; if (b < t1) t1 = b; if (t0 > t1) return false; }
  if (Math.abs(dy) < 1e-6) { if (y0 < -hy || y0 > hy) return false; return true; }
  let a = (-hy - y0) / dy, b = (hy - y0) / dy; if (a > b) { const c = a; a = b; b = c; }
  return Math.max(t0, a) <= Math.min(t1, b);
}
/* 玩家到 (x, y) 的视线是否被硬掩体挡住：自动瞄准据此跳过躲在掩体后面的敌人，不朝墙开枪 */
function losBlocked(x, y) {
  const px = player.x, py = player.y, mx = (px + x) / 2, my = (py + y) / 2, hl = hyp(x - px, y - py) / 2 + 100;
  for (let i = 0; i < solidsNear.length; i++) {
    const q = solidsNear[i]; if (!q.hard) continue;
    if (Math.abs(q.x - mx) > hl || Math.abs(q.y - my) > hl) continue;
    if (q.type !== 'box') { if (segCircle(px, py, x, y, q.x, q.y, q.cr + 4)) return true; continue; }
    const ox = px - q.x, oy = py - q.y, dx = x - px, dy = y - py;   // 线段两端换到箱体局部坐标
    if (segBox(ox * q.c + oy * q.s, -ox * q.s + oy * q.c, dx * q.c + dy * q.s, -dx * q.s + dy * q.c, q.hw + 4, q.hh + 4)) return true;
  }
  return false;
}

/* 绕开集装箱（沿墙走）：敌人贴近某口箱子、且"敌人 → 玩家"的直线穿过这口箱子时，改为贴着箱面走，直到直线不再穿过箱子为止。
   方向：刚被挡住时选"从靠玩家那一侧绕过去"（e.side，之后保持不变，避免在箱子正后方左右来回抖动）；
   还在箱子长度范围内就沿长边走到端头，越过端头后顺着端面往前走——这样长边 → 端头 → 长边 能连续拐过直角 */
const STEER = [0, 0];
function steerBox(e) {
  STEER[0] = 0; STEER[1] = 0;
  const px = player.x - e.x, py = player.y - e.y, m = e.r + 28;
  for (let i = 0; i < solidsNear.length; i++) {
    const b = solidsNear[i]; if (b.type !== 'box') continue;
    const rx = e.x - b.x, ry = e.y - b.y, u = rx * b.c + ry * b.s, v = -rx * b.s + ry * b.c;   // 敌人在箱体局部坐标里的位置
    if (Math.abs(u) > b.hw + m || Math.abs(v) > b.hh + m) continue;                            // 离这口箱子还远
    const ex = b.hw + e.r + 2, ey = b.hh + e.r + 2, pu = px * b.c + py * b.s, pv = -px * b.s + py * b.c;   // 敌人 → 玩家（局部坐标）
    if (!segBox(u, v, pu, pv, ex, ey)) continue;                                               // 直线就能走到玩家：不用绕
    if (!e.blk) e.side = u * pv - v * pu > 0 ? 1 : -1;
    e.blk = true;
    let ax = 0, ay = 0;
    if (Math.abs(u) >= b.hw + e.r + 1) ay = (u >= 0 ? 1 : -1) * e.side;                        // 已越过端头：顺着端面走
    else ax = (v >= 0 ? -1 : 1) * e.side;                                                       // 还在长度范围内：沿长边走到端头
    STEER[0] = ax * b.c - ay * b.s; STEER[1] = ax * b.s + ay * b.c;
    return 1;
  }
  e.blk = false;
  return 0;
}

/* 子弹打在掩体上：金属集装箱迸火星，岩石扬起一团沙尘 */
function coverHit(q, b) {
  const metal = q.type === 'box', sp = hyp(b.vx, b.vy) || 1, nx = -b.vx / sp, ny = -b.vy / sp, n = metal ? 3 : 2;
  for (let i = 0; i < n; i++) addPart(metal ? 'spark' : 'smoke', b.x, b.y, nx * rand(60, 200) - ny * rand(-120, 120), ny * rand(60, 200) + nx * rand(-120, 120),
    metal ? rand(0.1, 0.2) : rand(0.25, 0.4), metal ? rand(1.6, 2.4) : rand(3, 5), metal ? (Math.random() < 0.5 ? '#FFF6A0' : '#FFD23F') : '#D9B377');
}

/* ============================================================
   特效数据：震屏 / 粒子 / 跳字 / 拟声词 / 弹坑 / 闪电
   ============================================================ */
/* ---- 震屏 ----
   addShake(a)：cam.shake 是震动幅度（像素）。单次震动 = 自身强度；还在震时又来一次只小幅叠加，不再一路叠到上限
   addShakeAt(x, y, a)：带位置的震动源（爆炸 / 砸地 / 撞掩体 / 击杀），离玩家越远越弱 */
const SHAKE_MAX = 26;
function addShake(a) {
  const s = cam.shake;
  cam.shake = Math.min(SHAKE_MAX, Math.max(s, a) + (s > 0.5 ? a * 0.3 : 0));
}
/* 距离衰减：240px 内全强度，之外按平方衰减，约两倍视距外完全感觉不到（v1.4.2 之前爆炸无视距离，在地图任何角落都是满强度） */
function shakeFalloff(x, y) {
  const d = hyp(x - player.x, y - player.y), far = Math.max(vw, vh) * 2.2, t = clamp(1 - (d - 240) / (far - 240), 0, 1);
  return t * t;
}
function addShakeAt(x, y, a) { const f = shakeFalloff(x, y); if (f > 0.01) addShake(a * f); return f; }

function addPart(type, x, y, vx, vy, life, size, col, rot) {
  if (parts.length >= MAX_P) return null;
  const o = partPool.pop() || {};
  o.type = type; o.x = x; o.y = y; o.vx = vx; o.vy = vy; o.life = o.max = life; o.size = size; o.col = col; o.rot = rot || 0; o.rs = rand(-8, 8); o.z = 0; o.vz = 0;
  parts.push(o);
  return o;
}
/* 火苗粒子：o.z 记录火苗位图的变体序号（0~2） */
function addFlame(x, y, vx, vy, life, size) {
  const o = addPart('flame', x, y, vx, vy, life, size, '#FF8A1E');
  if (o) o.z = (Math.random() * 3) | 0;
  return o;
}
/* kind: 0 普通伤害(白)  1 暴击(大号黄)  2 持续伤害(小号橙)  3 紫渣易伤中的伤害(大号紫) */
function addText(x, y, val, kind, col, prefix) {
  let t;
  if (texts.length >= 60) t = texts.shift(); else t = textPool.pop() || {};
  t.x = x + rand(-8, 8); t.y = y; t.life = t.max = kind === 1 ? 0.85 : kind === 3 ? 0.75 : 0.55;
  t.str = (prefix || '') + (kind === 2 ? val.toFixed(1) : String(Math.round(val)));
  t.crit = kind === 1; t.small = kind === 2; t.slag = kind === 3; t.col = col || '#FFFFFF'; t.rot = rand(-0.2, 0.2);
  texts.push(t);
}
/* 美漫拟声词；key + cool 用于限流，避免刷屏 */
function addWord(str, x, y, col, size, key, cool, screen) {
  if (key) { const now = performance.now(); if (now - (wordCool[key] || 0) < cool) return; wordCool[key] = now; }
  if (words.length >= 14) wordPool.push(words.shift());
  const w = wordPool.pop() || {};
  w.str = str; w.x = x; w.y = y; w.col = col; w.size = size; w.rot = rand(-0.26, 0.26); w.life = w.max = screen ? 1.2 : 0.75; w.screen = !!screen;
  words.push(w);
}
/* 弹坑：血渍（4 种变体，s 为缩放）/ 焦痕 */
function addDecal(type, x, y, r) {
  if (decals.length >= 70) decals.shift();
  decals.push({ type, x, y, v: Math.floor(Math.random() * 4), s: (type === 'splat' ? clamp(r / 22, 0.4, 1.5) : clamp(r / 60, 1, 2.2)) * rand(0.85, 1.15), life: 10, max: 10 });
}
/* 在一系列点之间生成锯齿闪电 */
function addBolt(list) {
  const seg = [];
  for (let i = 1; i < list.length; i++) {
    const x1 = list[i - 1][0], y1 = list[i - 1][1], x2 = list[i][0], y2 = list[i][1];
    const dx = x2 - x1, dy = y2 - y1, l = hyp(dx, dy) || 1, nx = -dy / l, ny = dx / l, n = 5;
    let px = x1, py = y1;
    for (let k = 1; k <= n; k++) {
      const t = k / n, off = k === n ? 0 : rand(-13, 13);
      const qx = x1 + dx * t + nx * off, qy = y1 + dy * t + ny * off;
      seg.push(px, py, qx, qy); px = qx; py = qy;
    }
  }
  bolts.push({ seg, life: 0.22, max: 0.22 });
}
function toast(text, col) { toasts.push({ text, col, life: 2.6, max: 2.6 }); if (toasts.length > 4) toasts.shift(); }
function announce(title, sub, col) { banner = { title, sub, col, life: 3, max: 3 }; }

function updateFx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const o = parts[i]; o.life -= dt;
    if (o.life <= 0) { poolKill(parts, partPool, i); continue; }
    if (o.type === 'smoke') { o.x += o.vx * dt; o.y += o.vy * dt; const f = Math.exp(-dt * 3); o.vx *= f; o.vy *= f; o.vy -= 18 * dt; }
    else if (o.type === 'shell') { if (o.vz !== 0 || o.z > 0) { o.z += o.vz * dt; o.vz -= 900 * dt; o.x += o.vx * dt; o.y += o.vy * dt; o.rot += o.rs * dt; if (o.z <= 0) { o.z = 0; o.vx = o.vy = o.vz = 0; o.rs = 0; } } }
    else { o.x += o.vx * dt; o.y += o.vy * dt; const f = Math.exp(-dt * (o.type === 'chunk' ? 3.5 : 5)); o.vx *= f; o.vy *= f; o.rot += o.rs * dt; }
  }
  for (let i = texts.length - 1; i >= 0; i--) { const t = texts[i]; t.life -= dt; t.y -= 62 * dt; if (t.life <= 0) poolKill(texts, textPool, i); }
  for (let i = words.length - 1; i >= 0; i--) { const w = words[i]; w.life -= dt; if (w.life <= 0) poolKill(words, wordPool, i); }
  for (let i = ghosts.length - 1; i >= 0; i--) { const g = ghosts[i]; g.life -= dt; if (g.life <= 0) ghosts.splice(i, 1); }
  for (let i = booms.length - 1; i >= 0; i--) { const b = booms[i]; b.t += dt; if (b.t >= b.max) booms.splice(i, 1); }
  for (let i = bolts.length - 1; i >= 0; i--) { const b = bolts[i]; b.life -= dt; if (b.life <= 0) bolts.splice(i, 1); }
  for (let i = tracers.length - 1; i >= 0; i--) { const t = tracers[i]; t.life -= dt; if (t.life <= 0) tracers.splice(i, 1); }
  for (let i = zaps.length - 1; i >= 0; i--) { const z = zaps[i]; z.t += dt; if (z.t >= z.max) zaps.splice(i, 1); }
  for (let i = decals.length - 1; i >= 0; i--) { const d = decals[i]; d.life -= dt; if (d.life <= 0) decals.splice(i, 1); }
  for (let i = toasts.length - 1; i >= 0; i--) { const t = toasts[i]; t.life -= dt; if (t.life <= 0) toasts.splice(i, 1); }
  if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }
}

/* ============================================================
   玩家
   ============================================================ */
/* 狂热（肾上腺素）：每一层提供的移速 / 射速 / 装填加成比例 */
function bloodK() { return UPS.bloodlust.lvl ? 0.015 + 0.0075 * (UPS.bloodlust.lvl - 1) : 0; }
/* 亥伯龙：进入锁定所需的连续开火秒数（每级缩短 0.3 秒） */
function hyperionTime() { return Math.max(0.9, 1.5 - 0.3 * (UPS.hyperion.lvl - 1)); }

/* 第 i 把武器在当前升级加成下的实际数值。每帧重算，所以狂热层数、亥伯龙锁定、双持狂暴这类临时状态会立刻生效。
   升级对三把枪的加成方式：伤害 / 射速 / 穿透 / 元素对全武器生效；"分裂弹头"给霰弹枪加弹丸、给其它两把加伤害 */
function weaponStats(i) {
  const W = WEAPONS[i], u = UPS, p = player, extra = Math.floor(u.shotgun.val), sg = i === 1;
  const dmg = W.dmg * (1 + u.damage.val + (sg ? 0 : 0.10 * extra)) * (sg ? Math.pow(0.9, extra) : 1), blood = 1 + bloodK() * p.blood;
  return {
    pellets: W.pellets + (sg ? extra : 0),
    dmg,
    rate: W.rate * (1 + u.firerate.val) * blood * (p.frenzyT > 0 || p.gunzT > 0 ? 2 : 1) * (u.torgue.lvl ? 0.85 : 1) * (p.hypLock ? 1.35 : 1),
    pierce: Math.floor(u.pierce.val),
    cone: p.hypLock ? 0 : (W.cone + (sg ? extra * 1.2 : 0)) * DEG,                     // 亥伯龙锁定：散射归零
    crit: p.crit + (p.hypLock ? 0.2 * u.hyperion.lvl : 0),
    critMul: W.critMul + 0.4 * u.jakobs.lvl,                                          // 雅各布斯：暴击伤害每级 +40%
    fireChance: Math.max(W.fire, u.fire.lvl ? Math.min(0.9, 0.4 + 0.1 * u.fire.lvl) : 0),
    burnDps: dmg * Math.max(sg ? 1.26 : 0, u.fire.lvl ? 0.25 + 0.1 * u.fire.lvl : 0),  // 灼烧 = 攻击力的百分比 / 秒；霰弹枪本命火焰更强
    shockChance: Math.max(W.shock, u.shock.lvl ? Math.min(0.85, 0.25 + 0.1 * u.shock.lvl) : 0),
    chains: u.shock.lvl ? 3 : W.chains,                                               // 有电弧卡：最多跳 3 个目标
    slagChance: u.slag.lvl ? Math.min(0.45, 0.15 + 0.1 * u.slag.lvl) : 0,
    rocket: u.torgue.lvl > 0,
    bulletSpeed: W.speed, life: W.life, kb: W.kb, shake: W.shake, kick: W.kick, muzzle: W.muzzle,
    magMax: Math.round(W.mag * (1 + 0.5 * u.firerate.val)), reload: W.reload / blood
  };
}

function recalcStats() {
  const u = UPS, p = player;
  p.speed = 250 * (1 + u.speed.val);
  p.crit = 0.05 + u.crit.val;
  p.magnetR = 95 * (1 + u.magnet.val + 0.6 * u.bloodlust.lvl);
  const sm = 30 + 30 * u.shield.val + 40 * u.nova.val; if (sm > p.shieldMax) p.shield += sm - p.shieldMax; p.shieldMax = sm;   // 新星护盾：上限 +40 / 级，回充更快
  p.shieldRate = 14 + 5 * u.shield.val + 18 * u.nova.val; p.shieldDelayMax = u.nova.lvl ? 3 : 4;                                // 新星护盾：脱战 3 秒就开始回充
  const hm = 100 + 20 * u.maxhp.val; if (hm > p.hpMax) p.hp += hm - p.hpMax; p.hpMax = hm; p.regen = 0.35 * u.maxhp.val;
  for (let i = 0; i < 3; i++) {   // 每把枪独立弹匣：容量变大时补上差额
    const mm = weaponStats(i).magMax; if (mm > p.mmax[i] && p.rel[i] <= 0) p.ammo[i] += mm - p.mmax[i]; p.mmax[i] = mm; p.ammo[i] = Math.min(p.ammo[i], mm);
  }
  p.hp = Math.min(p.hp, p.hpMax); p.shield = Math.min(p.shield, p.shieldMax);
}

function heal(n) {
  const before = player.hp; player.hp = Math.min(player.hpMax, player.hp + n);
  const got = Math.round(player.hp - before); if (got <= 0) return;
  addText(player.x, player.y - 26, got, 0, '#6BFF7A', '+'); SFX.heal();
}

/* 冲刺翻滚：沿移动方向（静止时沿瞄准方向）冲刺，期间无敌并留下残影 */
function tryDash() {
  const p = player;
  if (state !== ST.PLAY || !p.alive || p.dashCd > 0 || p.dashT > 0 || bossIntro > 0) return;
  const [ix, iy] = inputDir(); let dx = ix, dy = iy;
  if (!dx && !dy) { dx = Math.cos(p.aim); dy = Math.sin(p.aim); }
  const l = hyp(dx, dy) || 1;
  p.dashDx = dx / l; p.dashDy = dy / l; p.dashT = DASH_TIME;
  p.iframes = Math.max(p.iframes, DASH_TIME + 0.06 + 0.02 * UPS.dashcd.val);
  p.dashCdMax = DASH_CD * Math.max(0.25, 1 - 0.15 * UPS.dashcd.val); p.dashCd = p.dashCdMax;
  stats.dashes++; SFX.dash(); addShake(3); speedT = 0.22;
  for (let i = 0; i < 6; i++) addPart('smoke', p.x - p.dashDx * 8, p.y - p.dashDy * 8 + 6, -p.dashDx * rand(30, 90) + rand(-30, 30), -p.dashDy * rand(30, 90) + rand(-20, 10), rand(0.3, 0.5), rand(4, 7), '#D9B377');
  if (Math.random() < 0.5) addWord('WHOOSH!', p.x, p.y - 30, '#5FF3FF', 20, 'dash', 900);
}

function startReload(manual) {
  const p = player, i = p.weapon;
  if (p.rel[i] > 0 || p.ammo[i] >= p.mmax[i] || !p.alive || p.swapT > 0 || bossIntro > 0) return;
  p.rel[i] = gun.reload; SFX.reload();
  if (UPS.tediore.lvl) throwGun(p.ammo[i] / p.mmax[i]);   // 泰迪尔：换弹 = 把手里这把枪朝准星掷出去（残弹越多越狠）
}

/* 切换武器：to 为目标武器序号（越界自动循环）。换枪需要 0.22 秒，期间不能开火。
   每把枪的弹匣和装填进度各自保留；装填只在手持时推进，所以"打空一把马上换另一把"是有效的战术 */
function switchWeapon(to) {
  const p = player;
  if (state !== ST.PLAY || !p.alive || bossIntro > 0) return;
  to = ((to % 3) + 3) % 3;
  if (to === p.weapon) return;
  p.prevW = p.weapon; p.weapon = to; p.swapT = 0.22; p.fireT = Math.max(p.fireT, 0.12); p.heat = 0;
  gun = weaponStats(to); SFX.swap();
}

/* 瞄准：以准星方向为基准，在锥形范围内吸附最贴合的敌人 / 油桶 */
function updateAim(dt) {
  const p = player;
  const base = Math.atan2(mouse.wy - p.y, mouse.wx - p.x);
  let best = base, bestScore = Infinity, has = false;
  const lim0 = 34 * DEG, reach = 980;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i]; if (e.dead) continue;
    const dx = e.x - p.x, dy = e.y - p.y, d2 = dx * dx + dy * dy; if (d2 > reach * reach) continue;
    const da = wrapA(Math.atan2(dy, dx) - base), lim = lim0 + Math.atan2(e.r, Math.sqrt(d2)) * 0.7;
    if (Math.abs(da) > lim) continue;
    if (solidsNear.length && !e.boss && !e.drone && losBlocked(e.x, e.y)) continue;   // 躲在掩体后面的敌人不锁定（Boss 和天上的无人机总能锁定）
    const score = Math.abs(da) / lim + Math.sqrt(d2) / reach * 0.35;
    if (score < bestScore) { bestScore = score; best = Math.atan2(dy, dx); has = true; }
  }
  for (let i = 0; i < solidsNear.length; i++) {
    const q = solidsNear[i]; if (q.type !== 'barrel') continue;
    if (hyp(q.x - mouse.wx, q.y - mouse.wy) > 85) continue;   // 油桶：准星指到桶附近才算目标，避免开局莫名其妙打空弹匣
    const dx = q.x - p.x, dy = q.y - p.y, d2 = dx * dx + dy * dy; if (d2 > reach * reach) continue;
    const da = wrapA(Math.atan2(dy, dx) - base); if (Math.abs(da) > 26 * DEG) continue;
    const score = Math.abs(da) / (26 * DEG) + Math.sqrt(d2) / reach * 0.35 + 0.25;
    if (score < bestScore) { bestScore = score; best = Math.atan2(dy, dx); has = true; }
  }
  p.hasTarget = has;

}

function fire() {
  const p = player, g = gun, n = g.pellets, w = p.weapon, ca = Math.cos(p.aim), sa = Math.sin(p.aim);
  if (UPS.hyperion.lvl && p.hypGap > 0.3) p.hypT = 0;   // 亥伯龙：新的一轮连射从头计时
  p.hypGap = 0;
  if (p.gunzT <= 0) p.ammo[w]--;                        // 双持狂暴期间不消耗弹药
  const cone = p.hypLock ? 0 : (g.cone + (w === 1 ? 0 : p.heat * 4 * DEG)) * (mouse.down ? 1.5 : 1) * (p.moving ? 1.25 : 1);   // 锁定后绝对精准
  const mx = p.x + ca * g.muzzle, my = p.y + sa * g.muzzle;
  for (let i = 0; i < n; i++) {
    const off = w === 1 ? (i % 2 ? 2.8 : -2.8) : 0;   // 双管霰弹枪：左右两根枪管交替出弹
    spawnBullet(mx - sa * off, my + ca * off, p.aim + rand(-0.5, 0.5) * cone);
  }
  p.recoil = 1; p.muzzle = MUZ_T[w]; p.muzV = (Math.random() * 3) | 0; p.heat = Math.min(1, p.heat + (w === 2 ? 0.09 : 0.16)); p.spread = cone / DEG;
  addShake(g.shake);
  // 枪口喷出的火星与硝烟（冲锋枪是电火花，不冒烟）
  for (let i = 0, n = w === 1 ? 7 : w === 2 ? 2 : 4; i < n; i++) {
    const a2 = p.aim + rand(-0.5, 0.5) * (w === 1 ? 1.2 : 1), s2 = rand(160, 420) * (w === 1 ? 1.3 : 1);
    addPart('spark', mx, my, Math.cos(a2) * s2, Math.sin(a2) * s2, rand(0.08, 0.18), rand(1.6, 2.6), w === 2 ? (Math.random() < 0.5 ? '#5FF3FF' : '#FFFFFF') : (Math.random() < 0.5 ? '#FFD23F' : '#FFF6A0'));
  }
  if (w !== 2) addPart('smoke', mx + ca * 6, my + sa * 6, ca * rand(30, 70) - sa * rand(-20, 20), sa * rand(30, 70) + ca * rand(-20, 20), rand(0.35, 0.55), rand(4, 6), '#D9B377');
  // 抛壳（霰弹枪一次抛两枚红色弹壳）
  for (let i = 0, sh; i < (w === 1 ? 2 : 1); i++) {
    const a2 = p.aim + Math.PI / 2 + rand(-0.4, 0.4);
    sh = addPart('shell', p.x + ca * 12, p.y + sa * 12 - 4, Math.cos(a2) * rand(90, 150), Math.sin(a2) * rand(90, 150) - 30, rand(1.2, 2), 2, w === 1 ? '#E8452C' : '#FFD23F', rand(TAU));
    if (sh) { sh.z = 6; sh.vz = w === 1 ? 220 : 150; }
  }
  if (g.kick) {   // 高后坐力：把玩家往后顶，镜头跟着后蹬，并顿一帧增加分量
    p.kbx -= ca * g.kick; p.kby -= sa * g.kick;
    cam.kx = -ca * 9 * shakeScale; cam.ky = -sa * 9 * shakeScale; hitStop = Math.max(hitStop, 0.03);   // 镜头后蹬同样乘以设置里的震动强度
    for (let i = 0; i < 3; i++) addPart('smoke', mx - ca * 4, my - sa * 4, ca * rand(30, 90) - sa * rand(-30, 30), sa * rand(30, 90) + ca * rand(-30, 30), rand(0.3, 0.5), rand(4, 6.5), '#7A6A5A');
  }
  SFX.shoot(w); if (g.rocket) SFX.rocket();
}

function spawnBullet(x, y, a) {
  let b;
  if (bullets.length >= MAX_B) { b = bullets[0]; bullets[0] = bullets[bullets.length - 1]; bullets.pop(); }
  else b = bulletPool.pop() || { hits: [] };
  const w = player.weapon, sg = w === 1, rk = gun.rocket;
  const sp = gun.bulletSpeed * (sg ? rand(0.88, 1.1) : rand(0.96, 1.04)), r = rk ? 5 : (sg ? 3.6 : w === 2 ? 2.7 : 3.2) + (gun.pierce ? 1 : 0);
  b.x = x; b.y = y; b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp; b.r = r; b.len = r * 2.7;
  b.dmg = gun.dmg; b.pierce = gun.pierce; b.life = gun.life * (sg ? rand(0.85, 1.1) : 1); b.kb = gun.kb; b.critMul = gun.critMul;
  // 元素与词条参数在出膛时定格：之后换枪或升级不影响已经飞出去的子弹
  b.fire = gun.fireChance > 0; b.fireC = gun.fireChance; b.burnDps = gun.burnDps;
  b.shock = gun.shockChance > 0; b.shockC = gun.shockChance; b.chains = gun.chains;
  b.slag = Math.random() < gun.slagChance;                 // 紫渣弹：每一发单独判定
  b.rocket = rk; b.hyp = player.hypLock && UPS.hyperion.lvl > 0; b.style = rk ? 3 : w; b.dead = false;
  b.hits.length = 0;

}

function updateShooting(dt) {
  const p = player, i = p.weapon;
  if (p.muzzle > 0) p.muzzle -= dt;
  if (p.recoil > 0) p.recoil = Math.max(0, p.recoil - dt * 9);
  p.heat = Math.max(0, p.heat - dt * 1.5);
  p.spread = Math.max(0, p.spread - dt * 40);
  if (p.frenzyT > 0) p.frenzyT -= dt;
  if (p.gunzT > 0) p.gunzT -= dt;
  if (p.novaCd > 0) p.novaCd -= dt;
  // 亥伯龙：连续开火计时。停火超过 0.3 秒（松手 / 换弹 / 换枪）就归零并解除锁定
  if (UPS.hyperion.lvl) {
    p.hypGap += dt;
    if (p.hypGap > 0.3) { p.hypT = 0; p.hypLock = false; }
    else { p.hypT += dt; if (!p.hypLock && p.hypT >= hyperionTime()) { p.hypLock = true; SFX.lock(); } }
  }
  if (p.swapT > 0) return;   // 换枪中不能开火
  if (p.rel[i] > 0) {        // 只有手持的武器在推进装填
    p.rel[i] -= dt;
    if (p.rel[i] <= 0) { p.rel[i] = 0; p.ammo[i] = p.mmax[i]; SFX.reloadDone(); }
    return;
  }
  if (p.ammo[i] <= 0 && p.gunzT <= 0) { startReload(false); return; }   // 双持狂暴期间不耗弹，也就不会打空
  if (!p.hasTarget && !mouse.down) { p.fireT = Math.min(p.fireT, 0.04); return; }   // 没有目标时不浪费子弹
  p.fireT -= dt;
  if (p.fireT <= 0) {
    fire();
    p.fireT += 1 / gun.rate; if (p.fireT < 0) p.fireT = 0;
  }
}

function updatePlayer(dt) {
  const p = player;
  // 殊死一搏：4 秒内没有反杀就倒下
  if (p.swT > 0) { p.swT -= dt; if (p.swT <= 0) { p.swT = 0; p.hp = 0; killPlayer(); return; } }
  if (p.iframes > 0) p.iframes -= dt;
  if (p.flash > 0) p.flash -= dt;
  if (p.shieldFx > 0) p.shieldFx -= dt;
  if (p.regen > 0 && p.hp < p.hpMax) p.hp = Math.min(p.hpMax, p.hp + p.regen * dt);
  if (p.shieldDelay > 0) p.shieldDelay -= dt;
  else if (p.shield < p.shieldMax) p.shield = Math.min(p.shieldMax, p.shield + p.shieldRate * dt);
  // 血条 / 护盾条的掉血残影：回血时立即跟上；扣血后先停一下，再追到当前值
  if (p.hpGhost < p.hp) p.hpGhost = p.hp; else if (p.hpGhost > p.hp) { if (p.hpGhostT > 0) p.hpGhostT -= dt; else p.hpGhost = Math.max(p.hp, p.hpGhost - dt * 110); }
  if (p.shGhost < p.shield) p.shGhost = p.shield; else if (p.shGhost > p.shield) p.shGhost = Math.max(p.shield, p.shGhost - dt * 140);
  if (p.dashCd > 0) p.dashCd -= dt;
  if (p.swapT > 0) p.swapT -= dt;   // 换枪计时
  // 肾上腺素：3 秒没拾取晶体后，每 0.35 秒掉一层狂热；带着狂热移动时身后拖出红色残影
  if (p.blood > 0) {
    p.bloodT += dt;
    if (p.bloodT > 3) { p.bloodDecay += dt; while (p.bloodDecay >= 0.35 && p.blood > 0) { p.bloodDecay -= 0.35; p.blood--; } } else p.bloodDecay = 0;
    if (p.moving) { p.bloodGhostT -= dt; if (p.bloodGhostT <= 0) { p.bloodGhostT = 0.1 - 0.0035 * p.blood; ghosts.push({ x: p.x, y: p.y, aim: p.aim, walk: p.walk, w: p.weapon, c: 2, life: 0.24, max: 0.24 }); } }
  }

  if (p.dashT > 0) {
    p.dashT -= dt;
    p.x += p.dashDx * DASH_SPEED * dt; p.y += p.dashDy * DASH_SPEED * dt;
    p.mvx = p.dashDx * 420; p.mvy = p.dashDy * 420; p.moving = true;
    p.ghostT -= dt;
    if (p.ghostT <= 0) { p.ghostT = 0.022; ghosts.push({ x: p.x, y: p.y, aim: p.aim, walk: p.walk, w: p.weapon, life: 0.3, max: 0.3 }); }
    if (Math.random() < dt * 40) addPart('spark', p.x + rand(-6, 6), p.y + rand(-6, 6) + 6, -p.dashDx * rand(60, 160), -p.dashDy * rand(60, 160), 0.2, 2, '#5FF3FF');
    if (p.dashT <= 0) p.iframes = Math.max(p.iframes, 0.05);
  } else {
    const [ix, iy] = inputDir(), k = 1 - Math.exp(-dt * 16), spd = p.speed * (1 + bloodK() * p.blood) * (p.swT > 0 ? 0.35 : 1);   // 狂热加移速；殊死一搏大幅减速
    p.mvx += (ix * spd - p.mvx) * k; p.mvy += (iy * spd - p.mvy) * k;
    p.moving = !!(ix || iy);

  }
  const kf = Math.exp(-dt * 9); p.kbx *= kf; p.kby *= kf;
  p.walk += hyp(p.mvx, p.mvy) * dt * 0.075;
  p.sy = p.y;
  resolveSolids(p, false);
  updateAim(dt);
  updateShooting(dt);
  // 双持狂暴：两侧的枪口持续喷火
  if (p.gunzT > 0) for (let s = -1; s <= 1; s += 2) if (Math.random() < dt * 46) {
    const a = p.aim + s * 0.38, ox = p.x - Math.sin(p.aim) * 15 * s, oy = p.y + Math.cos(p.aim) * 15 * s;
    addFlame(ox + Math.cos(a) * 34 + rand(-4, 4), oy + Math.sin(a) * 34 + rand(-4, 4), Math.cos(a) * rand(40, 120), Math.sin(a) * rand(40, 120), rand(0.2, 0.35), rand(4, 6.5));
  }
  // 镜头略偏向准星方向
  const tx = p.x + (mouse.x - W / 2) / ZOOM * 0.14, ty = p.y + (mouse.y - H / 2) / ZOOM * 0.14, ck = 1 - Math.exp(-dt * 9);
  cam.x += (tx - cam.x) * ck; cam.y += (ty - cam.y) * ck;
}

function hurtPlayer(dmg, sx, sy, force) {
  const p = player;
  if (!p.alive || (p.iframes > 0 && !force) || p.swT > 0) return;   // 殊死一搏期间不再受伤
  if (p.gunzT > 0) dmg *= 0.7;                                       // 双持狂暴：伤害减免 30%
  stats.dmgTaken += dmg;
  if (p.shield > 0) {
    const a = Math.min(p.shield, dmg); p.shield -= a; dmg -= a; p.shieldFx = 0.3;
    if (p.shield <= 0.01) {
      p.shield = 0; SFX.shieldBreak(); addWord('CRACK!', p.x, p.y - 34, '#5FF3FF', 26, 'crack', 800);
      for (let i = 0; i < 10; i++) { const a2 = i / 10 * TAU; addPart('spark', p.x + Math.cos(a2) * 20, p.y + Math.sin(a2) * 20, Math.cos(a2) * 260, Math.sin(a2) * 260, 0.3, 2.5, '#5FF3FF'); }
      if (UPS.nova.lvl && p.novaCd <= 0) novaBlast();
    }
  }
  if (dmg > 0) { p.hp -= dmg; p.hpGhostT = 0.4; }
  p.shieldDelay = p.shieldDelayMax; p.iframes = 0.75; p.flash = 0.06;
  const dx = p.x - sx, dy = p.y - sy, d = hyp(dx, dy) || 1; p.kbx += dx / d * 280; p.kby += dy / d * 280;
  addShake(13); hurtFlash = 1;

function killPlayer() {

  p.alive = false; deathT = 1.5; p.hpGhost = p.shGhost = 0; p.swT = 0;
  for (let i = 0; i < 26; i++) { const a = rand(TAU), s = rand(80, 420); addPart('chunk', p.x, p.y, Math.cos(a) * s, Math.sin(a) * s, rand(0.5, 1), rand(3, 7), pick(['#C0281F', '#E9A21B', '#F2C9A0', '#8C3B1E']), rand(TAU)); }

/* ---- 新星护盾：护盾被打空的瞬间，以自身为中心释放冲击波（伤害 + 强击退），8 秒内置冷却 ---- */
function novaBlast() {
  const p = player, l = UPS.nova.lvl, R = 160 + 20 * l;
  p.novaCd = 8;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i]; if (e.dead) continue;
    const dx = e.x - p.x, dy = e.y - p.y, d = hyp(dx, dy) || 1;
    if (d > R + e.r) continue;
    applyDamage(e, 180 * l * dmgScale(), { sourceTag: 'nova', kx: dx / d, ky: dy / d, kb: 9, textCol: '#9FF6FF' });
  }

  booms.push({ x: p.x, y: p.y, r: R * 0.7, t: 0, max: 0.5, rot: 0, pts: null, ring: true, c1: '#FF9A1F', c2: '#FFD23F', delay: 0.08 });
  for (let i = 0; i < 16; i++) { const a = i / 16 * TAU; addPart('spark', p.x + Math.cos(a) * 20, p.y + Math.sin(a) * 20, Math.cos(a) * 420, Math.sin(a) * 420, 0.35, 2.5, i % 2 ? '#5FF3FF' : '#FF9A1F'); }
  addWord('NOVA!', p.x, p.y - 40, '#5FF3FF', 50, null, 0); addShake(14); SFX.nova();
}

/* ---- 双持狂暴：累计击杀满 30 人自动触发。期间射速翻倍、不耗弹、减伤 30% ---- */
function startGunzerker() {

  addWord('GUNZERK!', W / 2, H * 0.3, '#FF8C00', 64, null, 0, true); addShake(10); whiteFlash = Math.max(whiteFlash, 0.35); SFX.gunzerk();

/* ---- 卷土重来：致命伤改为 4 秒殊死一搏（大幅减速、仍可开火、不再受伤）；期间击杀任意敌人即满血复活 ---- */
const SW_TIME = 4;
function startSecondWind() {

  hurtFlash = 1; addShake(16); addWord('FIGHT FOR YOUR LIFE!', W / 2, H * 0.2, '#FFFFFF', 44, null, 0, true); SFX.down();

function secondWindRevive() {

  p.hp = p.hpMax; p.hpGhost = p.hpMax; p.shield = p.shieldMax; p.shGhost = p.shieldMax; p.shieldDelay = 0;

/* ============================================================
   敌人
   ============================================================ */
function edgePos(margin) {
  const hw = vw + margin, hh = vh + margin, side = Math.floor(Math.random() * 4);
  if (side === 0) return [cam.x + rand(-hw, hw), cam.y - hh];
  if (side === 1) return [cam.x + hw, cam.y + rand(-hh, hh)];
  if (side === 2) return [cam.x + rand(-hw, hw), cam.y + hh];
  return [cam.x - hw, cam.y + rand(-hh, hh)];
}

function spawnEnemy(type, x, y, elite, force) {
  if (enemies.length >= MAX_E && !force) return null;   // force：Boss 放出的无人机不受数量上限限制
  const T = ETYPES[type], sc = elite ? 1.7 : 1, e = enemyPool.pop() || {};
  e.type = type; e.x = x; e.y = y; e.scale = sc; e.r = T.r * sc;
  e.hp = e.hpMax = T.hp * hpScale() * (elite ? 12 : 1);
  e.speed = T.speed * speedScale() * rand(0.9, 1.1) * (elite ? 0.9 : 1);
  e.dmg = T.dmg * dmgScale(); e.xp = T.xp * (elite ? 12 : 1);
  e.kbRes = elite ? Math.min(0.95, T.kbRes + 0.5) : T.kbRes; e.mass = T.mass * (elite ? 5 : 1);
  e.dead = false; e.elite = !!elite; e.flash = 0; e.spawnT = 0.25; e.kx = 0; e.ky = 0;
  e.burnTimer = 0; e.burnTick = 0; e.burnDps = 0; e.burnAcc = 0; e.shockSlowTimer = 0; e.corrosiveTimer = 0; e.slagTimer = 0; e.armT = 0; e.awayT = 0;   // 状态计时器：燃烧 / 电击减速 / 腐蚀 / 紫渣
  e.ang = Math.atan2(player.y - y, player.x - x); e.walk = rand(TAU); e.t = rand(TAU);
  e.wob = type === 0 ? rand(0.15, 0.45) : 0; e.wobF = rand(3, 6); e.wobP = rand(TAU);
  e.arming = false; e.dk = 2; e.vis = false; e.blk = false; e.side = 1; e.boss = false; e.drone = false;   // 从对象池复用的对象可能带着上一个身份的标记
  if (solidsNear.length) resolveSolids(e, false);   // 刷怪点正好压在掩体上时，先把敌人推到掩体外
  enemies.push(e);
  for (let i = 0; i < 2; i++) addPart('smoke', x + rand(-8, 8), y + rand(-4, 8), rand(-40, 40), rand(-40, 20),     rand(0.3, 0.45), rand(4, 6.5), '#D9B377');
  return e;
}

function pickType() {
  const t = gameTime, w0 = 10, w1 = t > 35 ? 2 + t / 150 : 0, w2 = t > 80 ? 1.2 + t / 200 : 0;
  let r = rand(w0 + w1 + w2);
  if ((r -= w0) < 0) return 0;
  if ((r -= w1) < 0) return 1;
  return 2;
}

let spawnHold = false;   // 测试用：强制暂停常规刷怪（见 __wm.holdSpawns）
function updateSpawns(dt) {
  if (boss || vaultPending || spawnHold) return;   // Boss 登场后常规刷怪 / 波次暂停，直到拾取秘藏宝箱
  if (gameTime >= bossNextT && player.alive) { startBossFight(); return; }   // 每 3 分钟一个关底 Boss
  spawnT -= dt;
  if (spawnT <= 0) {
    const rate = 1 + 0.028 * gameTime + 0.00028 * gameTime * gameTime, q = edgePos(70);
    spawnEnemy(pickType(), q[0], q[1], false);
    spawnT += 1 / rate;
    if (spawnT < -0.3) spawnT = 0.1;
  }
  if (gameTime >= nextWaveT) { nextWaveT += 40; startWave(); }
  if (gameTime >= nextBossT) {
    nextBossT += 75; const q = edgePos(60); spawnEnemy(2, q[0], q[1], true);
    announce('警告：BADASS 铁桶兵', '击倒它可获得宝箱！', '#FF5A3C'); SFX.wave();
  }
}

/* 波次：在玩家四周环形包围刷出一整圈 */
function startWave() {
  waveN++;
  const n = 10 + waveN * 4, R = Math.max(vw, vh) + 130;
  for (let i = 0; i < n; i++) { const a = i / n * TAU + rand(-0.1, 0.1), k = R * rand(0.95, 1.3); spawnEnemy(0, player.x + Math.cos(a) * k, player.y + Math.sin(a) * k, false); }
  if (waveN >= 2) for (let i = 0; i < Math.min(8, waveN * 2); i++) { const a = rand(TAU); spawnEnemy(1, player.x + Math.cos(a) * R * 1.1, player.y + Math.sin(a) * R * 1.1, false); }
  if (waveN >= 3) for (let i = 0; i < Math.min(5, waveN - 2); i++) { const a = rand(TAU); spawnEnemy(2, player.x + Math.cos(a) * R * 1.15, player.y + Math.sin(a) * R * 1.15, false); }
  announce('第 ' + waveN + ' 波', pick(['疯子军团来袭！', '他们闻到了你的血味…', '别停下，跑起来！', '更多的疯子，更多的问题。', '弹药用尽才是真正的死因。']), '#FFD23F');
  SFX.wave();
}

/* ============================================================
   统一伤害结算 + 状态效果 + 元素 / 厂牌机制
   ============================================================ */
/* 伤害来源标签 → [结算界面上的名称, 配色] */
const DMG_SRC = {
  bullet: ['子弹直击', '#F4E9D3'], rocket: ['托格爆炸', '#FF8C00'], tediore: ['泰迪尔掷枪', '#FFD23F'], jakobs: ['雅各布斯弹射', '#FFE23F'], fire: ['灼烧', '#FF7A1A'],
  shock: ['连锁闪电', '#5FF3FF'], nova: ['新星冲击', '#49E6FF'], blast: ['环境爆炸', '#C8B48A'], nuke: ['震爆脉冲', '#FFFFFF']
};
const NO_OPT = {}, SLAG_ELS = ['slag'], FIRE_ELS = ['fire'], SHOCK_ELS = ['shock'];   // 常驻的元素列表，命中时直接引用，不新建数组
/* 所有对敌人的伤害（子弹 / 爆炸 / 电弧 / 灼烧 / 新星 …）都从这里结算，返回实际造成的伤害。
   o = { isCrit, critMul, sourceTag, elements: ['fire' | 'shock' | 'corrosive' | 'slag'], kb, kx, ky, dot, textCol, silent }
   结算顺序：① 暴击倍率 → ② 紫渣易伤 ×2.0（紫渣弹自己的伤害不享受）→ ③ 腐蚀破甲 ×1.25 → 扣血 / 击退 / 跳字 / 按来源记账 */
function applyDamage(target, baseDamage, options) {
  const e = target, o = options || NO_OPT;
  if (!e || e.dead || !(baseDamage > 0)) return 0;
  let dmg = baseDamage;
  if (o.isCrit) dmg *= o.critMul || 2.2;
  const slagged = e.slagTimer > 0 && !(o.elements && o.elements.indexOf('slag') >= 0);
  if (slagged) dmg *= 2;
  if (e.corrosiveTimer > 0) dmg *= 1.25;
  e.hp -= dmg; if (!o.dot) e.flash = 0.07;
  if (e.boss) e.hpGhostT = 0.45;   // Boss 血条：掉血残影先停一下再追
  const kb = (o.isCrit ? 280 : 170) * (1 - e.kbRes) * (o.kb || 0);
  if (kb > 0) { e.kx += (o.kx || 0) * kb; e.ky += (o.ky || 0) * kb; }
  const tag = o.sourceTag || 'bullet';
  stats.damage += dmg; stats.dmgBy[tag] = (stats.dmgBy[tag] || 0) + dmg;
  if (o.isCrit) { stats.crits++; if (dmg > stats.maxCrit) stats.maxCrit = dmg; }
  if (!o.silent) {
    if (slagged) addText(e.x, e.y - e.r, dmg, 3, '#D45CFF');                                   // 紫渣易伤：硕大的紫色跳字
    else if (o.dot) addText(e.x, e.y - e.r, dmg, 2, o.textCol || '#FF8A1E');
    else addText(e.x, e.y - e.r, dmg, o.isCrit ? 1 : 0, o.isCrit ? '#FFE23F' : o.textCol || '#FFFFFF');
  }
  if (e.hp <= 0) killEnemy(e, o.kx || 0, o.ky || 0);
  return dmg;
}

/* ---- 状态效果：燃烧（持续伤害）/ 电击减速 / 腐蚀破甲（受到的伤害 +25%）/ 紫渣（受到的伤害 ×2）---- */
function applyBurn(e, dps, dur) {
  if (e.burnTimer <= 0) {
    for (let i = 0; i < 6; i++) addFlame(e.x + rand(-e.r, e.r) * 0.7, e.y + rand(-e.r, e.r) * 0.6, rand(-40, 40), -rand(40, 110), rand(0.35, 0.6), rand(4, 7));
    addWord('FWOOSH!', e.x, e.y - e.r - 14, '#FF8A1E', 24, 'ignite', 700); SFX.ignite();
  }
  e.burnTimer = Math.max(e.burnTimer, dur); e.burnDps = Math.max(e.burnDps, dps);   // 多个来源：取更长的剩余时间和更高的每秒伤害
}
function applyShock(e, dur) {
  e.shockSlowTimer = Math.max(e.shockSlowTimer, dur);
  zaps.push({ x: e.x, y: e.y, t: 0, max: 0.16, rot: rand(TAU) });
  for (let i = 0; i < 3; i++) { const a = rand(TAU), s = rand(90, 240); addPart('spark', e.x, e.y, Math.cos(a) * s, Math.sin(a) * s, rand(0.12, 0.25), 2, i % 2 ? '#5FF3FF' : '#FFFFFF'); }
}
function applyCorrosive(e, dur) {
  if (e.corrosiveTimer <= 0) { addWord('HISSS!', e.x, e.y - e.r - 14, '#8CFF3A', 24, 'hiss', 500); SFX.hiss(); }
  e.corrosiveTimer = Math.max(e.corrosiveTimer, dur);
}
function applySlag(e, dur) {
  if (e.slagTimer <= 0) { SFX.slag(); for (let i = 0; i < 5; i++) addPart('acid', e.x + rand(-e.r, e.r), e.y + rand(-e.r, e.r) * 0.6, rand(-30, 30), rand(10, 50), rand(0.4, 0.6), rand(2, 3.2) * (e.boss ? 2.6 : e.scale), '#C44DFF'); }
  e.slagTimer = Math.max(e.slagTimer, dur);
}
/* 重装 / 高血量敌人：重装铁桶兵、任何 BADASS，或血量达到疯子 4.6 倍以上的目标 */
function isArmored(e) { return e.type === 2 || !!e.elite || e.hpMax >= 120 * hpScale(); }

/* 一发子弹（或雅各布斯的弹射）命中单个敌人的结算：暴击 → 腐蚀克制 → 扣血 → 元素触发 → 雅各布斯弹射。返回实际造成的伤害 */
function bulletHit(b, e, nx, ny, mul, isRicochet) {
  const u = UPS, crit = !isRicochet && Math.random() < gun.crit;
  let dmg = b.dmg * mul;
  if (!isRicochet && u.corrosive.lvl && isArmored(e)) { dmg *= 1 + 0.5 * u.corrosive.lvl; applyCorrosive(e, 3 + u.corrosive.lvl); }   // 腐蚀：克制重装 + 附着破甲
  const dealt = applyDamage(e, dmg, { isCrit: crit, critMul: b.critMul, sourceTag: isRicochet ? 'jakobs' : 'bullet', elements: b.slag ? SLAG_ELS : null, kx: nx, ky: ny, kb: b.kb });
  if (!isRicochet) {
    if (crit) { SFX.crit(); addWord('CRIT!', e.x + rand(-6, 6), e.y - e.r - 14, '#FFE23F', 28, 'crit', 260); } else SFX.hit();
    for (let i = 0; i < 2; i++) addPart('spark', b.x, b.y, -b.vx * rand(0.1, 0.3) + rand(-90, 90), -b.vy * rand(0.1, 0.3) + rand(-90, 90), rand(0.12, 0.22), 2, b.slag ? '#D45CFF' : b.style === 1 ? '#FFB01E' : b.style === 2 ? '#9FF6FF' : crit ? '#FFE23F' : '#FFF6A0');
  }
  if (!e.dead) {
    if (b.slag) applySlag(e, 4 + u.slag.lvl);   // 紫渣弹：先造成这一发的伤害，再覆盖紫渣（之后的伤害才翻倍）
    if (!isRicochet) elementProcs(b, e);
  }
  if (!isRicochet && crit && u.jakobs.lvl) ricochet(e, dealt, b);
  return dealt;
}
/* 元素触发：用的是这发子弹出膛时的概率与强度 */
function elementProcs(b, e) {
  if (b.fireC > 0 && Math.random() < b.fireC) applyBurn(e, b.burnDps, 3);
  if (!e.dead && b.shockC > 0 && Math.random() < b.shockC) chainLightning(e, b.dmg, b.chains);
}
/* 雅各布斯弹射：暴击后朝 250px 内最近的另一名敌人弹一次，造成这次伤害的 70% 起；弹道是一条带折角的金色描边折线 */
function ricochet(from, dealt, b) {
  let best = null, bd = 250 * 250;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i]; if (e.dead || e === from) continue;
    const dx = e.x - from.x, dy = e.y - from.y, d2 = dx * dx + dy * dy;
    if (d2 < bd) { bd = d2; best = e; }
  }
  if (!best) return;
  const dx = best.x - from.x, dy = best.y - from.y, d = hyp(dx, dy) || 1;
  tracers.push({ ax: from.x, ay: from.y, bx: best.x, by: best.y, mx: (from.x + best.x) / 2 - dy / d * 7, my: (from.y + best.y) / 2 + dx / d * 7, life: 0.18, max: 0.18 });
  bulletHit({ dmg: dealt, critMul: b.critMul, kb: b.kb }, best, dx / d, dy / d, 0.7 + 0.15 * (UPS.jakobs.lvl - 1), true);   // 以这次实际造成的伤害（含暴击）为基础
  addWord('PING!', best.x + rand(-6, 6), best.y - best.r - 14, '#FFD23F', 24, 'ping', 240); SFX.ping();
}
/* 托格微型火箭：命中点炸开，范围内的敌人都受到 120% 起的弹丸伤害（一发只判定一次暴击）。hit 为直接命中的敌人（可为空，比如撞在掩体上） */
function rocketBlast(b, hx, hy, hit) {
  const l = UPS.torgue.lvl, R = 65 + 8 * (l - 1), crit = Math.random() < gun.crit;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i]; if (e.dead) continue;
    const dx = e.x - hx, dy = e.y - hy, d = hyp(dx, dy) || 1;
    if (d > R + e.r) continue;
    const dealt = applyDamage(e, b.dmg * (1.2 + 0.3 * (l - 1)) * (1 - 0.3 * d / (R + e.r)), { isCrit: crit, critMul: b.critMul, sourceTag: 'rocket', kx: dx / d, ky: dy / d, kb: 2, textCol: '#FFB01E' });
    if (e === hit && crit && dealt > 0 && UPS.jakobs.lvl) ricochet(e, dealt, b);
  }
  booms.push({ x: hx, y: hy, r: R, t: 0, max: 0.3, rot: rand(TAU), pts: starPts(9, 0.42), ring: false });
  for (let i = 0; i < 3; i++) addPart('smoke', hx + rand(-8, 8), hy + rand(-8, 8), rand(-60, 60), rand(-80, -10), rand(0.3, 0.5), rand(5, 8), '#7A6A5A');
  for (let i = 0; i < 7; i++) { const a = rand(TAU), s = rand(140, 340); addPart('spark', hx, hy, Math.cos(a) * s, Math.sin(a) * s, rand(0.15, 0.3), 2.2, i % 2 ? '#FFD23F' : '#FF8A1E'); }
  addShakeAt(hx, hy, 3.5); addWord('BOOM!', hx, hy - 14, '#FF9A1F', 30, 'rocket', 420); SFX.blast();
}
/* 连锁闪电：命中的目标先被电到，再依次跳向 150px 内最近的未命中敌人（最多 chains 跳）；每跳 50% 伤害并减速 60% 持续 0.4 秒 */
function chainLightning(src, base, chains) {
  let from = src; const seen = [src], pts = [[src.x, src.y]];
  applyShock(src, 0.4);
  for (let k = 0; k < chains; k++) {
    let best = null, bd = 150 * 150;
    for (let i = 0; i < enemies.length; i++) { const e = enemies[i]; if (e.dead || seen.indexOf(e) >= 0) continue; const d2 = (e.x - from.x) * (e.x - from.x) + (e.y - from.y) * (e.y - from.y); if (d2 < bd) { bd = d2; best = e; } }
    if (!best) break;
    seen.push(best); pts.push([best.x, best.y]);
    const dx = best.x - from.x, dy = best.y - from.y, d = hyp(dx, dy) || 1;
    applyDamage(best, base * 0.5, { sourceTag: 'shock', elements: SHOCK_ELS, kx: dx / d, ky: dy / d, kb: 0.25, textCol: '#9FF6FF' });
    if (!best.dead) applyShock(best, 0.4);
    from = best;
  }
  if (pts.length > 1) { addBolt(pts); addWord('ZAP!', from.x, from.y - 20, '#5FF3FF', 26, 'zap', 380); SFX.zap(); }
}
/* 火势蔓延：燃烧中的敌人死亡时，引燃 80px 内的所有其他敌人。
   火势靠灼烧伤害自己推进：每传一代灼烧伤害 ×0.6，传到烧不死人的强度就自然熄灭 */
function fireSpread(e) {
  for (let i = 0; i < 6; i++) addFlame(e.x + rand(-e.r, e.r), e.y + rand(-e.r, e.r) * 0.6, rand(-50, 50), -rand(50, 130), rand(0.4, 0.7), rand(4, 7.5));
  for (let i = 0; i < 3; i++) addPart('spark', e.x, e.y, rand(-120, 120), -rand(60, 160), rand(0.3, 0.5), 1.8, '#FFD23F');
  if (e.burnDps <= 2.5) return;
  const dps = e.burnDps * 0.6, r2 = 80 * 80;
  for (let i = 0; i < enemies.length; i++) {
    const o = enemies[i];
    if (o.dead || o.burnTimer > 0) continue;
    if ((o.x - e.x) * (o.x - e.x) + (o.y - e.y) * (o.y - e.y) < r2) applyBurn(o, dps, 3);
  }
}

function killEnemy(e, dx, dy) {
  if (e.dead) return; e.dead = true;
  stats.kills++;
  const p = player;
  if (p.swT > 0) secondWindRevive();    // 殊死一搏期间的反杀（击杀 Boss 同样算）
  else if (p.alive && UPS.gunzerker.lvl) { p.gzKills++; if (p.gunzT <= 0 && p.gzKills >= 30) { p.gzKills -= 30; startGunzerker(); } }   // 双持狂暴：每累计击杀 30 人触发（击杀 Boss 同样计数）
  if (e.boss) { killBoss(e); return; }  // 关底 Boss：走独立的死亡与战利品流程
  if (e.burnTimer > 0) fireSpread(e);   // 燃烧中的敌人死亡：引燃身边的人（被烧死 / 被打死 / 自爆都算）
  if (e.type === 1) { fuses.push({ x: e.x, y: e.y, t: rand(0.05, 0.16), kind: 'bomber' }); return; }   // 自爆矮人 / 自爆无人机：短引信后爆炸
  SFX.kill();
  const blood = e.type === 0 ? ['#C0281F', '#8F1510', '#E9CDA6'] : ['#C0281F', '#8F1510', '#7B828A'];
  const n = e.elite ? 10 : 4;
  for (let i = 0; i < n; i++) { const a = rand(TAU), s = rand(60, e.elite ? 420 : 260); addPart('chunk', e.x, e.y, Math.cos(a) * s + dx * 120, Math.sin(a) * s + dy * 120, rand(0.35, 0.7), rand(2.5, e.elite ? 7 : 5), pick(blood), rand(TAU)); }
  addDecal('splat', e.x, e.y, e.r * (e.elite ? 1.5 : 1.1));
  if ((Math.random() < 0.22 && e.type === 2) || e.elite) addWord(pick(KILL_WORDS), e.x, e.y - e.r - 10, '#FFD23F', e.elite ? 40 : 26, 'kill', 450);
  dropXp(e);
  if (e.elite) { spawnDrop('chest', e.x, e.y); if (addShakeAt(e.x, e.y, 8) > 0.4) hitStop = Math.max(hitStop, 0.06); }
  else if (Math.random() < 0.005) spawnDrop('chest', e.x, e.y);
  if (Math.random() < (player.hp < player.hpMax * 0.4 ? 0.07 : 0.03)) spawnDrop('hp', e.x, e.y);
  addShakeAt(e.x, e.y, e.type === 2 ? 3 : 1);
}

/* 爆炸：对范围内敌人造成衰减伤害（可误伤），范围内的玩家同样受伤（dmgP > 0 时），可引爆附近油桶。tag 为结算页上的伤害来源（默认"环境爆炸"） */
function explode(x, y, radius, dmgE, dmgP, big, tag) {
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i]; if (e.dead) continue;
    const dx = e.x - x, dy = e.y - y, d = hyp(dx, dy) || 1;
    if (d > radius + e.r) continue;
    applyDamage(e, dmgE * (1 - 0.45 * d / (radius + e.r)), { sourceTag: tag || 'blast', kx: dx / d, ky: dy / d, kb: 3.5 });
  }
  // 玩家同样只在自己站在爆炸范围内时才受伤，衰减和敌人一致（边缘处 55%）。
  // v1.4.1 之前这一行没有距离判定：自爆矮人 / 无人机在地图任何角落死掉，玩家都会隔空吃满伤害（"疯子军团"一波刷出一圈自爆怪时最明显）
  if (dmgP > 0 && player.alive) {
    const dx = player.x - x, dy = player.y - y, d = hyp(dx, dy) || 1;
    if (d < radius + player.r) hurtPlayer(dmgP * (1 - 0.45 * d / (radius + player.r)), x, y);
  }
  for (let i = solidsNear.length - 1; i >= 0; i--) { const q = solidsNear[i]; if (q.type === 'barrel' && hyp(q.x - x, q.y - y) < radius + 16) igniteBarrel(q, rand(0.08, 0.2)); }   // 倒序：点燃会从 solidsNear 移除
  booms.push({ x, y, r: radius, t: 0, max: big ? 0.55 : 0.45, rot: rand(TAU), pts: starPts(12, 0.38), ring: false });
  const n = big ? 9 : 6;
  for (let i = 0; i < n; i++) { const a = rand(TAU), s = rand(60, big ? 340 : 230); addPart('smoke', x + Math.cos(a) * 14, y + Math.sin(a) * 14, Math.cos(a) * s, Math.sin(a) * s, rand(0.35, 0.6), rand(6, big ? 14 : 10), i % 3 ? '#4A3C32' : '#7A6A5A'); }
  for (let i = 0; i < 12; i++) { const a = rand(TAU), s = rand(200, 520); addPart('spark', x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.2, 0.45), 2.5, i % 2 ? '#FFD23F' : '#FF8A1E'); }
  addDecal('scorch', x, y, radius * 0.7);
  const sf = addShakeAt(x, y, big ? 18 : 12);   // 离玩家越远震得越轻
  if (big && sf > 0.4) hitStop = Math.min(0.12, Math.max(hitStop, 0.04));   // 只有大爆炸（油桶）且离玩家不远才顿帧：自爆怪 / 无人机这类频繁的小爆炸不顿帧，免得打着发卡
  addWord(big ? 'KA-BOOM!' : 'BOOM!', x, y - 20, '#FF9A1F', big ? 56 : 44, 'boom', 120);
  SFX.boom();
}

/* ---- 泰迪尔：换弹 = 手雷。把手里的枪朝准星掷出，落到准星处（或半路撞上敌人 / 掩体）时炸开；残弹比例越高伤害越高 ---- */
function throwGun(frac) {
  const p = player, l = UPS.tediore.lvl, md = WEAPONS[p.weapon].muzzle;
  let dx = mouse.wx - p.x, dy = mouse.wy - p.y, d = hyp(dx, dy) || 1;
  if (d < 40) { dx = Math.cos(p.aim); dy = Math.sin(p.aim); d = 1; }                     // 准星贴在身上时：沿瞄准方向掷出
  const dist = clamp(d, 110, 330);
  throws.push({ x: p.x + Math.cos(p.aim) * md, y: p.y + Math.sin(p.aim) * md, tx: p.x + dx / d * dist, ty: p.y + dy / d * dist, rot: p.aim, w: p.weapon,
    dmg: 250 * l * dmgScale() * (1 + UPS.damage.val) * (0.6 + 0.4 * clamp(frac, 0, 1)) });   // 空弹匣 60% → 满弹匣 100%
  SFX.throwGun();
}
function updateThrows(dt) {
  for (let i = throws.length - 1; i >= 0; i--) {
    const t = throws[i], dx = t.tx - t.x, dy = t.ty - t.y, d = hyp(dx, dy) || 1, step = 820 * dt;
    t.rot += dt * 24;
    if (d <= step) { t.x = t.tx; t.y = t.ty; tedioreBlast(t); throws.splice(i, 1); continue; }
    t.x += dx / d * step; t.y += dy / d * step;
    if (Math.random() < 0.6) addPart('smoke', t.x, t.y, rand(-20, 20), rand(-30, 0), rand(0.25, 0.4), rand(3, 5), '#D9B377');
    let hit = false;
    for (let j = 0; j < solidsNear.length && !hit; j++) { const q = solidsNear[j]; if (!q.dead && q.hard && hitSolid(q, t.x, t.y, 8)) hit = true; }
    for (let j = 0; j < enemies.length && !hit; j++) { const e = enemies[j]; if (!e.dead && hyp(e.x - t.x, e.y - t.y) < e.r + 9) hit = true; }
    if (hit) { tedioreBlast(t); throws.splice(i, 1); }
  }
}
function tedioreBlast(t) {
  const R = 110 + 10 * (UPS.tediore.lvl - 1);
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i]; if (e.dead) continue;
    const dx = e.x - t.x, dy = e.y - t.y, d = hyp(dx, dy) || 1;
    if (d > R + e.r) continue;
    applyDamage(e, t.dmg * (1 - 0.4 * d / (R + e.r)), { sourceTag: 'tediore', kx: dx / d, ky: dy / d, kb: 5, textCol: '#FFF2A8' });
  }
  for (let i = solidsNear.length - 1; i >= 0; i--) { const q = solidsNear[i]; if (q.type === 'barrel' && hyp(q.x - t.x, q.y - t.y) < R + 16) igniteBarrel(q, rand(0.08, 0.2)); }
  booms.push({ x: t.x, y: t.y, r: R, t: 0, max: 0.55, rot: rand(TAU), pts: starPts(12, 0.38), ring: false });
  for (let i = 0; i < 12; i++) {   // 硕大的漫画黑烟云
    const a = i / 12 * TAU + rand(-0.2, 0.2), s = rand(50, 190);
    addPart('smoke', t.x + Math.cos(a) * 12, t.y + Math.sin(a) * 12, Math.cos(a) * s, Math.sin(a) * s - 30, rand(0.5, 0.85), rand(10, 16), i % 3 ? '#4A3C32' : '#7A6A5A');
  }
  for (let i = 0; i < 16; i++) { const a = rand(TAU), s = rand(220, 560); addPart('spark', t.x, t.y, Math.cos(a) * s, Math.sin(a) * s, rand(0.2, 0.45), 2.6, i % 2 ? '#FFD23F' : '#FF8A1E'); }
  addDecal('scorch', t.x, t.y, R * 0.7); if (addShakeAt(t.x, t.y, 14) > 0.4) hitStop = Math.max(hitStop, 0.04);
  addWord('KABOOM!', t.x, t.y - 24, '#FF9A1F', 60, 'tediore', 300); SFX.boom();
}

function igniteBarrel(p, delay) {
  if (p.dead) return; p.dead = true; deadBarrels.add(p.id);
  const i = solidsNear.indexOf(p); if (i >= 0) solidsNear.splice(i, 1);
  fuses.push({ x: p.x, y: p.y, t: delay || 0.06, kind: 'barrel' });
}

function updateFuses(dt) {
  for (let i = fuses.length - 1; i >= 0; i--) {
    const f = fuses[i]; f.t -= dt;
    if (f.t <= 0) {
      fuses.splice(i, 1);
      if (f.kind === 'barrel') explode(f.x, f.y, 140, 95 * (1 + gameTime / 200), 0, true);
      else explode(f.x, f.y, 118, 60 * (1 + gameTime / 200), 30 * dmgScale(), false);
    }
  }
}

/* ============================================================
   第四轮：关底 Boss 战
   每 3 分钟（180 / 360 / 540 秒 …）登场一个关底 Boss：1.8 秒定格出场 → 顶部独立血条 → 血量过半进入狂暴阶段。
   所有 Boss 攻击都遵守"先地面红框预警、后判定伤害"，冲刺无敌可以硬穿。
   Boss 是 enemies 里的一员（e.boss），所以 12 个词条的结算（暴击 / 紫渣 / 腐蚀 / 灼烧 / 电弧 / 火箭 / 弹射 / 新星 …）原样生效；
   区别只有两点：免疫击退（kbRes = 1）、电击减速减半（移速 ×0.7，而不是小兵的 ×0.4）。
   r 碰撞半径 · col 主题色 · col2 辅色 · dark 深色 · sub 定格出场的荒诞副标题（血量见 bossHP，按登场序号递增）
   ============================================================ */
const BOSS_DEFS = [
  { name: '轰炸狂人', name2: '布姆·博姆', en: 'BOOM BEWM', sub: '"他把你的头盖骨当成了烟灰缸！"', col: '#FF6A1E', col2: '#FFD23F', dark: '#3A0F0C', r: 44 },
  { name: '亥伯龙实验体', name2: 'W4R-D3N 构造体', en: 'W4R-D3N', sub: '"微笑服务已过期，现在只提供碾压。"', col: '#FFD23F', col2: '#35B9FF', dark: '#0B1D3A', r: 42 },
  { name: '血翼变异体', name2: '元素领主', en: 'BLOODWING', sub: '"它尝遍了潘多拉的每一种元素，现在想尝尝你。"', col: '#E8452C', col2: '#8CFF3A', dark: '#1F0A2E', r: 46 }
];
const BOSS_INTRO = 1.8;   // 定格出场时长（秒）
/* Boss 血量：按登场序号（每 3 分钟一个）沿玩家的成长曲线递增。曲线来自实测——用游戏自己的抽卡规则随机组 build、
   对木桩持续输出：3 分钟中位约 200 / 秒，之后每个 3 分钟约 ×4.4、×2.25、×1.95、×1.95 …。
   每个血量都定在"中位输出 × 约 36 秒"：实际战斗要躲预警，输出大约只有站桩的 2/3，所以中位 build 实战约 50 秒击杀 */
const BOSS_DPS_STEP = [1, 4.4, 9.9, 19.3, 37.6];
function bossHP(idx) { return Math.round(7200 * (idx < BOSS_DPS_STEP.length ? BOSS_DPS_STEP[idx] : BOSS_DPS_STEP[4] * Math.pow(1.95, idx - 4)) / 100) * 100; }
function bossDmg(e) { return dmgScale() * (1 + 0.25 * e.cycle); }   // Boss 伤害：随游戏时间与轮次（加强版）递增
function bossBarOn() { return !!boss && bossIntro <= 0 && state !== ST.OVER; }
function muteRect() { const m = uiRects.mute; return { x: m.x, y: m.y + (bossBarOn() ? 56 : 0), w: m.w, h: m.h }; }   // Boss 战期间顶部让位给 Boss 血条
function bossCols(e) { return e.kind === 0 ? ['#B5452A', '#D9713F', '#5E656D', '#33363D'] : e.kind === 1 ? ['#FFD23F', '#F4F1E8', '#7B828A', '#33363D'] : ['#7A1F2A', '#A9323C', '#5E1A2A', '#8E2A3A']; }

/* 关底 Boss 登场：选定位置 → 生成 → 清掉远处的残留小怪 → 进入 1.8 秒定格出场。kind 仅供测试指定，正常按 3 个一轮轮换 */
function startBossFight(kind) {
  const idx = bossN, cycle = Math.floor(idx / 3), k = kind === undefined ? idx % 3 : kind, D = BOSS_DEFS[k], p = player;
  let x = p.x + 300, y = p.y;
  const a0 = Math.random() * TAU;
  for (let n = 0; n < 16; n++) {   // 登场位置：离玩家 300px 的开阔处（优先左右方向，横向视野更宽）
    const i = n < 8 ? n * 2 : (n - 8) * 2 + 1, a = a0 + i / 16 * TAU, cx = p.x + Math.cos(a) * 300, cy = p.y + Math.sin(a) * 300;
    let clear = true;
    for (let j = 0; j < solidsNear.length && clear; j++) { const q = solidsNear[j]; if (!q.dead && hyp(q.x - cx, q.y - cy) < (q.br || q.cr) + D.r + 24) clear = false; }
    if (clear) { x = cx; y = cy; break; }
  }
  const hp = bossHP(idx), ta = Math.atan2(p.y - y, p.x - x);
  const e = {
    boss: true, kind: k, cycle, type: 3, x, y, r: D.r, scale: 1, hp, hpMax: hp, hpGhost: hp, hpGhostT: 0,
    kbRes: 1, mass: 60, dead: false, elite: false, flash: 0, spawnT: 0, kx: 0, ky: 0,
    burnTimer: 0, burnTick: 0, burnDps: 0, burnAcc: 0, shockSlowTimer: 0, corrosiveTimer: 0, slagTimer: 0, armT: 0, awayT: 0,   // 状态计时器与小兵同一套
    ang: ta, walk: 0, t: rand(TAU), wob: 0, dk: 2, vis: true, blk: false, side: 1,
    phase: 1, st: 'move', stT: 0, age: 0, rate: 1, tur: ta, trec: 0, dir: Math.random() < 0.5 ? 1 : -1, dirT: rand(2.5, 4), mvx: 0, mvy: 0
  };
  if (k === 0) { e.mT = 1.6; e.sT = 3; e.cT = 5; e.chgA = ta; e.chgD = 0; }                                              // 迫击炮 / 齐射 / 冲锋计时
  else if (k === 1) { e.lT = 2.2; e.dT = 4; e.rT = 2; e.lA = ta; e.lDir = 1; e.lRev = 1.2; e.nB = 2; e.lSpd = 0.55; e.lDur = 3.5; }   // 激光 / 无人机 / 环形弹幕计时
  else { e.bT = 2; e.fT = 4.2; e.fw = 0; e.fwT = 0; e.el = 'fire'; e.txA = ta; e.sT = 5; e.sx = x; e.sy = y; e.fired = false; e.over = false; }   // 吐息 / 羽毛 / 砸地计时
  enemies.push(e);
  boss = e; bossN++; vaultPending = true; bossIntro = BOSS_INTRO;
  bossNextT += 180; if (bossNextT < gameTime + 120) bossNextT = gameTime + 120;   // 下一个 Boss：下一个 3 分钟整点，但至少隔 2 分钟
  warns.length = 0; ebullets.length = 0; zones.length = 0; rings.length = 0;
  for (let i = 0; i < enemies.length; i++) { const o = enemies[i]; if (!o.boss && hyp(o.x - p.x, o.y - p.y) > 760) o.dead = true; }   // 清场：只留屏幕附近的残留小怪
  banner = null;
  for (let i = words.length - 1; i >= 0; i--) if (words[i].screen) poolKill(words, wordPool, i);   // 定格画面不让上一刻的屏幕大字（BOSS DEFEATED! 等）压住
  SFX.bossIntro();
}

function updateBoss(e, dt) {
  const p = player;
  e.stT += dt;
  if (e.hpGhost < e.hp) e.hpGhost = e.hp;
  else if (e.hpGhost > e.hp) { if (e.hpGhostT > 0) e.hpGhostT -= dt; else e.hpGhost = Math.max(e.hp, e.hpGhost - e.hpMax * 0.3 * dt); }
  if (e.phase === 1 && e.hp <= e.hpMax * 0.5) bossEnrage(e);
  if (e.st !== 'stun' && e.st !== 'charge') crushCover(e);   // 冲锋中不在这里碾：交给撞墙判定，撞上才会眩晕
  (e.kind === 0 ? updateBossCar : e.kind === 1 ? updateBossWarden : updateBossWing)(e, dt);
  // 实体身体：与玩家重叠时把玩家推到身体边缘（放在移动之后，本帧走过的距离也算进去）。
  // 砸地正好落在不动的玩家身上时，Boss 不会一直叠在玩家身上——叠在一起时没有瞄准方向，玩家打不着，
  // 而巡航方向也是从"Boss → 玩家"算的，会变成零向量卡死
  if (e.st !== 'leap' && !e.dead && p.alive) {
    const dx = p.x - e.x, dy = p.y - e.y, d = hyp(dx, dy), min = e.r + p.r;
    if (d < min) { if (d > 0.01) { p.x += dx / d * (min - d); p.y += dy / d * (min - d); } else p.x += min; }
  }
}

/* 狂暴（第二阶段）：顿帧 + 震屏 + 白闪，炸掉一层外壳 */
function bossEnrage(e) {
  e.phase = 2;
  if (addShakeAt(e.x, e.y, 16) > 0.4) hitStop = Math.max(hitStop, 0.07); whiteFlash = Math.max(whiteFlash, 0.45);
  addWord('ENRAGED!', W / 2, H * 0.27, '#FF3B2E', 68, null, 0, true);
  addWord('狂暴化！', W / 2, H * 0.27 + 60, '#FFD23F', 44, null, 0, true);
  toast(BOSS_DEFS[e.kind].name + ' 进入狂暴阶段！', '#FF5A3C');
  const cols = bossCols(e);
  for (let i = 0; i < 14; i++) { const a = rand(TAU), s = rand(120, 420); addPart('chunk', e.x, e.y, Math.cos(a) * s, Math.sin(a) * s - 60, rand(0.5, 0.9), rand(3, 7), pick(cols), rand(TAU)); }
  for (let i = 0; i < 10; i++) { const a = i / 10 * TAU; addPart('spark', e.x, e.y, Math.cos(a) * 380, Math.sin(a) * 380, 0.4, 2.6, '#FFD23F'); }
  booms.push({ x: e.x, y: e.y, r: 150, t: 0, max: 0.5, rot: 0, pts: null, ring: true, c1: '#FF3B2E', c2: '#FFD23F', delay: 0 });
  SFX.bossRage();
}

/* Boss 推开 / 撞碎路上的掩体：岩石、集装箱、仙人掌、路牌直接碾碎，油桶被撞上会引爆（能炸伤 Boss 自己） */
function crushCover(e) {
  for (let i = solidsNear.length - 1; i >= 0; i--) { const q = solidsNear[i]; if (!q.dead && hitSolid(q, e.x, e.y, e.r * 0.95)) crushProp(q, false); }
}
function crushProp(q, big) {
  if (q.type === 'barrel') { igniteBarrel(q, 0.05); return; }
  q.dead = true;
  const box = q.type === 'box', n = big ? 12 : 7, cols = box ? ['#C8552A', '#2A8C8C', '#6E7B8A', '#46515E'] : q.type === 'cactus' ? ['#4E9B4B', '#35743A'] : ['#5E5245', '#94836C', '#3B2A1D'];
  for (let i = 0; i < n; i++) { const a = rand(TAU), s = rand(40, big ? 300 : 180); addPart('chunk', q.x + rand(-14, 14), q.y + rand(-14, 14), Math.cos(a) * s, Math.sin(a) * s - 40, rand(0.4, 0.8), rand(3, 7), pick(cols), rand(TAU)); }
  for (let i = 0; i < 4; i++) addPart('smoke', q.x + rand(-12, 12), q.y + rand(-12, 12), rand(-40, 40), rand(-60, -10), rand(0.4, 0.7), rand(6, 10), '#7A6A5A');
  if (!big) addShakeAt(q.x, q.y, 2.5);
}

/* ---- Boss 弹幕（高爆炮弹 / 能量球 / 羽毛飞刀）：撞到玩家或硬掩体即结算，冲刺无敌期间直接穿过去 ---- */
const EB_MAX = 90;
function spawnEB(kind, x, y, a, sp, o) {
  if (ebullets.length >= EB_MAX) ebullets.shift();
  o = o || {};
  ebullets.push({ kind, x, y, a, sp, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: o.r || 6, dmg: o.dmg || 10, life: o.life || 3, home: o.home || 0, homeT: o.homeT || 0, seed: rand(TAU) });
}
function updateEBullets(dt) {
  const p = player;
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i]; b.life -= dt;
    if (b.life <= 0) { ebBoom(b, i, false); continue; }   // 炮弹飞到射程尽头也会炸
    if (b.homeT > 0 && p.alive) {   // 羽毛：追踪微调
      b.homeT -= dt; b.a = lerpAng(b.a, Math.atan2(p.y - b.y, p.x - b.x), Math.min(1, b.home * dt)); b.vx = Math.cos(b.a) * b.sp; b.vy = Math.sin(b.a) * b.sp;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (Math.abs(b.x - cam.x) > vw + 200 || Math.abs(b.y - cam.y) > vh + 200) { ebullets.splice(i, 1); continue; }
    let stop = false;
    for (let j = 0; j < solidsNear.length && !stop; j++) { const q = solidsNear[j]; if (!q.dead && q.hard && hitSolid(q, b.x, b.y, b.r)) stop = true; }
    if (stop || (p.alive && p.swT <= 0 && hyp(p.x - b.x, p.y - b.y) < b.r + p.r)) { ebBoom(b, i, !stop); continue; }
    if (b.kind === 'shell') {   // 尾焰 + 灰烟
      if (Math.random() < 0.8) addPart('smoke', b.x - b.vx * 0.035, b.y - b.vy * 0.035, rand(-14, 14), rand(-14, 14) - 8, rand(0.3, 0.5), rand(3, 5), '#7A6A5A');
      if (Math.random() < 0.7) addPart('spark', b.x - b.vx * 0.015, b.y - b.vy * 0.015, -b.vx * rand(0.1, 0.25) + rand(-40, 40), -b.vy * rand(0.1, 0.25) + rand(-40, 40), rand(0.1, 0.2), 2, Math.random() < 0.5 ? '#FF8A1E' : '#FFD23F');
    }
    else if (b.kind === 'feather' && Math.random() < 0.25) addPart('spark', b.x, b.y, rand(-30, 30), rand(-30, 30), 0.15, 1.6, '#D45CFF');
  }
}
function ebBoom(b, i, onPlayer) {
  ebullets.splice(i, 1);
  if (b.kind === 'shell') { bossBlast(b.x, b.y, 76, b.dmg); return; }   // 高爆炮弹：落点范围内都吃伤害（带衰减）
  const col = b.kind === 'orb' ? '#5FF3FF' : '#D45CFF';
  for (let j = 0; j < 5; j++) { const a = rand(TAU), s = rand(60, 200); addPart('spark', b.x, b.y, Math.cos(a) * s, Math.sin(a) * s, rand(0.12, 0.25), 2, col); }
  if (onPlayer) { hurtPlayer(b.dmg, b.x - b.vx * 0.01, b.y - b.vy * 0.01); SFX.hit(); }
}

/* Boss 的爆炸（迫击炮 / 高爆炮弹落点）：只伤玩家，不出现在结算的伤害来源里 */
function bossBlast(x, y, R, dmg) {
  const p = player;
  if (p.alive) { const d = hyp(p.x - x, p.y - y); if (d < R + p.r) hurtPlayer(dmg * (1 - 0.45 * d / (R + p.r)), x, y); }
  booms.push({ x, y, r: R, t: 0, max: 0.42, rot: rand(TAU), pts: starPts(10, 0.4), ring: false });
  for (let i = 0; i < 5; i++) { const a = rand(TAU), s = rand(40, 150); addPart('smoke', x + Math.cos(a) * 10, y + Math.sin(a) * 10, Math.cos(a) * s, Math.sin(a) * s - 30, rand(0.4, 0.65), rand(7, 11), i % 3 ? '#4A3C32' : '#7A6A5A'); }
  for (let i = 0; i < 9; i++) { const a = rand(TAU), s = rand(180, 440); addPart('spark', x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.18, 0.38), 2.4, i % 2 ? '#FFD23F' : '#FF8A1E'); }
  addDecal('scorch', x, y, R * 0.7);
  addShakeAt(x, y, 7);
  if (p.alive && hyp(p.x - x, p.y - y) < R + 60) hitStop = Math.max(hitStop, 0.025);   // 只有炸点贴近玩家才顿帧：地毯轰炸不再把世界拖成慢动作
  addWord('KABOOM!', x, y - 18, '#FF9A1F', 44, 'kboss', 140); SFX.boom();
}

/* ---- 地面红色预警圈：计时结束才爆炸 ---- */
function updateWarns(dt) {
  for (let i = warns.length - 1; i >= 0; i--) { const w = warns[i]; w.t -= dt; if (w.t <= 0) { warns.splice(i, 1); bossBlast(w.x, w.y, w.r, w.dmg); } }
}
/* ---- 残留危险区（吐息留下的燃烧 / 酸液地面）：持续 3 秒，站在里面持续掉血 ---- */
function updateZones(dt) {
  const p = player;
  for (let i = zones.length - 1; i >= 0; i--) {
    const z = zones[i]; z.t += dt;
    if (z.t >= z.max) { zones.splice(i, 1); continue; }
    const dx = p.x - z.x, dy = p.y - z.y, d = hyp(dx, dy);
    if (p.alive && p.swT <= 0 && d < z.len + p.r * 0.5 && Math.abs(wrapA(Math.atan2(dy, dx) - z.a)) < z.half + Math.atan2(p.r * 0.7, d || 1)) hurtPlayer(14 * bossDmg(z), z.x, z.y);
    if (Math.random() < dt * 46) {   // 区内不断窜出火苗 / 酸液气泡
      const a = z.a + rand(-z.half, z.half) * 0.9, r = 24 + Math.random() * (z.len - 30), x = z.x + Math.cos(a) * r, y = z.y + Math.sin(a) * r;
      if (z.el === 'acid') addPart('acid', x, y, rand(-12, 12), rand(-40, -10), rand(0.4, 0.7), rand(2.2, 3.6), '#8CFF3A');
      else addFlame(x, y, rand(-14, 14), rand(-50, -16), rand(0.3, 0.55), rand(3.5, 6));
    }
  }
}
/* ---- 砸地冲击波环：向外扩张的一道环，碰到玩家结算一次 ---- */
function updateRings(dt) {
  const p = player;
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.r += r.speed * dt;
    if (!r.hit && p.alive) {
      const d = hyp(p.x - r.x, p.y - r.y);
      if (Math.abs(d - r.r) < r.w / 2 + p.r) { r.hit = true; hurtPlayer(r.dmg, r.x, r.y); if (d > 1) { p.kbx += (p.x - r.x) / d * 380; p.kby += (p.y - r.y) / d * 380; } }
    }
    if (r.r >= r.maxR) rings.splice(i, 1);
  }
}

/* ====================== Boss 1 布姆·博姆 ======================
   P1：地毯式迫击炮（玩家周围 6 个红圈，1.2 秒后落地）+ 扇形 5 发高爆炮弹
   P2：外壳炸裂冒黑烟、提速；每 5 秒锁定玩家方向画出长条红色预警（0.8 秒）→ 高速直线冲锋，撞到掩体或冲到头都会眩晕 1 秒 */
function updateBossCar(e, dt) {
  const p = player, rage = e.phase === 2, slow = e.shockSlowTimer > 0 ? 0.7 : 1, kf = Math.exp(-dt * 8), dm = bossDmg(e);
  e.tur = lerpAng(e.tur, Math.atan2(p.y - e.y, p.x - e.x), 1 - Math.exp(-dt * 4));   // 迫击炮塔独立追踪玩家
  if (e.trec > 0) e.trec = Math.max(0, e.trec - dt * 5);
  if (e.st === 'stun') {   // 冲锋后的眩晕：滑行减速，头顶转星星

/* 触碰秘藏宝箱：回 30% 生命，立刻免费触发一次"必出传奇橙 / 稀有蓝"的三选一（不消耗经验），并恢复正常刷怪 */

/* ============================================================
   掉落物：经验晶体 / 回血包 / 武器箱
   ============================================================ */
function tierOf(v) { return v >= 20 ? 2 : v >= 3 ? 1 : 0; }
function spawnDrop(type, x, y, v) {

    if (xpCount >= 150) { for (let i = 0; i < drops.length; i++) { const o = drops[i]; if (o.type === 'xp') { o.v += v; o.tier = tierOf(o.v); return; } } }   // 晶体太多时并入已有晶体

  }
  const a = rand(TAU), s = rand(40, 150);
  drops.push({ type, x, y, v: v || 0, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: rand(TAU), sp: 0, mag: false, tier: type === 'xp' ? tierOf(v) : 0, dk: 4, seed: rand(TAU) });
}
function dropXp(e) {
  let v = Math.round(e.xp * (1 + Math.floor(gameTime / 75)));
  while (v >= 20) { spawnDrop('xp', e.x, e.y, 20); v -= 20; }
  while (v >= 3) { spawnDrop('xp', e.x, e.y, 3); v -= 3; }
  if (v > 0) spawnDrop('xp', e.x, e.y, v);
}

function collect(d) {
  if (d.type === 'xp') {
    player.xp += d.v; stats.xp += d.v; xpCount--; SFX.pickup();
    if (UPS.bloodlust.lvl && player.blood < 20) { const was = player.blood; player.blood++; if (was < 20 && player.blood >= 20) SFX.vault(); }   // 肾上腺素：每颗晶体 +1 层狂热
  }
  if (d.type === 'xp' && UPS.bloodlust.lvl) player.bloodT = 0;
  else if (d.type === 'hp') heal(Math.round(player.hpMax * 0.35));
  else if (d.type === 'chest') openChest();
  else if (d.type === 'vault') openVaultChest();
}
function openChest() {
  const avail = Object.keys(UPS).filter(k => !maxedOut(UPS[k]));
  whiteFlash = 0.6; addWord('LOOT!', player.x, player.y - 44, '#FFD23F', 46, null, 0); SFX.loot(); addShake(6);
  for (let i = 0; i < 14; i++) { const a = rand(TAU), s = rand(120, 360); addPart('spark', player.x, player.y - 10, Math.cos(a) * s, Math.sin(a) * s, rand(0.3, 0.6), 3, '#FFD23F'); }
  if (!avail.length) { heal(player.hpMax); toast('宝箱：全部已满级 → 生命全满！', '#FFD23F'); return; }
  const k = pick(avail);
  applyUpgrade(k);
  toast('宝箱：' + UPS[k].name + ' → Lv ' + UPS[k].lvl, TIER[UPS[k].tier].col);
}

function updateEnemies(dt) {
  const p = player, kf = Math.exp(-dt * 8);

    const e = enemies[i]; if (e.dead) continue;
    if (e.flash > 0) e.flash -= dt;

    if (e.corrosiveTimer > 0) { e.corrosiveTimer -= dt; if (Math.random() < dt * 7) addPart('acid', e.x + rand(-e.r, e.r) * 0.7, e.y + rand(-e.r, e.r) * 0.5, rand(-14, 14), rand(20, 50), rand(0.45, 0.7), rand(2, 3.4) * (e.boss ? 2.6 : e.scale), '#8CFF3A'); }   // 腐蚀：往下滴的荧光绿气泡

/* 敌人间软分离（基于网格，重装兵质量大，推开小兵） */
function separate() {
  const G = Grid, cs = G.cs, gw = G.gw, gh = G.gh, head = G.head, nxt = G.next;
  if (!gw || !gh) return;
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i]; if (a.dead) continue;
    const cx = clamp(Math.floor(a.x / cs) - G.x0, 0, gw - 1), cy = clamp(Math.floor(a.y / cs) - G.y0, 0, gh - 1);
    const x0 = Math.max(0, cx - 1), x1 = Math.min(gw - 1, cx + 1), y0 = Math.max(0, cy - 1), y1 = Math.min(gh - 1, cy + 1);
    for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++) {
      for (let n = head[gy * gw + gx]; n !== 0; n = nxt[n - 1]) {
        const j = n - 1; if (j <= i) continue;
        const b = enemies[j]; if (b.dead) continue;
        let dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy);
        const min = (a.r + b.r) * 0.92;
        if (d >= min) continue;
        if (d < 0.001) { const an = rand(TAU); dx = Math.cos(an); dy = Math.sin(an); d = 1; } else { dx /= d; dy /= d; }
        const push = min - d, wa = b.mass / (a.mass + b.mass), wb = 1 - wa;
        a.x -= dx * push * wa; a.y -= dy * push * wa; b.x += dx * push * wb; b.y += dy * push * wb;
      }
    }
  }
}

function onBulletHit(b, e) {
  const sp = hyp(b.vx, b.vy) || 1, nx = b.vx / sp, ny = b.vy / sp;
  if (b.rocket) {   // 托格火箭：命中即炸。直接命中的那个敌人顺便吃元素触发；带穿透时炸完继续飞
    rocketBlast(b, b.x, b.y, e);
    if (!e.dead) { if (b.slag) applySlag(e, 4 + UPS.slag.lvl); elementProcs(b, e); }
    if (b.pierce > 0) { b.pierce--; b.dmg *= 0.85; return; }
    b.dead = true; return;
  }
  bulletHit(b, e, nx, ny, 1, false);
  if (b.pierce > 0) { b.pierce--; b.dmg *= 0.85; return; }   // 穿透：继续飞行，伤害衰减
  b.dead = true;
}

/* 子弹碰撞：网格 3x3 邻域查询敌人 + 油桶检测 */
function bulletCollide(b) {
  const G = Grid;
  if (G.gw) {
    const cx = Math.floor(b.x / G.cs) - G.x0, cy = Math.floor(b.y / G.cs) - G.y0;
    for (let gy = cy - 1; gy <= cy + 1; gy++) {
      if (gy < 0 || gy >= G.gh) continue;
      for (let gx = cx - 1; gx <= cx + 1; gx++) {
        if (gx < 0 || gx >= G.gw) continue;
        for (let n = G.head[gy * G.gw + gx]; n !== 0; n = G.next[n - 1]) {
          const e = enemies[n - 1]; if (e.dead) continue;
          const rre = e.r + b.r;
          if (Math.abs(e.x - b.x) > rre || Math.abs(e.y - b.y) > rre) continue;
          const ddx = e.x - b.x, ddy = e.y - b.y; if (ddx * ddx + ddy * ddy > rre * rre) continue;
          if (b.hits.indexOf(e) >= 0) continue;
          b.hits.push(e); onBulletHit(b, e);
          if (b.dead) return true;
        }
      }
    }
  }
  for (let i = 0; i < solidsNear.length; i++) {   // 油桶：打中即引爆；岩石 / 集装箱（hard）：挡住子弹
    const q = solidsNear[i]; if (q.dead) continue;
    const ddx = q.x - b.x, ddy = q.y - b.y, rb = (q.br || q.cr + 3) + b.r;
    if (ddx > rb || ddx < -rb || ddy > rb || ddy < -rb) continue;
    if (q.type === 'barrel') { if (ddx * ddx + ddy * ddy < (14 + b.r) * (14 + b.r)) { b.dead = true; igniteBarrel(q, 0.05); if (b.rocket) rocketBlast(b, b.x, b.y, null); return true; } continue; }
    if (!q.hard || !hitSolid(q, b.x, b.y, b.r)) continue;
    b.dead = true; if (b.rocket) rocketBlast(b, b.x, b.y, null); else coverHit(q, b); return true;   // 火箭撞上掩体也会炸
  }
  return false;
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i]; b.life -= dt;
    if (b.life <= 0) { poolKill(bullets, bulletPool, i); continue; }
    const dx = b.vx * dt, dy = b.vy * dt, steps = Math.max(1, Math.ceil(hyp(dx, dy) / 14));
    let dead = false;
    for (let s = 0; s < steps && !dead; s++) { b.x += dx / steps; b.y += dy / steps; dead = bulletCollide(b); }
    if (b.rocket) {   // 托格火箭：尾部喷出橙色火焰和灰烟
      if (Math.random() < 0.75) addPart('smoke', b.x - b.vx * 0.012, b.y - b.vy * 0.012, rand(-18, 18), rand(-18, 18) - 12, rand(0.3, 0.5), rand(3, 5), Math.random() < 0.5 ? '#7A6A5A' : '#D9B377');
      if (Math.random() < 0.55) addPart('spark', b.x - b.vx * 0.009, b.y - b.vy * 0.009, -b.vx * rand(0.08, 0.2) + rand(-40, 40), -b.vy * rand(0.08, 0.2) + rand(-40, 40), rand(0.1, 0.2), 2, Math.random() < 0.5 ? '#FF8A1E' : '#FFD23F');
    }

    else if (b.style === 2 && Math.random() < 0.08) addPart('spark', b.x, b.y, rand(-60, 60), rand(-60, 60), 0.1, 1.5, '#9FF6FF');   // 电光弹偶尔迸出电火花
    if (!dead && (Math.abs(b.x - cam.x) > vw + 140 || Math.abs(b.y - cam.y) > vh + 140)) dead = true;   // 屏幕外子弹回收
    if (dead) poolKill(bullets, bulletPool, i);

}

function updateDrops(dt) {
  const p = player, fr = Math.exp(-dt * 5);
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i]; d.t += dt;
    d.x += d.vx * dt; d.y += d.vy * dt; d.vx *= fr; d.vy *= fr;
    if (!p.alive) continue;
    const dx = p.x - d.x, dy = p.y - d.y, dd = hyp(dx, dy) || 1;
    if (d.type === 'vault' && d.t < 1) continue;   // 秘藏宝箱落地后 1 秒内不可拾取：让击杀慢动作和满屏 LOOT! 播完
    if (d.type === 'vault' && d.t > 1.4) d.mag = true;   // 1.4 秒后主动飞向玩家，奖励不会漏拾
    if (!d.mag && dd < (d.type === 'vault' ? 240 : p.magnetR * (d.type === 'xp' ? 1 : 1.3))) d.mag = true;   // 进入磁吸范围
    if (d.mag) { d.sp = Math.min(1600, d.sp + 3400 * dt); d.x += dx / dd * d.sp * dt; d.y += dy / dd * d.sp * dt; }
    if (dd < p.r + 12) { collect(d); drops.splice(i, 1); }

}

function sweepEnemies() {
  for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].dead) { const e = enemies[i]; enemies[i] = enemies[enemies.length - 1]; enemies.pop(); if (!e.boss) enemyPool.push(e); }   // Boss 的对象不回收：它带着整套专属字段
}

/* ============================================================
   升级 / 三选一
   ============================================================ */
/* 应用一张卡：等级 +1，数值 = 每级增量 × 等级，到上限为止。上限按"数值"判定（基础属性卡的上限是数值，如射速 +200%，和等级不是一回事） */

function applyUpgrade(key) {
  const u = UPS[key]; if (!u || maxedOut(u)) return;
  u.lvl++; u.val = Math.min(u.cap, u.base * u.lvl);
  recalcStats();
}
function makeCard(key) {
  const u = UPS[key], ex = EXTRA[key], d = ex || u;
  return { key, name: d.name, sub: d.sub || '', type: d.type, tier: d.tier, tag: d.tag || '', desc: d.desc, extra: !!ex,
    isNew: !ex && !u.lvl, fill: ex ? 1 : clamp(u.val / u.cap, 0, 1), lvl: ex ? 0 : u.lvl,
    rot: 0, hover: 0, wasHover: false, x: -9999, y: -9999, w: 0, h: 0 };

function openLevelUp(vault) {
  vaultMode = !!vault;
